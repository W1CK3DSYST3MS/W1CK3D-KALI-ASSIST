[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "w1ck3d-kali-assist"
version = "0.1.0"
description = "W1CK3D'S KALI ASSIST — generate-only learning/reference/troubleshooter for Kali tools."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["wizard_core", "wizard_core.builders", "wizard_core.audit", "wizard_core.auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
