troubleshooter_id: troubleshoot.networking
title: "Networking, DNS & Wi-Fi Troubleshooter"
os_profile: kali
category_color: info
triage:
  - field_id: link_type
    label: "Wired (Ethernet) or Wi-Fi?"
    type: choice
    choices: [wired, wifi]
    required: true
  - field_id: changed
    label: "Did it work before today — what changed (update, reboot, new location)?"
    type: string
  - field_id: adapter
    label: "Built-in adapter or USB?"
    type: choice
    choices: [builtin, usb]
external_resources:
  - title: "Kali docs"
    url: "https://www.kali.org/docs/"
  - title: "Kali forums"
    url: "https://forums.kali.org/"
  - title: "Debian wiki — WiFi/network"
    url: "https://wiki.debian.org/WiFi"
  - title: "Arch Wiki — Network configuration"
    url: "https://wiki.archlinux.org/title/Network_configuration"
  - title: "Unix & Linux Stack Exchange"
    url: "https://unix.stackexchange.com/"
  - title: "On-system manuals"
    note: "man ip · man nmcli · man iw · iw --help"
symptoms:
  - symptom_id: no_internet
    label: "I have no internet at all"
    aliases: [no internet, offline, cant connect, no connection, dead network, no ip]
    diagnosis:
      - step_id: l1
        title: "Do you have an IP address?"
        slot_target: null
        glossary_refs: [ip_address, interface, dhcp, link_state, link_local_address]
        explanation:
          what: "`ip a` shows your interfaces and their addresses."
          why: "An `inet 192.168.x.x` line (not just 127.0.0.1) means link + DHCP worked."
          where: "Diagnostic — read the inet line."
        try_this: "ip a"
        success_criteria: "An inet address on your interface (e.g. eth0/wlan0)."
        alternatives:
          - trigger: "only 127.0.0.1 / no inet"
            cause: "Link down or DHCP didn't assign an address."
            fix: "Bring the interface up and restart NetworkManager (see Basic fixes)."
            check: "Re-run `ip a` after the fix."
          - trigger: "only an inet6 fe80:: address, no inet (IPv4) line"
            cause: "That fe80:: address is link-local — your device gave it to itself. It does not mean you're online; IPv4 DHCP simply never completed even though the link is up."
            fix: "Same fix as no address at all: restart the network stack / reconnect (see Basic fixes below)."
            check: "Re-run `ip a` and look specifically for an `inet` (not `inet6 fe80`) line."
          - trigger: "the interface shows `state DOWN` or `NO-CARRIER`"
            cause: "Wired: the cable is unplugged or the port is dead. Wi-Fi: it was never associated to an access point."
            fix: "Check the physical cable/port, or work the Wi-Fi symptom to associate first."
            check: "`ip a` shows `state UP` with `LOWER_UP` once there's a real link."
      - step_id: l2
        title: "Is there a default route?"
        slot_target: null
        glossary_refs: [gateway]
        explanation:
          what: "`ip route` lists routes; look for `default via ...`."
          why: "Without a default route, traffic can't leave your subnet."
          where: "Diagnostic."
        try_this: "ip route"
        success_criteria: "A line starting `default via ...`."
        alternatives:
          - trigger: "no default route"
            cause: "DHCP didn't provide a gateway."
            fix: "Reconnect the interface, or (lab only) add a static route."
            check: "Re-run `ip route`."
          - trigger: "a default route exists but nothing actually reaches the internet"
            cause: "The route is stale (leftover from a previous network) or there's more than one default route fighting for priority — common right after switching Wi-Fi networks or connecting a VPN."
            fix: "Reconnect the interface for a fresh route; if `ip route` lists two `default` lines, that's the conflict — disconnect the one you're not using."
            check: "`ip route` shows exactly one `default via` line, pointing at the gateway you expect."
      - step_id: l3
        title: "Can you reach the internet by number?"
        slot_target: null
        explanation:
          what: "`ping -c3 1.1.1.1` tests raw connectivity, bypassing DNS."
          why: "If this works but names don't, the problem is DNS, not the link."
          where: "Diagnostic."
        try_this: "ping -c3 1.1.1.1"
        success_criteria: "Replies received."
        alternatives:
          - trigger: "replies, but names fail"
            cause: "It's DNS, not connectivity."
            fix: "Switch to the 'websites won't load by name' symptom (DNS)."
            check: "Try `ping -c3 example.com`."
          - trigger: "no replies"
            cause: "Link/route still broken."
            fix: "Work the Basic/Intermediate fixes below."
            check: "Recheck `ip a` / `ip route`."
          - trigger: "some replies arrive, some time out (partial loss, not a clean pass/fail)"
            cause: "Not a hard failure — a weak Wi-Fi signal, a flaky cable/driver, or wireless interference."
            fix: "Switch to the 'connects but is slow or keeps dropping' symptom."
            check: "Run a longer test — `ping -c20 1.1.1.1` — and look at the loss percentage in the summary."
    fixes:
      - fix_id: nm_restart
        tier: basic
        title: "Restart the network stack"
        command: "sudo systemctl restart NetworkManager"
        why: "Clears a stuck manager/DHCP."
        verify: "Re-run `ip a` -> expect an IP within ~10s."
        destructive: true
        recovery: "Restarting drops managed connections briefly; they reconnect automatically."
      - fix_id: iface_up
        tier: basic
        title: "Bring the interface up"
        command: "sudo ip link set <iface> up"
        why: "The interface may be administratively down."
        verify: "`ip a` shows `state UP`."
      - fix_id: rfkill
        tier: basic
        title: "Unblock a soft-blocked radio"
        command: "rfkill list  # if Soft blocked: yes -> sudo rfkill unblock wifi"
        why: "A soft block disables Wi-Fi entirely."
        verify: "`rfkill list` shows Soft blocked: no."
      - fix_id: nm_status
        tier: intermediate
        title: "Check NetworkManager is running"
        command: "systemctl status NetworkManager  # if not: sudo systemctl enable --now NetworkManager"
        why: "If the manager isn't running, nothing gets configured."
        verify: "Status shows active (running)."
      - fix_id: nm_inspect
        tier: intermediate
        title: "Inspect/renew connections"
        command: "nmcli device status; nmcli connection show; sudo nmcli device connect <iface>"
        why: "Reapply or reconnect to re-trigger DHCP."
        verify: "Device shows `connected`; `ip a` has an address."
      - fix_id: journal
        tier: extensive
        title: "Read the actual failure"
        command: "journalctl -u NetworkManager -e; dmesg | grep -iE 'eth|wlan'"
        why: "Surfaces driver/link errors and the real reason for failure."
        verify: "Identify the specific error to act on."
  - symptom_id: dns_fail
    label: "Some things work but websites won't load by name"
    aliases: [dns, name resolution, cant resolve, resolv.conf, nameserver, names dont load]
    diagnosis:
      - step_id: dns1
        title: "Confirm it's DNS"
        slot_target: null
        glossary_refs: [dns, nameserver]
        explanation:
          what: "`ping 1.1.1.1` works AND `ping example.com` fails -> it's DNS."
          why: "Isolates name resolution from connectivity."
          where: "Diagnostic."
        try_this: "ping -c3 1.1.1.1 && ping -c3 example.com"
        success_criteria: "The IP ping works; the name ping fails."
        alternatives:
          - trigger: "both fail"
            cause: "This is a connectivity problem, not DNS."
            fix: "Switch to the 'no internet at all' symptom."
            check: "Recheck `ip a` / `ip route`."
          - trigger: "some domains resolve fine, others don't (not all-or-nothing)"
            cause: "Not total DNS failure — likely a specific resolver having trouble with that domain, a stale cached answer, or (on some networks) a captive portal/filter only intercepting certain lookups."
            fix: "Query the failing domain against a public resolver directly: `dig @1.1.1.1 <domain>`. If that works, your configured resolver is the problem — switch resolvers (see fixes below)."
            check: "The direct `dig @1.1.1.1` query succeeds even when the normal lookup didn't."
    fixes:
      - fix_id: check_resolvers
        tier: basic
        title: "Check resolvers"
        command: "cat /etc/resolv.conf"
        why: "There must be a working `nameserver` line."
        verify: "At least one nameserver is present."
      - fix_id: set_dns
        tier: basic
        title: "Set a working resolver via NetworkManager"
        command: "nmcli connection modify <name> ipv4.dns \"1.1.1.1 9.9.9.9\"; nmcli connection up <name>"
        why: "Don't hand-edit resolv.conf if NM manages it."
        verify: "`ping example.com` resolves."
      - fix_id: resolved
        tier: intermediate
        title: "Is systemd-resolved in play?"
        command: "resolvectl status; systemctl status systemd-resolved"
        why: "If resolv.conf points to 127.0.0.53, resolved is the stub resolver."
        verify: "Confirm which component owns DNS."
      - fix_id: test_resolver
        tier: intermediate
        title: "Test a specific resolver directly"
        command: "dig @1.1.1.1 example.com  # or: nslookup example.com 1.1.1.1"
        why: "Separates 'DNS server down' from 'local config wrong'."
        verify: "A direct query resolves."
      - fix_id: flush_cache
        tier: extensive
        title: "Stale cached answer (especially after switching networks/VPN)"
        command: "sudo resolvectl flush-caches  # or: sudo systemctl restart systemd-resolved"
        why: "A cached bad or 'no such domain' answer can keep failing even after the real cause is fixed."
        verify: "The previously-failing domain now resolves."
  - symptom_id: wifi_connect
    label: "My Wi-Fi won't connect / I see no networks"
    aliases: [wifi, wireless, ssid, no networks, wont connect, wlan]
    diagnosis:
      - step_id: wc1
        title: "Does it see networks at all, or fail after you pick one?"
        slot_target: null
        glossary_refs: [ssid]
        explanation:
          what: "`nmcli device wifi list` scans and shows nearby networks (SSIDs) with their signal strength."
          why: "This splits two very different problems: 'I can't even see my network' (radio/driver/range) vs 'I see it but can't join' (wrong password/stale profile)."
          where: "Diagnostic."
        try_this: "nmcli device wifi list"
        success_criteria: "Your network's name (SSID) appears in the list."
        alternatives:
          - trigger: "your SSID never appears, but neighboring networks do"
            cause: "Hidden network, your router is 5GHz-only and your adapter can't see 5GHz, or you're out of range."
            fix: "For a hidden network: `nmcli device wifi connect \"<SSID>\" password \"<password>\" hidden yes`. Otherwise move closer to the router or check which bands your adapter supports."
            check: "The SSID appears, or the hidden-network connect command succeeds."
          - trigger: "no networks appear at all, not even neighbors'"
            cause: "This isn't about your specific network — the radio is blocked or the adapter/driver isn't working."
            fix: "Run the 'unblock radios' fix below; if still nothing, switch to the 'adapter isn't showing up' symptom."
            check: "`rfkill list` shows no blocks and `iw dev` lists the interface."
          - trigger: "you see it, try to connect, and it fails or loops asking for the password again"
            cause: "Wrong password, or a stale saved connection profile from a previous attempt."
            fix: "See the 'Wrong password / auth loop' fix below."
            check: "`nmcli connection show` reports it connected after retrying."
    fixes:
      - fix_id: unblock
        tier: basic
        title: "Unblock radios"
        command: "rfkill list; sudo rfkill unblock all"
        why: "A soft/hard block hides all Wi-Fi."
        verify: "`rfkill list` shows no blocks."
      - fix_id: list_connect
        tier: basic
        title: "See networks and connect"
        command: "nmcli device wifi list; nmcli device wifi connect \"<SSID>\" password \"<password>\""
        why: "Scans and joins a network."
        verify: "`nmcli device status` shows the Wi-Fi device connected."
      - fix_id: reauth
        tier: intermediate
        title: "Wrong password / auth loop"
        command: "nmcli connection delete \"<SSID>\"  # then reconnect"
        why: "A stale saved profile can loop on auth."
        verify: "Reconnect succeeds with the correct password."
      - fix_id: regdom
        tier: extensive
        title: "Regulatory domain hiding channels"
        command: "iw reg get; sudo iw reg set <CC>"
        why: "Wrong country code can hide channels/bands."
        verify: "Expected networks/channels appear."
  - symptom_id: adapter_missing
    label: "My Wi-Fi/network adapter isn't showing up at all"
    aliases: [adapter, interface missing, no wlan0, driver, firmware, not recognized]
    diagnosis:
      - step_id: am1
        title: "Is the hardware detected at all?"
        slot_target: null
        glossary_refs: [driver, firmware]
        explanation:
          what: "`lspci -nnk | grep -iA3 net` (built-in adapters) or `lsusb` (USB adapters) shows whether Linux sees the chip at all."
          why: "This splits 'hardware not detected' (cable/BIOS/dead port) from 'detected but not working' (missing driver/firmware) — the fixes are completely different."
          where: "Diagnostic."
        try_this: "lspci -nnk | grep -iA3 net   # USB: lsusb"
        success_criteria: "Your adapter's make/model is listed."
        alternatives:
          - trigger: "listed, WITH a 'Kernel driver in use' line, but still no wlan0/eth0 interface"
            cause: "A driver is bound but its firmware failed to load, or the interface exists under a different name than expected."
            fix: "Check for firmware load errors (see below) and confirm the real interface name with `ip a` — it isn't always wlan0."
            check: "A firmware line appears in `dmesg`, or `ip a` lists an interface for this device once fixed."
          - trigger: "listed, but NO 'Kernel driver in use' line, or not recognized as a network device at all"
            cause: "No driver is bound to this chipset yet."
            fix: "Install the matching firmware package (see below). Some USB Wi-Fi chipsets popular for security testing aren't in Kali's default kernel and need a separate driver."
            check: "'Kernel driver in use' now appears; the interface shows up in `ip a`."
          - trigger: "not listed anywhere — not even as generic/unknown hardware"
            cause: "Hardware fault, disabled in BIOS/UEFI, or (USB) a dead port/cable."
            fix: "Try a different USB port/cable, and check your BIOS/UEFI settings for a disabled network device."
            check: "The device now appears in `lspci`/`lsusb`."
    fixes:
      - fix_id: seen
        tier: basic
        title: "Is the device seen at all?"
        command: "lspci -nnk | grep -iA3 net   # USB: lsusb"
        why: "Confirms the hardware is detected and whether a driver is bound."
        verify: "Your adapter is listed (with a `Kernel driver in use` for PCIe)."
      - fix_id: fw_errors
        tier: basic
        title: "Firmware load errors?"
        command: "sudo dmesg | grep -iE 'firmware|wlan|driver'"
        why: "Surfaces 'failed to load firmware' messages."
        verify: "Identify any missing-firmware lines."
      - fix_id: install_fw
        tier: intermediate
        title: "Install missing firmware"
        command: "sudo apt update && sudo apt install firmware-iwlwifi  # or firmware-realtek / firmware-atheros"
        why: "Fresh Kali often lacks vendor firmware."
        verify: "`ip a` / `iw dev` now lists the interface."
      - fix_id: thirdparty_driver
        tier: extensive
        title: "Chipset needs a third-party driver (not in the kernel)"
        command: "sudo apt install dkms build-essential linux-headers-$(uname -r)  # then follow that chipset's driver install steps"
        why: "Some USB Wi-Fi adapters marketed for security testing use chipsets that aren't in the mainline kernel and need a DKMS-built driver matched to your exact kernel version."
        verify: "The interface appears once the driver builds and loads; `iw list` shows it."
  - symptom_id: monitor_mode
    label: "I can't get monitor mode working (security tooling)"
    aliases: [monitor mode, airmon, injection, capture, wlan0mon]
    fixes:
      - fix_id: supports
        tier: basic
        title: "Does the adapter support monitor mode?"
        command: "iw list | grep -A10 \"Supported interface modes\""
        why: "Look for `* monitor`; if absent the chipset can't do it."
        verify: "`* monitor` appears in the supported modes."
      - fix_id: enable
        tier: basic
        title: "Enable monitor mode"
        command: "sudo airmon-ng start <iface>"
        why: "Creates a monitor interface (e.g. wlan0mon)."
        verify: "`iw dev` shows the interface in `type monitor`."
      - fix_id: killers
        tier: intermediate
        title: "Stop interfering processes"
        command: "sudo airmon-ng check; sudo airmon-ng check kill"
        why: "NetworkManager and wpa_supplicant (the background programs that normally manage Wi-Fi) keep trying to reassert control of the adapter and will fight monitor mode."
        verify: "Interfering processes are stopped."
        destructive: true
        recovery: "This stops NetworkManager -> you lose normal Wi-Fi/internet until you run `sudo systemctl start NetworkManager`."
      - fix_id: persist_unmanaged
        tier: extensive
        title: "NetworkManager keeps re-grabbing the adapter every time"
        command: "printf '[keyfile]\\nunmanaged-devices=interface-name:wlan0\\n' | sudo tee /etc/NetworkManager/conf.d/unmanaged.conf; sudo systemctl restart NetworkManager"
        why: "`airmon-ng check kill` only helps for the current session — this permanently tells NetworkManager to leave this one interface alone, so it stops reverting your monitor-mode interface back to managed Wi-Fi."
        verify: "wlan0 no longer flips back to 'managed' on its own; monitor mode stays set after reboot."
        destructive: true
        recovery: "Remove /etc/NetworkManager/conf.d/unmanaged.conf and restart NetworkManager to let it manage the interface normally again."
  - symptom_id: slow_intermittent
    label: "It connects but is slow or keeps dropping"
    aliases: [slow, dropping, intermittent, lag, unstable, keeps disconnecting]
    fixes:
      - fix_id: signal
        tier: basic
        title: "Check signal/quality"
        command: "nmcli -f IN-USE,SSID,SIGNAL,CHAN device wifi"
        why: "Low SIGNAL means distance/AP issues."
        verify: "Compare SIGNAL across networks."
      - fix_id: powersave
        tier: intermediate
        title: "Power saving causing drops"
        command: "iw dev <iface> get power_save  # disable via NetworkManager wifi.powersave"
        why: "Aggressive power save can drop the link."
        verify: "Stability improves with power save off."
      - fix_id: driver_resets
        tier: extensive
        title: "Adapter silently resets/reconnects under load"
        command: "dmesg -T | grep -iE 'reset|firmware|disconnect' | tail -30"
        why: "Some USB Wi-Fi chipsets crash their firmware and silently reassociate under load — it looks like random dropping, but the kernel log shows the real cause."
        verify: "No repeating reset/firmware-crash lines during the period it dropped."
