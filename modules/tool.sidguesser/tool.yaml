tool_id: sidguesser
display_name: "SIDGuesser"
binary_candidates: [sidguess]
categories: [database, reconnaissance]
os_profile: kali
one_liner: "Brute-forces an Oracle database's SID (its instance name) from a wordlist."
authorization_gate: true
authorization_text: >
  SIDGuesser makes many connection attempts against a live Oracle listener to guess its SID.
  This can be noisy and, on some configurations, contributes to lockouts or alerts just like
  any other brute-force tool. Only run this against Oracle instances you own or are
  explicitly authorized to test. Continue?
flows:
  - flow_id: guided
    title: "Guided first guess (START HERE)"
    goal: "From a live Oracle listener to a confirmed SID."
    command_builder_id: sidguesser
    slots: [PROGRAM, ACTION_OPTIONS, OUTPUT_OPTIONS]
    steps:
      - step_id: g1
        title: "Confirm an Oracle listener is up"
        slot_target: null
        explanation:
          what: "The Oracle TNS listener normally runs on port 1521. Confirm it's open before guessing SIDs against it."
          why: "You need the SID (instance name) to connect to an Oracle database at all — but you can only guess it against a live listener."
          where: "Not part of the sidguess command itself — this is a prep check."
        find_it: "Scan your authorized network for port 1521."
        command_anatomy:
          - {token: "nmap -p 1521 --open", does: "only show hosts with the Oracle listener port open"}
          - {token: "192.168.1.0/24", does: "your authorized network range — you type this in"}
        try_this: "nmap -p 1521 --open 192.168.1.0/24"
        success_criteria: "At least one host shows 1521/tcp open."
        expected_output: |
          Nmap scan report for 192.168.1.10
          PORT     STATE SERVICE
          1521/tcp open  oracle
        alternatives:
          - trigger: "nothing has 1521 open"
            cause: "No Oracle listener here, or it's firewalled/moved to a different port."
            fix: "Confirm you're on the authorized segment; try -P on sidguess if the port is non-default."
            check: "A host answers on 1521."
      - step_id: g2
        title: "Guess the SID with a wordlist"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "`-i <ip> -d <dictionary>` tries every entry in the wordlist as a candidate SID against the target's listener, one connection attempt per guess."
          why: "The SID is required for every subsequent Oracle connection (including oscanner's account checks) — without it you can't authenticate at all."
          where: "ACTION_OPTIONS; -i is the target, -d is the wordlist."
        find_it: "Kali ships an Oracle SID wordlist in SecLists: /usr/share/seclists/Fuzzing/Databases/OracleDB-SID.txt."
        command_anatomy:
          - {token: "sidguess", does: "the program"}
          - {token: "-i 192.168.1.10", does: "the target — you type this in"}
          - {token: "-d /usr/share/seclists/Fuzzing/Databases/OracleDB-SID.txt", does: "the SID wordlist"}
        try_this: "sidguess -i 192.168.1.10 -d /usr/share/seclists/Fuzzing/Databases/OracleDB-SID.txt"
        success_criteria: "A valid SID is reported when one from the wordlist is accepted by the listener."
        expected_output: |
          Connecting to 192.168.1.10:1521
          Trying SID: ORCL... valid SID found: ORCL
        alternatives:
          - trigger: "no SID found after the whole wordlist"
            cause: "The real SID isn't in this wordlist, or the listener refuses all guesses (some hardened configs do)."
            fix: "Try a bigger/different wordlist; note that some Oracle versions hide SID validity entirely."
            check: "—"
      - step_id: g3
        title: "Stop at the first match instead of trying every entry"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "`-m findfirst` stops as soon as one valid SID is found, instead of the default `findall` which tries the whole wordlist (useful if a host might have more than one instance)."
          why: "Faster when you just need any working SID to move on to the next step, rather than a complete inventory."
          where: "ACTION_OPTIONS, alongside -i/-d."
        find_it: "Same target and wordlist as step 2."
        command_anatomy:
          - {token: "sidguess -i 192.168.1.10 -d ...", does: "same as step 2"}
          - {token: "-m findfirst", does: "stop at the first valid SID instead of trying the whole list"}
        try_this: "sidguess -i 192.168.1.10 -d /usr/share/seclists/Fuzzing/Databases/OracleDB-SID.txt -m findfirst"
        success_criteria: "sidguess stops immediately once a SID is confirmed."
        expected_output: |
          Trying SID: ORCL... valid SID found: ORCL
          Stopping (findfirst mode).
        alternatives:
          - trigger: "it still runs through everything"
            cause: "No valid SID was found early in the list, so it has nothing to stop on until it finds one."
            fix: "This is expected if the real SID is late in the wordlist — let it finish, or try findall to see every valid SID."
            check: "—"
      - step_id: g4
        title: "Save the results to a report"
        slot_target: OUTPUT_OPTIONS
        explanation:
          what: "`-r <file>` writes the results to a file instead of (or alongside) the terminal."
          why: "You'll want the confirmed SID saved to feed into oscanner or a manual Oracle connection next."
          where: "OUTPUT_OPTIONS; -r names the output file."
        find_it: "Choose a writable path."
        command_anatomy:
          - {token: "sidguess -i 192.168.1.10 -d ...", does: "same scan as step 2"}
          - {token: "-r sidguess-report.txt", does: "save results to this file"}
        try_this: "sidguess -i 192.168.1.10 -d /usr/share/seclists/Fuzzing/Databases/OracleDB-SID.txt -r sidguess-report.txt"
        success_criteria: "sidguess-report.txt exists and lists the confirmed SID(s)."
        expected_output: |
          valid SID found: ORCL
        alternatives:
          - trigger: "Permission denied"
            cause: "Unwritable location."
            fix: "Save under your home directory."
            check: "The file is created."
quick_build:
  builder: sidguesser
  title: "Quick guess"
  fields:
    - field_id: target
      label: "Target (-i)"
      type: string
      required: true
      placeholder: "192.168.1.10"
    - field_id: dictionary
      label: "SID wordlist (-d)"
      type: path
      required: true
      default: "/usr/share/seclists/Fuzzing/Databases/OracleDB-SID.txt"
    - field_id: port
      label: "Port (-p)"
      type: int
      placeholder: "1521  (optional)"
    - field_id: mode
      label: "Mode (-m)"
      type: choice
      choices: ["findall", "findfirst"]
      default: "findall"
    - field_id: report
      label: "Report file (-r)"
      type: path
      placeholder: "sidguess-report.txt  (optional)"
