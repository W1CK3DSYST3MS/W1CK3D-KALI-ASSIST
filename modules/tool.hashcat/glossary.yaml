terms:
  - term: hash_mode
    definition: "-m the numeric hash type; must match the hash or nothing cracks."
  - term: attack_mode
    definition: "-a 0 wordlist, 1 combinator, 3 mask/brute, 6/7 hybrid."
  - term: mask
    definition: "A pattern of ?l ?u ?d ?s ?a building brute-force candidates."
  - term: charset
    definition: "The character set a mask placeholder expands to (?l lower, ?d digit…)."
  - term: rule
    definition: "-r transformations applied to wordlist words."
  - term: potfile
    definition: "~/.hashcat/hashcat.potfile; caches cracked hashes (--show reads it)."
  - term: workload
    definition: "-w speed-vs-responsiveness profile (1-4)."
  - term: optimized_kernel
    definition: "-O faster kernels that cap maximum password length."
  - term: increment
    definition: "--increment tries growing password lengths within a mask."
  - term: gpu_opencl
    definition: "hashcat's accelerator; needs proper drivers (else 'no devices')."
  - term: combinator_attack
    definition: "-a 1 pairs every word from a first wordlist with every word from a second (word1word2) — good for firstname+lastname style passwords."
  - term: second_wordlist
    definition: "The dictionary2 positional argument required by combinator (-a 1) — the RIGHT half of each generated candidate."
  - term: custom_charset
    definition: "-1/-2/-3/-4 DEFINE what a mask placeholder like ?1 means (e.g. -1 ?l?d makes ?1 = lowercase-or-digit) — different from the built-in ?l/?u/?d/?s which need no definition."
  - term: hex_encoding
    definition: "--hex-charset/--hex-salt/--hex-wordlist read that input as hex bytes instead of plain text — for binary or non-UTF8 candidate/salt data a mask or wordlist file can't represent directly."
  - term: keyspace
    definition: "The total number of candidate passwords an attack will try — shown by --keyspace/--total-candidates before you commit to running it."
  - term: device_type
    definition: "-D picks OpenCL device TYPE (1=CPU, 2=GPU, 3=FPGA/other) — different from -d, which picks a specific device ID once you know the type works."
