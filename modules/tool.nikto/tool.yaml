tool_id: nikto
display_name: "nikto"
binary_candidates: [nikto]
categories: [web_app, detect]
os_profile: kali
one_liner: "Scans a web server for known bad files, outdated software, and misconfigurations."
authorization_gate: true
authorization_text: >
  Scanning web servers you don't own or aren't authorized to test is illegal, and nikto
  is deliberately loud — it floods logs and trips defenses. Continue only for authorized
  targets. Practice on your own servers, DVWA / OWASP Juice Shop / Metasploitable, HTB/THM.
  Continue?
flows:
  - flow_id: guided
    title: "Guided first scan (START HERE)"
    goal: "Baseline a web server for known problems and save a report — inputs explained."
    command_builder_id: nikto
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS, OUTPUT_OPTIONS]
    steps:
      - step_id: g1
        title: "Confirm you have a web server to scan"
        slot_target: null
        glossary_refs: [web_vuln_scan, url, http_https]
        explanation:
          what: "nikto checks a WEB server for thousands of known-bad files, outdated software and misconfigurations. You need a URL/host that serves web pages."
          why: "Pointing nikto at a non-web port just wastes time — confirm there's a web service first."
          where: "This host/URL goes after -h."
        find_it: >
          Find web ports with the nmap tool (usually 80 = http, 443 = https, sometimes 8080/8443).
          Then your target is http://HOST or https://HOST. Only scan hosts you own or are
          authorized to test — nikto is very noisy and WILL appear in the server's logs.
        command_anatomy:
          - {token: "curl", does: "fetch a URL"}
          - {token: "-sI", does: "silently fetch just the headers"}
          - {token: "http://TARGET", does: "the web target to confirm"}
        try_this: "curl -sI http://TARGET"
        success_criteria: "You get an HTTP response — confirming a web server is there."
        expected_output: |
          HTTP/1.1 200 OK
          Server: Apache/2.4.7 (Ubuntu)
        alternatives:
          - trigger: "connection refused"
            cause: "No web service on that port."
            fix: "Run `nmap -sV -p- TARGET` to find the real web port, then use http://TARGET:PORT."
            check: "curl returns an HTTP line."
      - step_id: g2
        title: "Run the baseline scan"
        slot_target: TARGET_PIVOT
        explanation:
          what: "`-h <host>` runs nikto's full battery of checks. It streams findings as it goes: the server banner, missing security headers, interesting files, and reference IDs (OSVDB)."
          why: "This one command gives you a broad first picture of what's wrong with the server."
          where: "TARGET_PIVOT (-h)."
        find_it: "Use the URL from step 1. nikto auto-detects http vs https and the common port."
        command_anatomy:
          - {token: "nikto", does: "the program"}
          - {token: "-h http://TARGET", does: "the host/URL to scan"}
        try_this: "nikto -h http://TARGET"
        success_criteria: "Findings stream out — server version, headers, and flagged items with + bullets."
        expected_output: |
          + Server: Apache/2.4.7 (Ubuntu)
          + The anti-clickjacking X-Frame-Options header is not present.
          + The X-XSS-Protection header is not defined.
          + /admin/: This might be interesting...
          + OSVDB-3268: /icons/: Directory indexing found.
        alternatives:
          - trigger: "the scan hangs or is very slow"
            cause: "Slow or filtered responses from the server."
            fix: "Cap the run: add `-maxtime 5m` and/or `-timeout 10`."
            check: "It finishes within the time cap."
          - trigger: "No web server found on this host/port"
            cause: "Wrong scheme/port."
            fix: "Add the port and scheme: `nikto -h TARGET -p 8443 -ssl`."
            check: "The scan connects."
      - step_id: g3
        title: "Focus the scan to cut the noise"
        slot_target: ACTION_OPTIONS
        glossary_refs: [tuning]
        explanation:
          what: >
            `-Tuning` limits which categories run — the FULL set (nikto -H): 0 = file
            upload, 1 = interesting file / seen in logs, 2 = misconfiguration / default
            file, 3 = information disclosure, 4 = injection (XSS/script/HTML), 5 = remote
            file retrieval (inside webroot), 6 = denial of service, 7 = remote file
            retrieval (server-wide), 8 = command execution / remote shell, 9 = SQL
            injection, a = authentication bypass, b = software identification, c = remote
            source inclusion, d = web service, e = administrative console, x = reverse the
            selection (run everything EXCEPT the listed categories). Combine any of them,
            e.g. -Tuning 1234.
          why: "A full scan tests everything and is slow/loud. Tuning to what you care about is faster and kinder to the target."
          where: "ACTION_OPTIONS; the characters pick categories."
        find_it: "Decide what you care about. A good general choice is 1234 (files + misconfig + info + XSS). Avoid 6 (DoS) on anything you can't disrupt."
        command_anatomy:
          - {token: "nikto -h http://TARGET", does: "the scan from step 2"}
          - {token: "-Tuning 1234", does: "run only categories 1,2,3,4 (files, misconfig, info, XSS)"}
        try_this: "nikto -h http://TARGET -Tuning 1234"
        success_criteria: "Only the chosen categories run — faster, more focused output."
        expected_output: |
          + Testing categories: 1,2,3,4
          + /config.bak: Backup file found.
          + Cookie without HttpOnly flag.
        alternatives:
          - trigger: "you're not sure which category number you need"
            cause: "The digit meanings aren't memorised."
            fix: "Run `nikto -H` to list all -Tuning categories, or just use 1234 as a sensible default."
            check: "You pick the categories you want."
      - step_id: g4
        title: "Save a report you can share"
        slot_target: OUTPUT_OPTIONS
        explanation:
          what: "`-o report.html -Format htm` writes an HTML report of the findings. The file EXTENSION and the -Format must match."
          why: "You need a record to review, verify, and hand over — the terminal output scrolls away."
          where: "OUTPUT_OPTIONS; -o names the file, -Format sets the type."
        find_it: "Choose a filename in a writable folder (your home). Use .html with -Format htm, or .csv with -Format csv for spreadsheets."
        command_anatomy:
          - {token: "nikto -h http://TARGET", does: "the scan"}
          - {token: "-o ~/scans/nikto.html", does: "write the report to this file"}
          - {token: "-Format htm", does: "format it as HTML (must match the .html extension)"}
        try_this: "mkdir -p ~/scans && nikto -h http://TARGET -o ~/scans/nikto.html -Format htm"
        success_criteria: "~/scans/nikto.html is created; open it in a browser to read the findings."
        expected_output: |
          + 1 host(s) tested
          (and ~/scans/nikto.html now exists)
        alternatives:
          - trigger: "error about the format"
            cause: "The file extension and -Format disagree (e.g. .html with -Format csv)."
            fix: "Make them match: .html + `-Format htm`, .csv + `-Format csv`."
            check: "The report writes without error."
          - trigger: "a finding looks wrong / doesn't exist"
            cause: "nikto is signature-based and produces false positives."
            fix: "Verify each finding by hand (open the flagged path yourself) before trusting or reporting it."
            check: "You can reproduce the issue manually."
  - flow_id: first_scan
    title: "First scan (reference)"
    goal: "Baseline a web server."
    command_builder_id: nikto
    slots: [PROGRAM, TARGET_PIVOT]
    steps:
      - step_id: nk1
        title: "Scan a host"
        slot_target: TARGET_PIVOT
        glossary_refs: [web_vuln_scan]
        explanation:
          what: "`-h <host>` scans the server; nikto auto-detects http/https and common ports."
          why: "One command to baseline known server flaws/misconfigs."
          where: "TARGET_PIVOT (-h)."
        find_it: "A confirmed web URL/host (use nmap/curl to check)."
        command_anatomy:
          - {token: "nikto", does: "the program"}
          - {token: "-h http://10.0.0.20", does: "the host to scan"}
        try_this: "nikto -h http://10.0.0.20"
        success_criteria: "Findings stream (server banner, headers, interesting files, refs)."
        expected_output: |
          + Server: Apache/2.4.7 (Ubuntu)
          + /admin/: This might be interesting...
        alternatives:
          - trigger: "No web server found / connection refused"
            cause: "Target isn't serving HTTP on the assumed port."
            fix: "Confirm a web service with nmap first; set -p / -ssl correctly."
            check: "Re-run with the right port/scheme."
          - trigger: "hangs"
            cause: "Slow or filtered responses."
            fix: "Add -timeout and/or -maxtime to cap the run."
            check: "Re-run with -maxtime 5m."
  - flow_id: port_ssl
    title: "Port & SSL targeting (reference)"
    goal: "Hit non-standard ports / force TLS."
    command_builder_id: nikto
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: nk2
        title: "Set port and SSL"
        slot_target: ACTION_OPTIONS
        glossary_refs: [ssl]
        explanation:
          what: "`-p 8443` sets the port (comma-list for several); `-ssl` forces TLS, `-nossl` forces plain."
          why: "Targets that only speak HTTPS or run on odd ports."
          where: "ACTION_OPTIONS."
        find_it: "Get the real port from nmap -sV; decide if it's TLS (https) or plain."
        command_anatomy:
          - {token: "-p 8443", does: "scan this port"}
          - {token: "-ssl", does: "force an HTTPS/TLS connection"}
        try_this: "nikto -h 10.0.0.20 -p 8443 -ssl"
        success_criteria: "The scan connects over TLS on the chosen port."
        expected_output: |
          + Target Port: 8443
          + SSL Info: Subject: /CN=10.0.0.20
        alternatives:
          - trigger: "SSL negotiation fails"
            cause: "Port isn't actually TLS, or vice-versa."
            fix: "Try -nossl, or the correct port."
            check: "Confirm with nmap -sV."
  - flow_id: tuning
    title: "Tuning (reference)"
    goal: "Focus the scan, cut noise/time."
    command_builder_id: nikto
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: nk3
        title: "Select test categories"
        slot_target: ACTION_OPTIONS
        glossary_refs: [tuning]
        explanation:
          what: >
            `-Tuning` picks categories. Numbers: 0 upload, 1 interesting files, 2
            misconfig, 3 info disclosure, 4 XSS/injection, 5 remote file retrieval
            (webroot), 6 DoS, 7 remote file retrieval (server-wide), 8 command
            execution, 9 SQLi. Letters: a auth bypass, b software ID, c remote source
            inclusion, d web service, e admin console. x reverses the set (run
            everything EXCEPT what you list).
          why: "Faster and less noisy; combine characters e.g. -Tuning 1234."
          where: "ACTION_OPTIONS."
        find_it: "Combine the characters for what you want; skip 6 (DoS) unless you're allowed to disrupt the target."
        command_anatomy:
          - {token: "-Tuning 1234", does: "run categories 1,2,3,4 only"}
        try_this: "nikto -h http://site -Tuning 1234"
        success_criteria: "Only the chosen categories run."
        expected_output: |
          + Testing categories: 1,2,3,4
        alternatives:
          - trigger: "too slow / too noisy"
            cause: "Running all categories."
            fix: "Tune to what you care about; skip 6 (DoS) on anything you can't disrupt."
            check: "Re-run with a narrower -Tuning."
  - flow_id: mutate
    title: "Deeper enumeration with -mutate (reference)"
    goal: "Actively guess extra files, directories, and usernames instead of only checking known signatures."
    command_builder_id: nikto
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: nk9
        title: "Guess more files/usernames with -mutate"
        slot_target: ACTION_OPTIONS
        glossary_refs: [mutate]
        explanation:
          what: "-mutate makes nikto GUESS additional targets instead of only checking its built-in signature list. On this installed build the sub-options are: 1 = test every found file against every discovered root directory, 2 = guess common password-file names, 3 = enumerate Apache usernames via /~user requests, 4 = the same via cgiwrap, 6 = guess directory names from a dictionary file you supply."
          why: "A default scan only checks known signatures. -mutate actively tries combinations nikto wouldn't otherwise guess — it finds more, but sends a lot more requests and takes longer."
          where: "ACTION_OPTIONS, alongside your normal scan flags."
        find_it: >
          Pick the sub-option that matches what you're missing: usernames on an Apache
          box -> 3; a custom directory wordlist -> 6, paired with -mutate-options
          pointing at that dictionary file. Run `nikto -H` any time to confirm the
          current sub-options for your installed version.
        command_anatomy:
          - {token: "nikto -h http://TARGET", does: "the scan from earlier steps"}
          - {token: "-mutate 3", does: "enumerate usernames via Apache /~user requests"}
        try_this: "nikto -h http://TARGET -mutate 3"
        success_criteria: "Additional + findings appear for guessed usernames/files that a plain scan wouldn't have tried."
        expected_output: |
          + Apache Users: root admin jdoe
          + /~jdoe : Enumerated user 'jdoe' via /~user request
        alternatives:
          - trigger: "scan takes much longer than usual"
            cause: "-mutate multiplies the number of requests nikto sends — it's now guessing, not just checking a fixed list."
            fix: "Cap it with -maxtime, or run one narrower sub-option at a time instead of several together."
            check: "The scan finishes within your time cap."
          - trigger: "using -mutate 6 but nothing extra is found"
            cause: "-mutate 6 needs a dictionary file supplied separately — it has no built-in list of directory names."
            fix: "Add -mutate-options <dictionary-file> pointing at a wordlist of likely directory names."
            check: "Re-run with -mutate-options set to a real wordlist file."
          - trigger: "-mutate 5 doesn't work"
            cause: "This installed nikto build only supports sub-options 1, 2, 3, 4, 6 — there is no 5."
            fix: "Use one of the supported numbers; run `nikto -H` to see the current list for your version."
            check: "Only documented sub-options are accepted."
  - flow_id: output
    title: "Output & reports (reference)"
    goal: "Save a shareable report."
    command_builder_id: nikto
    slots: [PROGRAM, TARGET_PIVOT, OUTPUT_OPTIONS]
    steps:
      - step_id: nk4
        title: "Write a report"
        slot_target: OUTPUT_OPTIONS
        explanation:
          what: "`-o <file> -Format <htm|csv|xml|json|txt>` saves results."
          why: "HTML for write-ups; CSV/JSON for parsing."
          where: "OUTPUT_OPTIONS."
        find_it: "Match the file extension to -Format; write to a folder you own."
        command_anatomy:
          - {token: "-o report.html", does: "output file"}
          - {token: "-Format htm", does: "HTML format (match the extension)"}
        try_this: "nikto -h http://site -o report.html -Format htm"
        success_criteria: "report.html is created with the findings."
        expected_output: |
          + 1 host(s) tested   (report.html written)
        alternatives:
          - trigger: "format error"
            cause: "Extension and -Format disagree."
            fix: "Make the file extension and -Format match."
            check: "Use .html with -Format htm."
  - flow_id: auth_proxy_vhost
    title: "Auth, proxy & virtual hosts (reference)"
    goal: "Authenticated/proxied scans and named vhosts."
    command_builder_id: nikto
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS, ENV_INTERFACE]
    steps:
      - step_id: nk5
        title: "Use auth, a proxy, and a vhost"
        slot_target: ENV_INTERFACE
        glossary_refs: [vhost, cgidirs]
        explanation:
          what: "`-id user:pass` basic auth; `-useproxy http://127.0.0.1:8080`; `-vhost <name>` for a shared IP."
          why: "Pairs with gobuster vhost results; route via Burp/ZAP to log traffic."
          where: "ENV_INTERFACE (proxy/auth); -vhost in ACTION_OPTIONS."
        find_it: "Get vhost names from gobuster vhost mode; start Burp/ZAP on 127.0.0.1:8080 for the proxy."
        command_anatomy:
          - {token: "-vhost admin.site.local", does: "scan this virtual host (Host header) on a shared IP"}
          - {token: "-useproxy http://127.0.0.1:8080", does: "route through your local Burp/ZAP"}
          - {token: "-id user:pass", does: "(if needed) HTTP basic-auth credentials"}
        try_this: "nikto -h http://10.0.0.20 -vhost admin.site.local -useproxy http://127.0.0.1:8080"
        success_criteria: "The named vhost is scanned through the proxy."
        expected_output: |
          + Target Host: admin.site.local
          (requests visible in Burp/ZAP)
        alternatives:
          - trigger: "401 unauthorized"
            cause: "Missing/incorrect credentials."
            fix: "Supply -id user:pass."
            check: "Verify the credentials work in a browser."
  - flow_id: evasion_pace
    title: "Evasion & pacing (reference)"
    goal: "Be gentler / study IDS behavior (still detectable)."
    command_builder_id: nikto
    slots: [PROGRAM, GLOBAL_OPTIONS, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: nk6
        title: "Pace and (optionally) evade"
        slot_target: GLOBAL_OPTIONS
        glossary_refs: [evasion]
        explanation:
          what: "`-Pause <sec>` between requests, `-maxtime <time>` caps the run; `-evasion <1-8>` mangles requests."
          why: "nikto is NOT stealthy — it will show in logs. Pacing is courtesy, not invisibility."
          where: "GLOBAL_OPTIONS (pace); -evasion in ACTION_OPTIONS."
        find_it: "No new input — add pacing flags to a scan you can already run."
        command_anatomy:
          - {token: "-Pause 2", does: "wait 2 seconds between requests"}
          - {token: "-maxtime 10m", does: "stop after 10 minutes no matter what"}
        try_this: "nikto -h http://site -Pause 2 -maxtime 10m"
        success_criteria: "The scan runs more slowly within the time cap."
        expected_output: |
          (findings appear more slowly; run stops at the 10m cap)
        alternatives:
          - trigger: "blocked / lots of 403s"
            cause: "A WAF/IPS is filtering."
            fix: "Pacing/evasion may help on authorized tests, but expect detection — it's inherent to nikto."
            check: "Review whether a WAF is in path."
  - flow_id: update
    title: "Update database & plugins (reference)"
    goal: "Refresh nikto's signatures."
    command_builder_id: nikto
    slots: [PROGRAM, ACTION_OPTIONS]
    steps:
      - step_id: nk7
        title: "Update the vulnerability database"
        slot_target: ACTION_OPTIONS
        glossary_refs: [plugin]
        explanation:
          what: "This nikto build has NO `-update` flag — it silently checks CIRT.net for a newer nikto version on every run (controlled by `-ask`/`-nocheck`), but that check does not fetch new signatures. On Kali the vulnerability DB/plugins ship inside the `nikto` package itself, so 'updating' means upgrading the package."
          why: "Fresh signatures catch newer issues; on Kali that's an apt upgrade, not a nikto command-line switch."
          where: "Package upgrade, not ACTION_OPTIONS; `-nocheck` (ACTION_OPTIONS) only skips nikto's own version check."
        find_it: "Just needs internet access (for apt, or for nikto's automatic version check)."
        command_anatomy:
          - {token: "sudo apt update", does: "refresh Kali's package index"}
          - {token: "sudo apt install --only-upgrade nikto", does: "pull the newest nikto package, including its plugins/DB files"}
        try_this: "sudo apt update && sudo apt install --only-upgrade nikto"
        success_criteria: "apt reports nikto is already the newest version, or installs an upgrade."
        expected_output: |
          nikto is already the newest version (2.5.0-...).
          (or: Setting up nikto (2.5.0-...) ...)
        alternatives:
          - trigger: "apt update/install fails (offline/permissions)"
            cause: "No network or insufficient permissions."
            fix: "Connect to the internet and use sudo (see the Packages troubleshooter)."
            check: "Retry with connectivity and sudo."
          - trigger: "you just want nikto to skip its own online version check"
            cause: "Every run silently checks CIRT.net for a newer nikto release unless told not to."
            fix: "Add `-nocheck` to any scan to skip that check entirely."
            check: "The scan starts immediately with no update check."
      - step_id: nk7b
        title: "Control the update-check prompt, and sanity-check nikto itself"
        slot_target: GLOBAL_OPTIONS
        explanation:
          what: "`-ask yes|no|auto` controls what happens when the online version check DOES run: yes = ask before sending anything (the default), no = never ask and never send, auto = send without asking. `-dbcheck` verifies nikto's own plugin/database files parse correctly — no scan, no target, just a syntax check. `-Version` prints the versions of nikto and its plugins/database and exits — also no scan."
          why: "-ask matters if you skip -nocheck but don't want an interactive prompt (e.g. scripting nikto). -dbcheck and -Version are quick sanity checks worth running after any manual edit to nikto's plugin/database files, or just to confirm what version you're running before reporting a finding."
          where: "-ask is GLOBAL_OPTIONS, alongside -nocheck. -dbcheck/-Version replace the whole command — no host needed."
        find_it: "No target needed for any of these three."
        command_anatomy:
          - {token: "nikto -dbcheck", does: "check plugin/database files for syntax errors, then exit"}
          - {token: "nikto -Version", does: "print nikto + plugin + database versions, then exit"}
        try_this: "nikto -dbcheck && nikto -Version"
        success_criteria: "-dbcheck reports no syntax errors; -Version prints a clean version list."
        expected_output: |
          + No syntax errors found.
          Nikto: 2.6.0
          Database: 20240918
        alternatives:
          - trigger: "-dbcheck reports a syntax error"
            cause: "A plugin or database file was hand-edited (or corrupted) and no longer parses."
            fix: "Revert the change, or reinstall nikto with `sudo apt install --reinstall nikto` to restore the shipped files."
            check: "Re-run -dbcheck until it reports clean."
  - flow_id: integration
    title: "Integration & reading results (reference)"
    goal: "Chain the web-recon tools; verify findings."
    command_builder_id: nikto
    slots: [PROGRAM, TARGET_PIVOT, OUTPUT_OPTIONS]
    steps:
      - step_id: nk8
        title: "Chain nmap -> gobuster -> nikto and verify"
        slot_target: OUTPUT_OPTIONS
        glossary_refs: [false_positive]
        explanation:
          what: "nmap finds the web port, gobuster finds paths/vhosts, nikto flags server vulns; save with -o."
          why: "nikto is signature-based — expect false positives; verify each finding manually."
          where: "OUTPUT_OPTIONS."
        find_it: "Feed the web port from nmap and paths from gobuster into a focused nikto run; save the report."
        command_anatomy:
          - {token: "-o report.html -Format htm", does: "save a report to verify finding-by-finding"}
        try_this: "nikto -h http://site -o report.html -Format htm"
        success_criteria: "A report you can verify finding-by-finding."
        expected_output: |
          + 1 host(s) tested   (report.html written)
        alternatives:
          - trigger: "finding looks wrong"
            cause: "Signature match without real vulnerability (false positive)."
            fix: "Manually verify before reporting; cross-check the path/response."
            check: "Reproduce the issue by hand."

quick_build:
  builder: nikto
  title: "Quick scan"
  fields:
    - field_id: host
      label: "Target host"
      type: string
      required: true
      placeholder: "http://host  or  10.0.0.5"
    - field_id: profile
      label: "Profile"
      type: choice
      default: quick
      choices: [quick, https, tuned, reported]
    - field_id: port
      label: "Port"
      type: int
      placeholder: "80"
    - field_id: ssl
      label: "Force SSL (-ssl)"
      type: bool
    - field_id: nossl
      label: "Force plain HTTP, no SSL (-nossl)"
      type: bool
      help: "Use when a port only speaks plain HTTP and nikto is wrongly trying TLS on it."
    - field_id: output
      label: "Output file"
      type: path
      placeholder: "report.html  (optional)"
    - field_id: format
      label: "Report format (-Format)"
      type: choice
      choices: [htm, csv, xml, json, sql, txt]
      help: "Must match the Output file's extension, e.g. .html with htm, .csv with csv. Only used together with Output file above."
    - field_id: timeout
      label: "Request timeout in seconds (-timeout)"
      type: int
      placeholder: "10  (nikto's default)"
    - field_id: pause
      label: "Pause between requests, seconds (-Pause)"
      type: int
      placeholder: "optional — be gentler on the target"
    - field_id: maxtime
      label: "Stop after this long (-maxtime)"
      type: string
      placeholder: "5m  or  1h  or  3600s"
      help: "Caps the whole run — useful if a scan is hanging or you have a fixed testing window."
    - field_id: tuning
      label: "Test categories (-Tuning)"
      type: string
      placeholder: "1234  (files, misconfig, info, XSS)"
      help: "Combine any of: 0 upload, 1 interesting files, 2 misconfig, 3 info disclosure, 4 XSS/injection, 5 remote file (webroot), 6 DoS, 7 remote file (server-wide), 8 command execution, 9 SQLi, a auth bypass, b software ID, c remote source inclusion, d web service, e admin console, x = reverse (run everything EXCEPT listed). Avoid 6 unless you're allowed to disrupt the target."
    - field_id: vhost
      label: "Virtual host / Host header (-vhost)"
      type: string
      placeholder: "admin.site.local  (optional — shared-IP hosting)"
    - field_id: evasion
      label: "IDS evasion technique (-evasion)"
      type: string
      placeholder: "1  (optional — see the evasion & pacing flow)"
      help: "Mangles requests to study IDS behaviour. nikto is NOT stealthy regardless — this is not invisibility."
    - field_id: plugins
      label: "Restrict which plugins run (-Plugins)"
      type: string
      placeholder: "optional — default is ALL"
    - field_id: mutate
      label: "Guess extra files/usernames (-mutate)"
      type: choice
      choices: ["1", "2", "3", "4", "6"]
      help: "1=every file against every root dir, 2=guess password-file names, 3=Apache usernames, 4=cgiwrap usernames, 6=directory names from a dictionary (pair with the option below). Slower and much noisier than a default scan."
    - field_id: mutate_options
      label: "Dictionary file for -mutate 6 (-mutate-options)"
      type: path
      placeholder: "optional — only needed with -mutate 6"
    - field_id: save
      label: "Save full session to resume later (-Save)"
      type: path
      placeholder: "optional — a directory, or leave blank"
      help: "Saves the full session to a directory so a long/interrupted scan's positive responses aren't lost."
    - field_id: proxy
      label: "Route through a proxy (-useproxy)"
      type: string
      placeholder: "http://127.0.0.1:8080  (optional, e.g. Burp/ZAP)"
    - field_id: auth_id
      label: "HTTP basic-auth credentials (-id)"
      type: string
      placeholder: "user:pass  (optional)"
    - field_id: rsacert
      label: "Client certificate file (-RSAcert)"
      type: path
      placeholder: "optional — for client-certificate auth"
    - field_id: key
      label: "Client certificate key file (-key)"
      type: path
      placeholder: "optional — pairs with the certificate file above"
    - field_id: verbose
      label: "Verbose output (-Display V)"
      type: bool
    - field_id: list_plugins
      label: "List available plugins instead of scanning (-list-plugins)"
      type: bool
      help: "Prints every installed plugin and exits — doesn't scan anything. Ignores the other fields above."
    - field_id: dbcheck
      label: "Check plugin/database files for syntax errors (-dbcheck)"
      type: bool
      help: "Diagnostic only — verifies nikto's own data files parse correctly. Doesn't scan anything, ignores the other fields."
    - field_id: version_info
      label: "Print plugin & database versions (-Version)"
      type: bool
      help: "Diagnostic only — doesn't scan anything, ignores the other fields."
    - field_id: nocheck
      label: "Skip nikto's own update-check on startup (-nocheck)"
      type: bool
      help: "nikto silently checks CIRT.net for a newer nikto release every run unless told not to."
    - field_id: ask
      label: "Update-check prompt behaviour (-ask)"
      type: choice
      choices: ["yes", "no", "auto"]
      help: "yes = ask each time (default), no = never ask/never send, auto = send without asking. Ignored if Skip update-check above is on."
    - field_id: display_options
      label: "Extra -Display sub-flags"
      type: string
      placeholder: "1 2 3 4 D E P S combined, e.g. 124  (optional)"
      help: "1=show redirects, 2=show cookies received, 3=show all 200/OK responses, 4=show URLs needing auth, D=debug output, E=display all HTTP errors, P=print progress, S=scrub IPs/hostnames from output. Combines with the Verbose checkbox below (which is just shorthand for V) into one -Display value."
    - field_id: check6
      label: "Check IPv6 connectivity first (-check6)"
      type: bool
      help: "Tries to reach ipv6.google.com (or the host set in nikto.conf) before scanning — a quick sanity check, not part of the scan itself."
    - field_id: ip_version
      label: "Force IP version"
      type: choice
      choices: [ipv4, ipv6]
      help: "-ipv4/-ipv6 — force one address family instead of letting nikto pick. Leave blank for the default."
    - field_id: nolookup
      label: "Skip DNS lookups (-nolookup)"
      type: bool
      help: "Faster when you already have an IP and don't need hostname resolution."
    - field_id: nocookies
      label: "Don't reuse response cookies in later requests (-nocookies)"
      type: bool
    - field_id: noslash
      label: "Strip trailing slash from URLs (-noslash)"
      type: bool
      help: "e.g. '/admin/' becomes '/admin' — some servers/WAFs behave differently with vs without it."
    - field_id: no404
      label: "Disable nikto's 404-page guessing (-no404)"
      type: bool
      help: "Turn on if a custom error page is confusing nikto's false-positive detection."
    - field_id: followredirects
      label: "Follow 3xx redirects (-followredirects)"
      type: bool
    - field_id: nointeractive
      label: "Disable interactive keypresses (-nointeractive)"
      type: bool
      help: "Useful when scripting nikto — no prompts waiting on stdin."
    - field_id: useragent
      label: "Custom User-Agent (-useragent)"
      type: string
      placeholder: "optional — overrides nikto's own default User-Agent string"
    - field_id: add_header
      label: "Add a custom HTTP header (-Add-header)"
      type: string
      placeholder: "X-Forwarded-For: 127.0.0.1  (optional, one header)"
    - field_id: ignore_code
      label: "Always ignore these HTTP status codes (-404code)"
      type: string
      placeholder: "302,301  (optional — treat as 'not found', cuts false positives)"
    - field_id: ignore_string
      label: "Always ignore this string in the response body (-404string)"
      type: string
      placeholder: "optional — a literal string or regex; also treated as 'not found'"
    - field_id: cgidirs
      label: "CGI directories to check (-Cgidirs)"
      type: string
      placeholder: "none, all, or  /cgi/ /cgi-a/  (optional)"
      help: "Which paths nikto treats as CGI script directories. 'all' checks every known CGI path nikto knows; 'none' skips CGI checks entirely."
    - field_id: platform
      label: "Target platform (-Platform)"
      type: choice
      choices: [nix, win, all]
      help: "Focuses platform-specific checks (e.g. Windows-only vs *nix-only file paths). Leave blank for nikto's own detection."
    - field_id: root
      label: "Prepend a root path to every request (-root)"
      type: string
      placeholder: "/app  (optional — when the site lives in a subdirectory)"
    - field_id: userdbs
      label: "Load only user-supplied databases (-Userdbs)"
      type: choice
      choices: [all, tests]
      help: "all = skip nikto's standard databases entirely, load only your own user dbs. tests = keep standard databases but also load user db_tests. Advanced/rare."
    - field_id: config
      label: "Custom nikto.conf path (-config)"
      type: path
      placeholder: "optional — use a config file other than the default"
    - field_id: option_override
      label: "Override one nikto.conf setting (-Option)"
      type: string
      placeholder: "KEY=VALUE  (optional, advanced)"
      help: "Overrides a single nikto.conf entry for this run without editing the file. The real -Option flag can be repeated for multiple overrides; this form supports one."
