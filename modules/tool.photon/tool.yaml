tool_id: photon
display_name: "Photon"
binary_candidates: [photon]
categories: [osint, reconnaissance]
os_profile: kali
one_liner: "A fast web crawler that harvests URLs, emails, files, and secrets from a target site."
authorization_gate: true
authorization_text: >
  Photon actively crawls a website — many automated requests that appear in the target's logs
  and can stress a small server. Crawl only sites you own or are authorized to assess. Continue
  only for authorized targets or your own apps. Continue?
flows:
  - flow_id: guided
    title: "Guided first crawl (START HERE)"
    goal: "Crawl a site into an output folder, then read the harvested URLs and data."
    command_builder_id: photon
    slots: [PROGRAM, ENV_INTERFACE, ACTION_OPTIONS, OUTPUT_OPTIONS]
    steps:
      - step_id: g1
        title: "Confirm Photon and pick an authorized site"
        slot_target: null
        glossary_refs: []
        explanation:
          what: "Photon takes a start URL and follows links, collecting internal/external URLs, emails, files (pdf, docs), and things that look like secrets/keys."
          why: "It's OSINT/recon that hits the target directly, so you confirm the tool and your authorization before crawling."
          where: "The site URL is passed with -u."
        find_it: >
          Only crawl sites you own or are authorized to assess. Not installed? On Kali try
          `sudo apt install photon`, or `pipx install photon` / clone
          https://github.com/s0md3v/Photon. The URL includes the scheme: https://example.com.
        command_anatomy:
          - {token: "photon --help", does: "show Photon's options"}
          - {token: "| head", does: "just the first lines (confirms it runs)"}
        try_this: "photon --help | head"
        success_criteria: "Photon's usage/help prints — it's installed and runnable."
        expected_output: |
          usage: photon.py [-h] [-u ROOT] [-l LEVEL] [-t THREADS] [-d DELAY] ...
          Photon - a lightning fast web crawler
        alternatives:
          - trigger: "command not found"
            cause: "Not installed / installed under a different name."
            fix: "Try `sudo apt install photon`, or `pipx install photon`; some setups run it as `photon.py`."
            check: "The help text prints."
      - step_id: g2
        title: "Run a basic crawl into an output folder"
        slot_target: ENV_INTERFACE
        explanation:
          what: "`photon -u https://example.com -o <dir>` crawls the site from that URL and saves categorised results (internal URLs, external URLs, emails, files...) into the output directory."
          why: "This is the core action — a structured harvest of everything the site links to."
          where: "-u is the start URL; -o is the output directory."
        find_it: >
          Use your authorized site's URL — replace <target-url> below with it
          (https://example.com in the explanation above is just an illustration, not a real
          target) — and a writable output folder (your home). Start shallow to keep it quick.
        command_anatomy:
          - {token: "photon", does: "the crawler"}
          - {token: "-u <target-url>", does: "the start URL to crawl — you type this in"}
          - {token: "-o ~/photon_example", does: "save results into this directory"}
        try_this: "photon -u <target-url> -o ~/photon_example"
        success_criteria: "It crawls and reports counts, and ~/photon_example is created with result files."
        expected_output: |
          ┌─ Photon ─┐
          [~] Level 1: 42 URLs
          [+] Crawling complete
          [+] Total requests made: 51
          [+] Results saved in ~/photon_example
        alternatives:
          - trigger: "0 URLs / it stops immediately"
            cause: "The start URL redirects elsewhere, blocks bots, or needs a scheme."
            fix: "Include https://; try the exact canonical URL; some sites block crawlers via robots/WAF."
            check: "It reports URLs found."
      - step_id: g3
        title: "Go deeper and pull in archived URLs"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "`-l <n>` sets crawl depth, `-t <n>` threads (speed), `-d <s>` a delay between requests, and `--wayback` seeds the crawl with URLs from the Internet Archive."
          why: "Depth + wayback find far more; a delay keeps you polite to smaller servers."
          where: "ACTION_OPTIONS; -o still names the output."
        find_it: "Depth 2-3 is a good balance. Keep threads modest and add -d on fragile targets. --wayback needs internet."
        command_anatomy:
          - {token: "-l 3", does: "crawl up to 3 links deep"}
          - {token: "-t 10", does: "use 10 threads"}
          - {token: "--wayback", does: "also seed from archived (Wayback Machine) URLs"}
          - {token: "-o ~/photon_example", does: "output directory"}
        try_this: "photon -u <target-url> -l 3 -t 10 --wayback -o ~/photon_example"
        success_criteria: "More URLs are found, including historical/archived ones."
        expected_output: |
          [~] Pulling URLs from Wayback Machine
          [~] Level 1: 42 URLs
          [~] Level 2: 118 URLs
          [+] Total URLs: 160
        alternatives:
          - trigger: "it's slow or the server complains"
            cause: "Too many threads / no delay for a small target."
            fix: "Lower -t and add `-d 1` (a 1-second delay). Be a good neighbour."
            check: "It completes without hammering the server."
      - step_id: g4
        title: "Read the harvested results"
        slot_target: OUTPUT_OPTIONS
        explanation:
          what: "Photon splits results into files in the output directory: internal.txt, external.txt, and (when found) emails, files, and other categories."
          why: "These lists feed the next steps — internal URLs into gobuster/nikto, emails into OSINT, files for review."
          where: "The output directory from -o."
        find_it: "List the output directory and open the files that matter (internal.txt is usually the richest)."
        command_anatomy:
          - {token: "ls ~/photon_example", does: "see the categorised result files"}
          - {token: "head ~/photon_example/internal.txt", does: "preview the internal URLs found"}
        try_this: "ls ~/photon_example && head ~/photon_example/internal.txt"
        success_criteria: "Result files list the URLs/emails/files Photon collected."
        expected_output: |
          external.txt  internal.txt  robots.txt  scripts.txt
          https://example.com/
          https://example.com/about
          https://example.com/login
        alternatives:
          - trigger: "files are empty"
            cause: "The crawl found little (shallow depth or a small/blocking site)."
            fix: "Increase -l, add --wayback, and confirm the site actually links internally."
            check: "internal.txt has URLs."
  - flow_id: tune
    title: "Depth / speed / wayback (reference)"
    goal: "Control crawl behaviour."
    command_builder_id: photon
    slots: [PROGRAM, ENV_INTERFACE, ACTION_OPTIONS, OUTPUT_OPTIONS]
    steps:
      - step_id: ph1
        title: "-l depth, -t threads, -d delay, --wayback"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "`-l` depth, `-t` threads, `-d` delay (seconds), `--wayback` archived URLs."
          why: "Trade coverage vs speed vs politeness."
          where: "ACTION_OPTIONS."
        find_it: "Pick depth for coverage, threads/delay for pacing. Replace <target-url> below with your authorized site's URL."
        command_anatomy:
          - {token: "<target-url>", does: "your authorized site's URL — you type this in"}
          - {token: "-l 3 -t 10 -d 1", does: "depth 3, 10 threads, 1s delay"}
          - {token: "--wayback", does: "include archived URLs"}
        try_this: "photon -u <target-url> -l 3 -t 10 -d 1 --wayback -o ~/photon_example"
        success_criteria: "The crawl runs with the chosen pacing/coverage."
        expected_output: |
          [+] Total URLs: 160
        alternatives:
          - trigger: "rate-limited/blocked"
            cause: "Too aggressive."
            fix: "Lower -t, raise -d."
            check: "The crawl completes cleanly."
  - flow_id: secrets_dns
    title: "Find secrets & subdomains (reference)"
    goal: "Use Photon's two most valuable detection flags: leaked API keys and subdomain enumeration."
    command_builder_id: photon
    slots: [PROGRAM, ENV_INTERFACE, ACTION_OPTIONS, OUTPUT_OPTIONS]
    steps:
      - step_id: pk1
        title: "Hunt for leaked API keys and secrets (--keys)"
        slot_target: ACTION_OPTIONS
        glossary_refs: [api_key]
        explanation:
          what: "`--keys` scans every page and JavaScript file Photon crawls for patterns that look like secrets — API keys, auth tokens, and access keys for services like AWS, Google, Stripe, Slack, and more."
          why: "Developers accidentally ship secrets in client-side JS constantly. A hardcoded API key sitting in a public .js file is one of the most common, highest-value real findings in web recon — this is arguably Photon's main selling point over a plain link crawler."
          where: "ACTION_OPTIONS, added to a normal crawl."
        find_it: "Use the site URL you're authorized to crawl (from the guided flow). No extra input needed — just add --keys to a crawl you already know how to run."
        command_anatomy:
          - {token: "photon", does: "the crawler"}
          - {token: "-u <target-url>", does: "the start URL to crawl"}
          - {token: "--keys", does: "flag anything that looks like a secret/API key on crawled pages"}
          - {token: "-o ~/photon_example", does: "save results, including a keys file, to this directory"}
        try_this: "photon -u <target-url> --keys -o ~/photon_example"
        success_criteria: "A keys-related file appears in the output directory (even if empty — 'none found' is itself a real result)."
        expected_output: |
          [~] Level 1: 42 URLs
          [+] Crawling complete
          [+] Results saved in ~/photon_example
          (then: cat ~/photon_example/keys.txt)
          AIzaSyD4C1xt-Q1234567890abcdefGHIJKLmno
        alternatives:
          - trigger: "keys file is empty or missing"
            cause: "The site simply has no exposed secrets in what Photon crawled — a good outcome, not a failure — or the crawl didn't reach the JS files that contain them."
            fix: "Increase crawl depth (-l 3 or more) so Photon reaches more JS bundles, and try --dns too — dev/staging subdomains leak secrets far more often than production."
            check: "Re-run with a higher -l and confirm internal.txt lists JS files."
          - trigger: "a hit looks like a false positive (a random-looking string that isn't actually a key)"
            cause: "Photon matches against regex patterns for common key formats, which can occasionally catch look-alike strings (hashes, session tokens, minified code)."
            fix: "Manually verify each hit — check whether it matches a known vendor's key format (e.g. AWS keys start AKIA, Google API keys start AIza) before treating it as a real finding."
            check: "Cross-reference the hit against the vendor's documented key format."
      - step_id: pk2
        title: "Enumerate subdomains during the crawl (--dns)"
        slot_target: ACTION_OPTIONS
        glossary_refs: [subdomain_enum]
        explanation:
          what: "`--dns` has Photon pull out and resolve subdomains it encounters while crawling (in links, JS, and similar), saving them to their own result file."
          why: "Subdomains are extra attack surface — a forgotten dev.example.com or old-admin.example.com is often far less hardened than the main site, and this is a free byproduct of a crawl you're already running."
          where: "ACTION_OPTIONS, added to a normal crawl."
        find_it: "Same authorized target as step 1 — no extra input needed."
        command_anatomy:
          - {token: "photon", does: "the crawler"}
          - {token: "-u <target-url>", does: "the start URL to crawl"}
          - {token: "--dns", does: "collect and resolve subdomains found during the crawl"}
          - {token: "-o ~/photon_example", does: "save results, including a subdomains file, to this directory"}
        try_this: "photon -u <target-url> --dns -o ~/photon_example"
        success_criteria: "A subdomain-related file appears in the output directory listing anything found."
        expected_output: |
          [~] Level 1: 42 URLs
          [+] Crawling complete
          [+] Results saved in ~/photon_example
          (then: ls ~/photon_example)
          dns.txt  external.txt  internal.txt
        alternatives:
          - trigger: "no subdomains found"
            cause: "The site simply doesn't reference any other subdomains in what was crawled."
            fix: "For dedicated subdomain enumeration beyond what a crawl happens to find, use a purpose-built tool (theHarvester, or gobuster's dns mode) — --dns here is a convenient bonus, not a full enumeration technique."
            check: "Compare against theHarvester/gobuster dns results for the same domain."
      - step_id: pk3
        title: "Extra: clone the site locally, or export a structured summary (reference)"
        slot_target: OUTPUT_OPTIONS
        explanation:
          what: "`--clone` saves a local copy of the crawled pages (handy for offline review); `-e csv` or `-e json` writes a structured summary file alongside the normal plain-text result files."
          why: "Useful add-ons once a crawl already works well — cloning for offline browsing, exporting for feeding results into another tool or script."
          where: "--clone is ACTION_OPTIONS; -e/--export is OUTPUT_OPTIONS."
        find_it: "Same authorized target. Cloning can use real disk space on large sites — start with a shallow -l."
        command_anatomy:
          - {token: "photon", does: "the crawler"}
          - {token: "-u <target-url>", does: "the start URL to crawl"}
          - {token: "--clone", does: "save a local copy of crawled pages"}
          - {token: "-e json", does: "also write a JSON summary of the results"}
          - {token: "-o ~/photon_example", does: "output directory"}
        try_this: "photon -u <target-url> --clone -e json -o ~/photon_example"
        success_criteria: "A cloned copy of pages and a .json summary appear under the output directory."
        expected_output: |
          [+] Cloning website
          [+] Results saved in ~/photon_example
        alternatives:
          - trigger: "clone directory is huge / the crawl is slow"
            cause: "Cloning downloads every crawled page's content, not just its URL."
            fix: "Lower -l (depth) before adding --clone, or skip cloning and just work from internal.txt/external.txt."
            check: "Re-run with a smaller -l."

quick_build:
  builder: photon
  title: "Quick crawl"
  fields:
    - field_id: url
      label: "Start URL (-u)"
      type: string
      required: true
      placeholder: "https://example.com"
    - field_id: depth
      label: "Crawl depth (-l)"
      type: int
      placeholder: "2"
    - field_id: threads
      label: "Threads (-t)"
      type: int
      placeholder: "10"
    - field_id: delay
      label: "Delay between requests, seconds (-d)"
      type: string
      placeholder: "1  (optional — be polite to small/fragile sites)"
    - field_id: wayback
      label: "Include archived URLs (--wayback)"
      type: bool
    - field_id: keys
      label: "Find leaked API keys/secrets (--keys)"
      type: bool
      help: "Scans crawled pages and JavaScript for things that look like API keys, tokens, or other secrets — one of Photon's most valuable findings."
    - field_id: dns
      label: "Enumerate subdomains during the crawl (--dns)"
      type: bool
      help: "Collects and resolves subdomains found while crawling — extra attack surface, as a free byproduct of the crawl."
    - field_id: clone
      label: "Clone the site locally (--clone)"
      type: bool
      help: "Saves a local copy of crawled pages for offline review. Can use real disk space — start with a shallow depth."
    - field_id: export
      label: "Also export a summary as (-e)"
      type: choice
      choices: [csv, json]
      help: "Optional — writes a structured summary file alongside the normal plain-text results."
    - field_id: output
      label: "Output directory (-o)"
      type: path
      placeholder: "~/photon_out  (optional)"
