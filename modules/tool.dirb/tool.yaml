tool_id: dirb
display_name: "dirb"
binary_candidates: [dirb]
categories: [web_app, reconnaissance]
os_profile: kali
one_liner: "Brute-forces hidden web directories and files from a wordlist (a classic dir scanner)."
authorization_gate: true
authorization_text: >
  Brute-forcing web content on servers you don't own or aren't authorized to test is illegal
  and noisy (it floods logs and can stress the server). Continue only for authorized targets or
  your own apps (DVWA / Juice Shop / HTB / THM). Continue?
flows:
  - flow_id: guided
    title: "Guided first scan (START HERE)"
    goal: "From a web URL to a saved list of discovered paths — inputs explained."
    command_builder_id: dirb
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS, OUTPUT_OPTIONS]
    steps:
      - step_id: g1
        title: "Confirm you have a web target"
        slot_target: null
        glossary_refs: [url, http_https]
        explanation:
          what: "dirb scans a WEB server, so you need a base URL like http://10.0.0.20/ that serves pages. It tries each word in a list as a path and reports what exists."
          why: "If the target isn't a web server (or wrong port), every request fails. Confirm it responds first."
          where: "The base URL is dirb's first argument."
        find_it: >
          Find web ports with nmap (80=http, 443=https, sometimes 8080). The base URL ends with a
          slash: http://HOST/. Only test hosts you own or are authorized to. Install with
          `sudo apt install dirb` if missing.
        command_anatomy:
          - {token: "curl -sI", does: "fetch just the headers, silently"}
          - {token: "http://TARGET/", does: "the base URL to confirm"}
        try_this: "curl -sI http://TARGET/"
        success_criteria: "An HTTP response line prints (200/301/403) — it's a web server."
        expected_output: |
          HTTP/1.1 200 OK
          Server: Apache/2.4.41 (Ubuntu)
        alternatives:
          - trigger: "connection refused"
            cause: "No web service on that port."
            fix: "Find the real web port with `nmap -p- TARGET` and use http://TARGET:PORT/."
            check: "curl returns an HTTP line."
      - step_id: g2
        title: "Run a basic scan (built-in wordlist)"
        slot_target: TARGET_PIVOT
        explanation:
          what: "`dirb <url>` uses dirb's default common.txt wordlist and prints each path that exists, plus recursively scans found directories."
          why: "Zero-setup first pass — good for quickly surfacing obvious paths like /admin, /uploads."
          where: "The URL is the first argument."
        find_it: "Use the base URL from step 1. dirb recurses into directories it finds by default."
        command_anatomy:
          - {token: "dirb", does: "the program"}
          - {token: "http://TARGET/", does: "the base URL (must be first)"}
        try_this: "dirb http://TARGET/"
        success_criteria: "Found paths print with + and their HTTP codes."
        expected_output: |
          -----------------
          DIRB v2.22
          URL_BASE: http://TARGET/
          WORDLIST_FILES: /usr/share/dirb/wordlists/common.txt
          -----------------
          + http://TARGET/index.html (CODE:200|SIZE:10701)
          ==> DIRECTORY: http://TARGET/admin/
          + http://TARGET/robots.txt (CODE:200|SIZE:122)
        alternatives:
          - trigger: "everything is CODE:403 or CODE:200 same size"
            cause: "Server blocks the scanner UA, or returns a soft-404 page."
            fix: "Set a browser agent with `-a \"Mozilla/5.0\"`; note a constant size and ignore it."
            check: "You see varied, real results."
      - step_id: g3
        title: "Use a bigger wordlist and hunt files by extension"
        slot_target: TARGET_PIVOT
        explanation:
          what: "Pass a wordlist as the SECOND argument to swap the default; `-X .php,.txt,.bak` also tries each word with those file extensions."
          why: "A larger list finds more, and extensions catch files (config.php, backup.bak) not just folders."
          where: "URL then wordlist are positional (in that order); -X is an option."
        find_it: "Bigger lists: /usr/share/dirb/wordlists/big.txt, or SecLists. Pick extensions matching the app (.php for PHP)."
        command_anatomy:
          - {token: "dirb http://TARGET/", does: "the target"}
          - {token: "/usr/share/dirb/wordlists/big.txt", does: "the wordlist (second positional)"}
          - {token: "-X .php,.txt,.bak", does: "also try each word with these extensions"}
        try_this: "dirb http://TARGET/ /usr/share/dirb/wordlists/big.txt -X .php,.txt,.bak"
        success_criteria: "More paths and specific files (e.g. /config.php) are found."
        expected_output: |
          + http://TARGET/config.php (CODE:200|SIZE:0)
          + http://TARGET/backup.bak (CODE:200|SIZE:20481)
        alternatives:
          - trigger: "wordlist not found"
            cause: "Wrong path."
            fix: "List available lists with `ls /usr/share/dirb/wordlists/`; install SecLists for more."
            check: "The wordlist path exists."
      - step_id: g4
        title: "Save the results"
        slot_target: OUTPUT_OPTIONS
        explanation:
          what: "`-o <file>` writes all found URLs to a file you can keep or feed into nikto/nmap."
          why: "You'll want the discovered paths recorded for the next tool and the report."
          where: "OUTPUT_OPTIONS; -o names the file."
        find_it: "Choose a writable path (your home)."
        command_anatomy:
          - {token: "dirb http://TARGET/ <wordlist>", does: "the scan"}
          - {token: "-o ~/dirb.txt", does: "save the found URLs to this file"}
        try_this: "dirb http://TARGET/ /usr/share/dirb/wordlists/common.txt -o ~/dirb.txt"
        success_criteria: "The scan runs and ~/dirb.txt lists the found URLs (check with `cat`)."
        expected_output: |
          (results also written to:)
          $ cat ~/dirb.txt
          + http://TARGET/admin/ (CODE:301)
        alternatives:
          - trigger: "Permission denied"
            cause: "Unwritable location."
            fix: "Save under your home: `-o ~/dirb.txt`."
            check: "The file is created."
  - flow_id: wordlist_ext
    title: "Wordlist + extensions (reference)"
    goal: "Custom list and file extensions."
    command_builder_id: dirb
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: db1
        title: "dirb url wordlist -X"
        slot_target: TARGET_PIVOT
        explanation:
          what: "`dirb <url> <wordlist> -X .php,.txt` — url + wordlist positional, extensions via -X."
          why: "Targeted content discovery."
          where: "TARGET_PIVOT (url+wordlist); -X in ACTION_OPTIONS."
        find_it: "A URL, a wordlist path, and relevant extensions."
        command_anatomy:
          - {token: "http://TARGET/ big.txt", does: "url + wordlist (order matters)"}
          - {token: "-X .php,.txt", does: "file extensions to append"}
        try_this: "dirb http://TARGET/ /usr/share/dirb/wordlists/big.txt -X .php,.txt"
        success_criteria: "Files with those extensions appear."
        expected_output: |
          + http://TARGET/login.php (CODE:200)
        alternatives:
          - trigger: "no files found"
            cause: "Wrong extensions for the stack."
            fix: "Match extensions to the app (.asp, .aspx, .jsp...)."
            check: "Relevant files appear."
  - flow_id: proxy_auth_throttle
    title: "Proxy routing, HTTP auth & throttling (reference)"
    goal: "Scan behind a login, through Burp/ZAP, or slowly enough not to flood/trip a WAF."
    command_builder_id: dirb
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: pa1
        title: "Route the scan through a proxy (e.g. Burp Suite)"
        slot_target: ACTION_OPTIONS
        glossary_refs: [proxy]
        explanation:
          what: "`-p <proxy[:port]>` sends every dirb request through an HTTP proxy instead of straight to the target. If you omit the port, dirb defaults to 1080."
          why: "Routing through Burp Suite or OWASP ZAP lets you watch, replay, or modify every request dirb makes — turning a blind brute-force into something you can inspect and steer."
          where: "ACTION_OPTIONS."
        find_it: "Start Burp/ZAP, note its proxy listener address (Burp's default is 127.0.0.1:8080). Make sure the proxy's 'Intercept' is off first or every single request will pause waiting for you."
        command_anatomy:
          - {token: "dirb http://TARGET/", does: "the target as usual"}
          - {token: "-p 127.0.0.1:8080", does: "send every request through the proxy listening here"}
        try_this: "dirb http://TARGET/ -p 127.0.0.1:8080"
        success_criteria: "Requests appear in Burp's HTTP history / ZAP's site map while dirb runs."
        expected_output: |
          -----------------
          DIRB v2.22
          URL_BASE: http://TARGET/
          PROXY: 127.0.0.1:8080
          -----------------
          + http://TARGET/admin/ (CODE:301|SIZE:0)
        alternatives:
          - trigger: "'Can't connect to proxy' or the scan hangs immediately"
            cause: "The proxy tool isn't running, or is listening on a different address/port than you gave dirb."
            fix: "Confirm Burp/ZAP is running and check its exact listener address in its Proxy settings tab."
            check: "curl -x 127.0.0.1:8080 http://TARGET/ succeeds from the same terminal."
          - trigger: "scan runs but nothing shows up in Burp's history"
            cause: "Burp's proxy listener is bound to a different interface, or 'Intercept' is silently dropping requests."
            fix: "Turn Intercept off (Proxy tab), and confirm the listener is bound to 127.0.0.1 in Proxy > Options."
            check: "A manual `curl -x 127.0.0.1:8080 http://TARGET/` shows up in Burp's HTTP history."
      - step_id: pa2
        title: "Authenticate to the proxy itself (if it requires a login)"
        slot_target: ACTION_OPTIONS
        glossary_refs: [proxy]
        explanation:
          what: "`-P <proxy_username:proxy_password>` logs in to the PROXY server, not the target website. Only relevant for corporate/gateway proxies that require their own credentials to pass traffic through."
          why: "Some networks force all outbound HTTP through an authenticated proxy — without this, every request gets rejected by the proxy before it even reaches the target."
          where: "ACTION_OPTIONS; always paired with -p."
        find_it: "Ask whoever manages the network proxy for its login, or check your browser's saved proxy credentials. Most home setups (Burp/ZAP) don't need this at all."
        command_anatomy:
          - {token: "dirb http://TARGET/ -p proxy.corp.local:3128", does: "route through the corporate proxy"}
          - {token: "-P proxyuser:proxypass", does: "the LOGIN FOR THE PROXY (not the target site)"}
        try_this: "dirb http://TARGET/ -p proxy.corp.local:3128 -P proxyuser:proxypass"
        success_criteria: "The scan proceeds normally instead of every request failing with a proxy-auth error."
        expected_output: |
          -----------------
          PROXY: proxy.corp.local:3128
          -----------------
          + http://TARGET/index.html (CODE:200|SIZE:4521)
        alternatives:
          - trigger: "'407 Proxy Authentication Required' still appears"
            cause: "Wrong proxy credentials, or the proxy needs NTLM auth which dirb's -P (Basic) doesn't support."
            fix: "Double-check the proxy username/password; if it's NTLM, dirb can't authenticate to it directly — you'd need an NTLM-aware local relay proxy in front."
            check: "curl -x proxy.corp.local:3128 -U proxyuser:proxypass http://TARGET/ works from the terminal."
      - step_id: pa3
        title: "Log in with HTTP Basic Auth"
        slot_target: ACTION_OPTIONS
        glossary_refs: [basic_auth]
        explanation:
          what: "`-u <username:password>` supplies credentials for HTTP Basic Authentication — the plain browser login POPUP some sites/directories use (not a web page login form)."
          why: "Without this, every request to a Basic-Auth-protected area returns 401 Unauthorized and dirb can't tell real content from the login wall."
          where: "ACTION_OPTIONS."
        find_it: "If a browser visit to the URL shows a native username/password popup (not a styled login page), it's Basic Auth. Use credentials you were given for the authorized test."
        command_anatomy:
          - {token: "dirb http://TARGET/admin/", does: "a Basic-Auth-protected area"}
          - {token: "-u admin:password123", does: "the username:password to send with every request"}
        try_this: "dirb http://TARGET/admin/ -u admin:password123"
        success_criteria: "Responses stop being uniform 401s — you see real 200/301/403 codes for different paths."
        expected_output: |
          + http://TARGET/admin/dashboard.php (CODE:200|SIZE:8841)
          + http://TARGET/admin/logout.php (CODE:302|SIZE:0)
        alternatives:
          - trigger: "every result is still CODE:401"
            cause: "Wrong username/password, or the area actually uses a login FORM (session cookie) rather than Basic Auth."
            fix: "Confirm it's really Basic Auth by checking for the browser popup; if it's a form login instead, log in via the browser/Burp and use the Cookie field instead of -u."
            check: "curl -u admin:password123 http://TARGET/admin/ returns something other than 401."
      - step_id: pa4
        title: "Throttle requests so you don't flood the server"
        slot_target: ACTION_OPTIONS
        glossary_refs: [throttle]
        explanation:
          what: "`-z <millisecs>` adds a delay (in milliseconds) between each request dirb sends."
          why: "dirb fires requests as fast as it can by default, which can overload a fragile server, trip a WAF's rate-limiting, or get your IP auto-blocked. A small delay trades speed for reliability and stealth."
          where: "ACTION_OPTIONS."
        find_it: "Start with something modest like 200ms; raise it if you see errors or blocks, lower it if the target clearly tolerates fast scans."
        command_anatomy:
          - {token: "dirb http://TARGET/", does: "the target as usual"}
          - {token: "-z 200", does: "wait 200 milliseconds between each request"}
        try_this: "dirb http://TARGET/ -z 200"
        success_criteria: "The scan visibly takes longer per word but completes without connection errors or a sudden wall of 403s."
        expected_output: |
          -----------------
          DIRB v2.22
          URL_BASE: http://TARGET/
          -----------------
          + http://TARGET/robots.txt (CODE:200|SIZE:122)
        alternatives:
          - trigger: "you start seeing 403s or connection resets partway through, even WITH -z set"
            cause: "The delay is still too aggressive for this server's rate-limit/WAF threshold."
            fix: "Raise -z further (e.g. 500 or 1000ms) and consider adding Silent mode (-S) to keep output readable at a slower pace."
            check: "The 403s/resets stop appearing at the higher delay."
          - trigger: "scan is now far too slow for a large wordlist"
            cause: "-z applies per-request, and dirb is single-threaded, so throttling directly multiplies total scan time."
            fix: "Trade off: use a smaller, targeted wordlist instead of throttling a huge one, or accept the longer runtime on an authorized, low-risk target."
            check: "Estimate: wordlist size x delay = rough minimum scan time."

quick_build:
  builder: dirb
  title: "Quick scan"
  fields:
    - field_id: url
      label: "Base URL"
      type: string
      required: true
      placeholder: "http://host/"
    - field_id: wordlist
      label: "Wordlist"
      type: path
      placeholder: "/usr/share/dirb/wordlists/common.txt"
    - field_id: extensions
      label: "Extensions (-X)"
      type: string
      placeholder: ".php,.txt,.bak"
    - field_id: cookie
      label: "Cookie (-c)"
      type: string
      placeholder: "PHPSESSID=abc123  (optional, scan as a logged-in session)"
      help: "Sends this Cookie header with every request — useful for scanning pages that need an existing login session."
    - field_id: agent
      label: "User-Agent (-a)"
      type: string
      placeholder: "Mozilla/5.0 ...  (optional)"
      help: "Pretend to be a browser instead of dirb's default scanner UA. Some servers block or soft-404 requests from unknown/known-scanner user agents."
    - field_id: http_auth
      label: "HTTP Basic Auth (-u)"
      type: string
      placeholder: "username:password  (optional)"
      help: "Logs in with HTTP Basic Authentication (the browser login popup) before scanning. Not for web login FORMS — those need a Cookie instead."
    - field_id: header
      label: "Custom header (-H)"
      type: string
      placeholder: "Authorization: Bearer TOKEN  (optional)"
      help: "Adds one extra HTTP header to every request — e.g. an API token or a custom header your app expects."
    - field_id: proxy
      label: "Proxy (-p)"
      type: string
      placeholder: "127.0.0.1:8080  (optional, e.g. route through Burp Suite)"
      help: "Sends every request through this proxy — lets you watch or intercept dirb's traffic in Burp/ZAP. Default proxy port is 1080 if you omit it."
    - field_id: proxy_auth
      label: "Proxy authentication (-P)"
      type: string
      placeholder: "proxyuser:proxypass  (optional)"
      help: "Only needed if the PROXY itself requires a login — separate from the target site's own login (set Proxy above too)."
    - field_id: delay_ms
      label: "Delay between requests, ms (-z)"
      type: int
      placeholder: "200  (optional)"
      help: "Throttles requests to avoid flooding the server or tripping rate-limits/WAFs. Higher = slower but gentler."
    - field_id: silent
      label: "Silent mode (-S)"
      type: bool
      help: "Only print found paths, not every word being tried — cleaner output on big wordlists."
    - field_id: output
      label: "Save results (-o)"
      type: path
      placeholder: "~/dirb.txt  (optional)"
    - field_id: no_recursion
      label: "Don't recurse (-r)"
      type: bool
