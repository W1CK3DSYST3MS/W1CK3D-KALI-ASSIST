  - flow_id: maintenance
    title: "Maintenance / updating (reference, Kali)"
    goal: "Update Metasploit the Kali way."
    command_builder_id: msfconsole
    slots: [PROGRAM]
    steps:
      - step_id: ms11
        title: "Update via apt on Kali"
        slot_target: null
        explanation:
          what: "On Kali, update via apt: `sudo apt update && sudo apt install metasploit-framework` (not msfupdate)."
          why: "Kali packages Metasploit; apt keeps it consistent with the distro."
          where: "System maintenance (concept)."
        find_it: "Just needs internet + apt working."
        command_anatomy:
          - {token: "sudo apt update", does: "refresh package lists"}
          - {token: "sudo apt install metasploit-framework", does: "upgrade Metasploit the Kali way"}
        try_this: "sudo apt update && sudo apt install metasploit-framework"
        success_criteria: "Metasploit updates to the packaged version."
        expected_output: |
          metasploit-framework is already the newest version (...)
        alternatives:
          - trigger: "apt errors"
            cause: "Package/keyring issues."
            fix: "See the Packages/keys/certs troubleshooter."
            check: "Resolve apt first, then retry."

  - flow_id: console_launch_modes
    title: "msfconsole launch modes: resource scripts & logging (reference)"
    goal: "Automate a whole sequence with a saved script, capture a transcript, or skip the database — all before you type a single console command."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS, OUTPUT_OPTIONS]
    steps:
      - step_id: cl1
        title: "Automate a sequence with a resource script (-r)"
        slot_target: ACTION_OPTIONS
        glossary_refs: [resource_script]
        explanation:
          what: "A resource script is a plain text file with one console command per line — the same commands you'd type after `msf6 >`. `-r <file>.rc` runs it automatically on startup, top to bottom, exactly as if you'd typed each line."
          why: "Every other flow in this tool shows commands chained with `-x \"cmd; cmd\"` on one line — fine for 2-3 commands, unreadable and unmaintainable for a real 15-step engagement workflow. A resource script is the same idea, but as a saved, reusable, version-controllable file."
          where: "ACTION_OPTIONS; -r takes the file path as its argument."
        find_it: >
          Write one with a text editor — each line is a normal console command, comments start with #.
          Example content for ~/scripts/recon.rc:
          `workspace -a lab` / `db_nmap -sV 10.0.0.0/24` / `hosts` / `services`.
        command_anatomy:
          - {token: "msfconsole -q", does: "quiet startup"}
          - {token: "-r ~/scripts/recon.rc", does: "run every line in this file automatically"}
        try_this: "msfconsole -q -r ~/scripts/recon.rc"
        success_criteria: "Each line from the .rc file executes in order, same as typing it manually, then you land at the normal msf6 prompt."
        expected_output: |
          [*] Processing /home/user/scripts/recon.rc for ERB directives.
          resource (recon.rc)> workspace -a lab
          resource (recon.rc)> db_nmap -sV 10.0.0.0/24
          msf6 >
        alternatives:
          - trigger: "'No such file' error"
            cause: "Wrong path, or the file wasn't saved where you think."
            fix: "Use an absolute or ~-relative path; confirm with `ls ~/scripts/recon.rc` first."
            check: "The file exists at the exact path given to -r."
          - trigger: "a line in the middle fails and stops everything"
            cause: "Resource scripts run sequentially — one bad command (e.g. `use` on a non-existent module) can break later lines that depended on it."
            fix: "Test complex sequences interactively first, or keep resource scripts short and single-purpose."
            check: "Re-run the failing line by hand in the console to see the exact error."
      - step_id: cl2
        title: "Save a transcript of the whole session (-o)"
        slot_target: OUTPUT_OPTIONS
        explanation:
          what: "`-o <file>` logs everything printed to the console — banner, command output, errors — into a file, in addition to showing it on screen."
          why: "Unlike a resource script (which is your INPUT), this captures the OUTPUT — useful as engagement evidence or for reviewing a long automated run later without staring at a scrollback buffer."
          where: "OUTPUT_OPTIONS."
        find_it: "Any writable path — your home directory always works."
        command_anatomy:
          - {token: "msfconsole -q -r ~/scripts/recon.rc", does: "an automated run, from step 1"}
          - {token: "-o ~/logs/recon_session.log", does: "also write everything printed to this file"}
        try_this: "msfconsole -q -r ~/scripts/recon.rc -o ~/logs/recon_session.log"
        success_criteria: "The console runs normally and ~/logs/recon_session.log contains the same text that scrolled past on screen."
        expected_output: |
          (console output as usual, AND:)
          $ cat ~/logs/recon_session.log
          [*] Processing /home/user/scripts/recon.rc for ERB directives.
          ...
        alternatives:
          - trigger: "permission denied writing the log"
            cause: "Unwritable directory."
            fix: "Save under your home: `mkdir -p ~/logs && msfconsole -q -o ~/logs/session.log`."
            check: "The log directory exists and is writable."
      - step_id: cl3
        title: "Skip the database entirely (-n)"
        slot_target: GLOBAL_OPTIONS
        glossary_refs: [msfdb]
        explanation:
          what: "`-n`/`--no-database` starts msfconsole WITHOUT connecting to PostgreSQL at all, even if it's running and configured."
          why: "Faster startup for a quick one-off lookup (e.g. `search`, `info`, generating a payload reminder) when you don't need hosts/services/loot tracking — also useful for confirming whether a problem is 'the console' or 'the database connection' when troubleshooting."
          where: "GLOBAL_OPTIONS."
        find_it: "No input needed — it's a plain flag."
        command_anatomy:
          - {token: "msfconsole -q -n", does: "quiet startup, no database connection attempted"}
        try_this: "msfconsole -q -n -x \"search type:exploit name:vsftpd\""
        success_criteria: "The console starts noticeably faster and `db_status` (if you check) reports no database connected — by choice, not by error."
        expected_output: |
          msf6 > search type:exploit name:vsftpd
          (results print normally — search doesn't need the DB)
        alternatives:
          - trigger: "a command complains it needs the database (e.g. db_nmap, workspace)"
            cause: "-n disables the DB for the whole session — anything DB-backed (db_nmap, hosts, workspace, loot) won't work."
            fix: "Drop -n if you need those commands; -n is only for DB-independent quick tasks."
            check: "Re-run without -n if DB-backed commands are needed."

quick_build:
  builder: msfvenom
  title: "Generate payload"
  fields:
    - field_id: payload
      label: "Payload"
      type: string
      required: true
      placeholder: "windows/x64/meterpreter/reverse_tcp"
    - field_id: lhost
      label: "LHOST"
      type: string
      placeholder: "10.0.0.5"
    - field_id: lport
      label: "LPORT"
      type: int
      placeholder: "4444"
    - field_id: options
      label: "Extra datastore options"
      type: string
      placeholder: "EXITFUNC=thread,PrependMigrate=true  (optional, comma-separated KEY=VAL pairs)"
      help: "Any other payload option beyond LHOST/LPORT, as KEY=VAL. Separate multiple with commas."
    - field_id: list_options
      label: "List this payload's options instead of building (--list-options)"
      type: bool
      help: "Set Payload above, then check this — shows exactly what datastore values (LHOST, LPORT, etc.) this payload accepts, WITHOUT generating anything. The natural first step before filling in the rest of this form."
    - field_id: arch
      label: "Architecture (-a)"
      type: string
      placeholder: "x64, x86, ...  (optional — msfvenom --list archs to see all)"
    - field_id: platform
      label: "Platform (--platform)"
      type: string
      placeholder: "windows, linux, ...  (optional — msfvenom --list platforms to see all)"
    - field_id: encoder
      label: "Encoder (-e)"
      type: string
      placeholder: "x86/shikata_ga_nai  (optional)"
      help: "Encoders help avoid bad characters — they are NOT reliable antivirus evasion, don't rely on them for that."
    - field_id: iterations
      label: "Encoder iterations (-i)"
      type: int
      placeholder: "e.g. 3  (optional — only applies with an encoder)"
    - field_id: badchars
      label: "Bad characters to avoid (-b)"
      type: string
      placeholder: "\\x00\\xff  (optional)"
    - field_id: template
      label: "Template executable (-x)"
      type: path
      placeholder: "putty.exe  (optional — inject the payload into this existing program)"
      help: "Wraps the payload inside a real executable so the result looks like a legitimate program. Only ever use on files you own, in an authorized lab/engagement."
    - field_id: keep
      label: "Keep the template's original behaviour (-k)"
      type: bool
      help: "Only has an effect together with Template above — preserves the original program's functionality, running the payload alongside it instead of replacing it."
    - field_id: encrypt
      label: "Encrypt the raw shellcode (--encrypt)"
      type: choice
      choices: [aes256, base64, rc4, xor]
      help: "Encrypts/encodes the shellcode itself (different from the Encoder field above). Optional."
    - field_id: encrypt_key
      label: "Encryption key (--encrypt-key)"
      type: string
      placeholder: "optional — pairs with Encrypt above"
    - field_id: encrypt_iv
      label: "Encryption IV (--encrypt-iv)"
      type: string
      placeholder: "optional — pairs with Encrypt above"
    - field_id: smallest
      label: "Use the smallest possible payload (--smallest)"
      type: bool
      help: "Tries every available encoder and keeps whichever produces the smallest result. Usually used WITHOUT also picking an Encoder yourself."
    - field_id: space
      label: "Maximum payload size, bytes (-s/--space)"
      type: int
      placeholder: "e.g. 1000  (optional)"
      help: "The build fails if the final payload would exceed this size — for injecting into a size-constrained buffer."
    - field_id: encoder_space
      label: "Maximum ENCODED payload size (--encoder-space)"
      type: int
      placeholder: "optional — defaults to the Space value above"
    - field_id: nopsled
      label: "NOP sled length, bytes (-n/--nopsled)"
      type: int
      placeholder: "e.g. 16  (optional)"
      help: "Prepends this many NOP (no-op) instructions before the payload — the classic technique for landing safely when a jump address isn't exact."
    - field_id: pad_nops
      label: "Pad with NOPs to reach an exact total size (--pad-nops)"
      type: bool
      help: "Only has an effect together with NOP sled length above — uses that value as the TOTAL payload size, auto-filling the gap with NOPs."
    - field_id: add_code
      label: "Prepend additional shellcode file (-c/--add-code)"
      type: path
      placeholder: "extra_shellcode.bin  (optional, Windows payloads)"
    - field_id: service_name
      label: "Service name for a service binary (--service-name)"
      type: string
      placeholder: "optional — only for service-executable output formats"
    - field_id: sec_name
      label: "Custom PE section name (--sec-name)"
      type: string
      placeholder: "optional — default is a random 4-character string"
      help: "The section name used when generating large Windows binaries; a default random name is normal, but a custom one can help blend in."
    - field_id: var_name
      label: "Custom output variable name (-v/--var-name)"
      type: string
      placeholder: "optional — for source-code formats like C/Python/Powershell"
    - field_id: timeout
      label: "STDIN read timeout, seconds (-t/--timeout)"
      type: int
      placeholder: "default 30, 0 = disable  (optional)"
      help: "Only matters when Payload is '-' or STDIN (reading custom shellcode from standard input) — ignored for a normal named payload."
    - field_id: format
      label: "Format (-f)"
      type: string
      placeholder: "exe, elf, raw, python"
    - field_id: outfile
      label: "Output file (-o)"
      type: path
      placeholder: "payload.exe"
    - field_id: list
      label: "List available options instead of building (--list)"
      type: choice
      choices: [payloads, encoders, nops, platforms, archs, encrypt, formats, all]
      help: "Shortcut: shows msfvenom's own list for the chosen type instead of generating a payload — ignores every other field above."
