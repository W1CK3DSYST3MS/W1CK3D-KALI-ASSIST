tool_id: nmap
display_name: "nmap (Network Mapper)"
binary_candidates: [nmap]
categories: [reconnaissance]
os_profile: kali
one_liner: "Discovers hosts and the services/ports they expose on a network."
authorization_gate: true
authorization_text: >
  Only scan systems you own or have explicit written permission to test.
  Unauthorized scanning may be illegal. For practice, use nmap's official
  permission-granted host scanme.nmap.org or your own lab/VMs. Continue?
flows:
  - flow_id: guided
    title: "Guided first scan (START HERE)"
    goal: "From a blank terminal to a saved scan — with every input explained."
    command_builder_id: nmap
    slots: [PROGRAM, GLOBAL_OPTIONS, TARGET_PIVOT, ACTION_OPTIONS, OUTPUT_OPTIONS]
    steps:
      - step_id: g1
        title: "Decide what you're allowed to scan (your target)"
        slot_target: null
        glossary_refs: [host_discovery]
        explanation:
          what: "A 'target' is the address of the machine you want to look at — either a name like scanme.nmap.org or an IP like 192.168.1.10, or a whole range like 192.168.1.0/24."
          why: "nmap needs to know WHERE to look. Everything else in this flow reuses this target, so get it right (and authorized) first."
          where: "You'll type this target at the end of the nmap command."
        find_it: >
          Three ways to get a legal target: (1) For safe practice, use nmap's own permission-
          granted host: scanme.nmap.org. (2) If you were given a target by a lab/engagement, use
          that exact IP or hostname. (3) To scan your OWN network, first find it: run `ip a` and
          look at the line starting with 'inet' under your main interface (e.g. eth0 or wlan0).
          If it shows 192.168.1.24/24, your network range is 192.168.1.0/24.
        command_anatomy:
          - {token: "ip", does: "the Linux tool that shows network configuration"}
          - {token: "a", does: "short for 'address' — list interfaces and their IP addresses"}
        try_this: "ip a"
        success_criteria: "You can name one target: scanme.nmap.org, a given IP, or your own subnet like 192.168.1.0/24."
        expected_output: |
          2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 ...
              inet 192.168.1.24/24 brd 192.168.1.255 scope global dynamic eth0
        alternatives:
          - trigger: "only 'lo' with 127.0.0.1 shows — no real address"
            cause: "You're not connected to a network."
            fix: "Connect to Wi-Fi/ethernet, then re-run `ip a`. For now you can still practise against scanme.nmap.org over the internet."
            check: "An inet line appears on eth0/wlan0, or just use scanme.nmap.org."
          - trigger: "you're unsure which address is 'the network'"
            cause: "Reading CIDR notation is new."
            fix: "Take your inet value (e.g. 192.168.1.24/24), replace the last number with 0, keep the /24: that's your range (192.168.1.0/24)."
            check: "You have an address ending in .0/24."
      - step_id: g2
        title: "Check the target is actually up"
        slot_target: ACTION_OPTIONS
        glossary_refs: [host_discovery]
        explanation:
          what: "A 'ping scan' just asks 'are you there?' without checking any ports. It's the fastest way to confirm a host (or find live hosts in a range)."
          why: "No point scanning ports on a machine that's switched off or doesn't exist — this saves you a long wait on a dead target."
          where: "-sn is an ACTION option; the target goes at the end."
        find_it: "Use the target you settled on in step 1. Replace <target> below with it (e.g. scanme.nmap.org)."
        command_anatomy:
          - {token: "nmap", does: "the program you're running"}
          - {token: "-sn", does: "'scan-no-port' — do host discovery ONLY, don't scan ports"}
          - {token: "<target>", does: "the host or range to check — you type this in"}
        try_this: "nmap -sn scanme.nmap.org"
        success_criteria: "It reports the host is up (and, for a range, lists which hosts are up)."
        expected_output: |
          Starting Nmap 7.94 ( https://nmap.org )
          Nmap scan report for scanme.nmap.org (45.33.32.156)
          Host is up (0.12s latency).
          Nmap done: 1 IP address (1 host up) scanned in 0.34s
        alternatives:
          - trigger: "'Host seems down' but you know it's on"
            cause: "The target (or a firewall) is blocking ping probes — common on Windows and hardened hosts."
            fix: "Add -Pn to skip the up-check and scan anyway: `nmap -Pn -sn <target>` — actually for the next steps just add -Pn to the port scan."
            check: "You proceed to port scanning with -Pn."
          - trigger: "the scan is very slow"
            cause: "nmap is doing DNS lookups, or timing is conservative."
            fix: "Add -n (skip DNS) and -T4 (faster timing): `nmap -n -T4 -sn <target>`."
            check: "It finishes noticeably faster."
      - step_id: g3
        title: "Do a basic port scan"
        slot_target: ACTION_OPTIONS
        glossary_refs: [port_state, connect_scan, tcp]
        explanation:
          what: "With no scan-type flag, nmap checks the 1000 most common TCP ports and prints a table of which are open, closed, or filtered."
          why: "Open ports are the doors into a machine — this is the core of what nmap is for."
          where: "Just nmap + the target; nmap picks sensible defaults."
        find_it: "Same target as before. You don't need to find anything new for this step."
        command_anatomy:
          - {token: "nmap", does: "the program"}
          - {token: "<target>", does: "the host to scan (top 1000 TCP ports by default)"}
        try_this: "nmap scanme.nmap.org"
        success_criteria: "A PORT / STATE / SERVICE table prints, showing at least one 'open' port."
        expected_output: |
          PORT      STATE SERVICE
          22/tcp    open  ssh
          80/tcp    open  http
          9929/tcp  open  nping-echo
          31337/tcp open  Elite
        alternatives:
          - trigger: "every port shows 'filtered'"
            cause: "A firewall is dropping the probes, or the host blocked the up-check."
            fix: "Add -Pn to skip host discovery: `nmap -Pn <target>`. If still filtered, that's the firewall talking."
            check: "Some ports show open/closed instead of all filtered."
          - trigger: "you only want specific ports"
            cause: "Scanning all 1000 is more than you need."
            fix: "Choose ports with -p: `nmap -p 22,80,443 <target>` (comma-separated) or a range `-p 1-1000`."
            check: "Only your chosen ports appear."
      - step_id: g4
        title: "Find out what's running on the open ports"
        slot_target: ACTION_OPTIONS
        glossary_refs: [service_detection]
        explanation:
          what: "-sV probes each open port to name the software AND its version — turning 'port 80 open' into 'Apache httpd 2.4.7'."
          why: "The version is what tells you whether something is outdated or vulnerable. This is usually the most useful single flag."
          where: "-sV is an ACTION option, added before the target."
        find_it: "Same target. Optionally reuse the open ports you found in step 3 with -p to make it faster."
        command_anatomy:
          - {token: "nmap", does: "the program"}
          - {token: "-sV", does: "'service version' — identify the software and version on each open port"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "nmap -sV scanme.nmap.org"
        success_criteria: "The table gains a VERSION column with software names and versions."
        expected_output: |
          PORT   STATE SERVICE VERSION
          22/tcp open  ssh     OpenSSH 6.6.1p1 Ubuntu 2ubuntu2.13 (Ubuntu Linux; protocol 2.0)
          80/tcp open  http    Apache httpd 2.4.7 ((Ubuntu))
        alternatives:
          - trigger: "version shows 'tcpwrapped' or blank"
            cause: "The service didn't reveal a banner nmap could read."
            fix: "Try harder probing: `nmap -sV --version-all <target>` (slower but more thorough)."
            check: "More VERSION cells are filled in."
          - trigger: "it's slow"
            cause: "Version probes take time on many ports."
            fix: "Limit to the open ports you already know: `nmap -sV -p 22,80 <target>`."
            check: "It finishes faster."
      - step_id: g5
        title: "Save your results to a file"
        slot_target: OUTPUT_OPTIONS
        glossary_refs: []
        explanation:
          what: "-oN writes the human-readable output to a file so you can keep it, re-read it, or paste it into a report."
          why: "Terminal output scrolls away. A saved scan is evidence and a reference you can come back to."
          where: "-oN plus a filename goes in the OUTPUT part of the command."
        find_it: >
          Pick a filename and a folder you can write to. Your home directory (~) always works.
          Avoid system folders. To make a dedicated folder first: `mkdir -p ~/scans` then save into it.
        command_anatomy:
          - {token: "nmap", does: "the program"}
          - {token: "-sV", does: "identify services/versions (from the last step)"}
          - {token: "-oN", does: "'output Normal' — save the readable output to the next filename"}
          - {token: "~/scans/first.txt", does: "the file to write (~ is your home directory)"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "mkdir -p ~/scans && nmap -sV -oN ~/scans/first.txt scanme.nmap.org"
        success_criteria: "The scan runs and the file exists — check with `cat ~/scans/first.txt`."
        expected_output: |
          # Nmap 7.94 scan initiated ...
          Nmap scan report for scanme.nmap.org (45.33.32.156)
          PORT   STATE SERVICE VERSION
          22/tcp open  ssh     OpenSSH 6.6.1p1 ...
          # Nmap done -- 1 IP address (1 host up) scanned
        alternatives:
          - trigger: "'Failed to open normal output file ... Permission denied'"
            cause: "You tried to write somewhere you don't own (e.g. a system directory)."
            fix: "Save under your home instead: `-oN ~/scans/first.txt`, and make the folder first with `mkdir -p ~/scans`."
            check: "The file is created and `cat` shows it."
          - trigger: "you want every format (for other tools)"
            cause: "Some tools import nmap's XML."
            fix: "Use -oA to write all three at once: `nmap -sV -oA ~/scans/first <target>` (creates .nmap, .xml, .gnmap)."
            check: "Three files named first.* appear."
  - flow_id: discovery
    title: "Host discovery — who is alive? (reference)"
    goal: "Find live hosts without port scanning."
    command_builder_id: nmap
    slots: [PROGRAM, ACTION_OPTIONS, TARGET_PIVOT]
    steps:
      - step_id: d1
        title: "Ping-sweep the subnet"
        slot_target: ACTION_OPTIONS
        glossary_refs: [host_discovery]
        explanation:
          what: "`-sn` does host discovery only (no port scan). Given a range, it lists every host that answers."
          why: "Quickly maps which machines exist before you spend time scanning ports."
          where: "ACTION_OPTIONS; the range fills TARGET_PIVOT."
        find_it: "Use your subnet from `ip a` (e.g. 192.168.1.0/24). The /24 means 'all 254 addresses on this network'."
        command_anatomy:
          - {token: "nmap", does: "the program"}
          - {token: "-sn", does: "host discovery only — no port scan"}
          - {token: "192.168.1.0/24", does: "the whole local network range to sweep"}
        try_this: "nmap -sn 192.168.1.0/24"
        success_criteria: "A list of hosts reported 'up'."
        expected_output: |
          Nmap scan report for 192.168.1.1
          Host is up (0.0021s latency).
          Nmap scan report for 192.168.1.24
          Host is up (0.00030s latency).
          Nmap done: 256 IP addresses (2 hosts up) scanned in 2.13s
        alternatives:
          - trigger: "no hosts found"
            cause: "The network may block ping, or the subnet is wrong."
            fix: "Add `-Pn` to assume hosts are up, or re-check the subnet with `ip a`."
            check: "Compare your IP/subnet from `ip a`."
          - trigger: "very slow"
            cause: "DNS resolution / conservative timing."
            fix: "Add `-n` to skip DNS, and/or `-T4` to speed timing."
            check: "Re-run and compare time."
  - flow_id: portscan
    title: "Port scan — what is open? (reference)"
    goal: "Find open ports on a target."
    command_builder_id: nmap
    slots: [PROGRAM, GLOBAL_OPTIONS, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: p1
        title: "Scan specific ports"
        slot_target: ACTION_OPTIONS
        glossary_refs: [port_state, syn_scan, connect_scan, privileged_scan]
        explanation:
          what: "`-sS` is a fast half-open SYN scan (needs privileges); `-sT` is a full connect scan (works without root). `-p` selects which ports."
          why: "Choosing the scan type by your privilege level, and limiting ports, makes scans fast and reliable."
          where: "ACTION_OPTIONS (scan type + ports)."
        find_it: "Target from discovery. Ports: pass the ones you care about (22,80,443) or a range (1-1000); omit -p to use the default top 1000."
        command_anatomy:
          - {token: "nmap", does: "the program"}
          - {token: "-sS", does: "SYN 'half-open' scan — fast and stealthy (needs sudo)"}
          - {token: "-p 22,80,443", does: "scan only these ports (comma-separated list)"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "sudo nmap -sS -p 22,80,443 192.168.1.10   # no root? use: nmap -sT -p 22,80,443 <target>"
        success_criteria: "A port table with states (open/closed/filtered)."
        expected_output: |
          PORT    STATE  SERVICE
          22/tcp  open   ssh
          80/tcp  open   http
          443/tcp closed https
        alternatives:
          - trigger: "requires root privileges / -sS fails"
            cause: "SYN scan needs raw-socket privileges."
            fix: "Use `sudo`, or switch to `-sT` (connect scan) which doesn't need root."
            check: "Re-run with sudo or -sT."
          - trigger: "all ports filtered"
            cause: "A firewall is likely dropping probes."
            fix: "Try `-Pn`, fewer ports, or slower timing `-T2`."
            check: "Compare results with -Pn."
          - trigger: "host seems down"
            cause: "Host discovery probes are blocked."
            fix: "Add `-Pn` to skip host discovery and scan anyway."
            check: "Re-run with -Pn."
  - flow_id: service_version
    title: "Service & version detection (reference)"
    goal: "Identify the service + version on open ports."
    command_builder_id: nmap
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: sv1
        title: "Probe versions with -sV"
        slot_target: ACTION_OPTIONS
        glossary_refs: [service_detection]
        explanation:
          what: "`-sV` probes open ports to name the service and its version."
          why: "Turns 'port 80 open' into 'Apache 2.4.x' — the detail you need to judge risk."
          where: "ACTION_OPTIONS."
        find_it: "Target as before; reuse the open ports you found with -p to speed it up."
        command_anatomy:
          - {token: "nmap", does: "the program"}
          - {token: "-sV", does: "detect the service software and version"}
          - {token: "-p 22,80,443", does: "limit to these known-open ports"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "nmap -sV -p 22,80,443 192.168.1.10"
        success_criteria: "The port table now shows SERVICE + VERSION columns."
        expected_output: |
          PORT    STATE SERVICE VERSION
          22/tcp  open  ssh     OpenSSH 8.2p1 Ubuntu
          80/tcp  open  http    Apache httpd 2.4.41
        alternatives:
          - trigger: "version shows tcpwrapped / unknown"
            cause: "The service hid its banner."
            fix: "Try `--version-all`, or an NSE script (nse flow)."
            check: "Compare with --version-all."
  - flow_id: os_detect
    title: "OS detection — what system is it? (reference)"
    goal: "Fingerprint the operating system."
    command_builder_id: nmap
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: os1
        title: "Fingerprint with -O (needs privileges)"
        slot_target: ACTION_OPTIONS
        glossary_refs: [os_detection, privileged_scan]
        explanation:
          what: "`-O` enables OS detection — nmap guesses the operating system from subtle network behaviour."
          why: "Knowing it's Windows vs Linux shapes everything you do next."
          where: "ACTION_OPTIONS; must run privileged (sudo)."
        find_it: "Target as before. This one needs sudo because it uses raw packets."
        command_anatomy:
          - {token: "sudo", does: "run with root privileges (required for OS detection)"}
          - {token: "nmap", does: "the program"}
          - {token: "-O", does: "operating-system detection (capital letter O, not zero)"}
          - {token: "<target>", does: "the host to fingerprint"}
        try_this: "sudo nmap -O 192.168.1.10"
        success_criteria: "An OS guess with an accuracy percentage."
        expected_output: |
          Running: Linux 5.X
          OS CPE: cpe:/o:linux:linux_kernel:5
          OS details: Linux 5.0 - 5.4
          Network Distance: 1 hop
        alternatives:
          - trigger: "requires privileges"
            cause: "OS detection needs raw sockets."
            fix: "Run with `sudo`."
            check: "Re-run with sudo."
          - trigger: "too many fingerprints / no exact match"
            cause: "Not enough open+closed ports found to be sure."
            fix: "Add `--osscan-guess` to show best guesses; accuracy depends on found ports."
            check: "Compare with --osscan-guess."
  - flow_id: udp
    title: "UDP scan — the other half of the network (reference)"
    goal: "Find open UDP services (DNS, SNMP, DHCP)."
    command_builder_id: nmap
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: u1
        title: "Scan top UDP ports"
        slot_target: ACTION_OPTIONS
        glossary_refs: [udp_scan, port_state, udp, handshake]
        explanation:
          what: "`-sU` scans UDP ports; `--top-ports 20` limits it to the 20 most common so it finishes this decade."
          why: "TCP scans miss UDP services like DNS (53), SNMP (161) and DHCP — sometimes the interesting ones."
          where: "ACTION_OPTIONS; run privileged."
        find_it: "Target as before. Keep the port count small — UDP scanning is slow by nature."
        command_anatomy:
          - {token: "sudo", does: "root privileges (UDP scanning needs raw sockets)"}
          - {token: "nmap", does: "the program"}
          - {token: "-sU", does: "scan UDP instead of TCP"}
          - {token: "--top-ports 20", does: "only the 20 most common UDP ports (keeps it fast)"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "sudo nmap -sU --top-ports 20 192.168.1.10"
        success_criteria: "A UDP port table (many show open|filtered — that's normal for UDP)."
        expected_output: |
          PORT    STATE         SERVICE
          53/udp  open          domain
          161/udp open|filtered snmp
          123/udp closed        ntp
        alternatives:
          - trigger: "extremely slow"
            cause: "UDP is slow by design (no reply often means 'wait and retry')."
            fix: "Limit with `--top-ports`, raise timing `-T4`, and be patient. This is expected."
            check: "It is not a failure; let it finish."
  - flow_id: nse
    title: "NSE scripting — go deeper (reference)"
    goal: "Run Nmap Scripting Engine checks."
    command_builder_id: nmap
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS, EXTRA_FILES]
    steps:
      - step_id: n1
        title: "Run default scripts"
        slot_target: ACTION_OPTIONS
        glossary_refs: [nse]
        explanation:
          what: "`--script=default` runs nmap's built-in set of safe scripts (grab page titles, banners, certificates, etc.)."
          why: "Scripts add context you don't get from a plain port scan — often the first real 'finding'."
          where: "ACTION_OPTIONS; script arguments would go in EXTRA_FILES."
        find_it: "Target plus the web ports you found (80,443). Scripts live in /usr/share/nmap/scripts if you want to browse them."
        command_anatomy:
          - {token: "nmap", does: "the program"}
          - {token: "-sV", does: "version detection (many scripts use it)"}
          - {token: "--script=default", does: "run the default, safe script category"}
          - {token: "-p 80,443", does: "focus on the web ports"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "nmap -sV --script=default -p 80,443 192.168.1.10"
        success_criteria: "Extra script output appears indented under the relevant ports."
        expected_output: |
          80/tcp open http Apache httpd 2.4.41
          |_http-title: Welcome to nginx!
          |_http-server-header: Apache/2.4.41
        alternatives:
          - trigger: "script not found"
            cause: "Wrong script name or category."
            fix: "Use a category like `--script=safe`, or list scripts under /usr/share/nmap/scripts."
            check: "Try `--script=safe`."
          - trigger: "vuln category seems intrusive"
            cause: "Some script categories actively probe for weaknesses."
            fix: "Prefer `safe`/`default` for learning; only run `vuln`/intrusive scripts on authorized targets."
            check: "Confirm authorization before vuln scripts."
      - step_id: n2
        title: "The -sC shortcut, and looking before you leap"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "`-sC` is just shorthand for `--script=default` — identical result, less typing. `--script-help=<script>` prints what a specific script actually does and what arguments it takes, WITHOUT running a scan. `--script-updatedb` refreshes nmap's local script database after you add/remove scripts manually."
          why: "--script-help is worth building the habit of using before running an unfamiliar script category (especially anything outside safe/default) — know what a script actually probes before you point it at something."
          where: "ACTION_OPTIONS; --script-help and --script-updatedb don't need a target at all."
        find_it: "A script name from /usr/share/nmap/scripts (e.g. http-title, http-enum) or a category name."
        command_anatomy:
          - {token: "nmap --script-help=http-enum", does: "show what this script does and its arguments — no target, no scan"}
        try_this: "nmap --script-help=http-enum"
        success_criteria: "A description of the script prints, including its categories and any --script-args it accepts."
        expected_output: |
          http-enum
          Categories: discovery intrusive
          .../scripts/http-enum.nse
          Enumerates common web application/interface paths on a web server.
        alternatives:
          - trigger: "no output, or 'no matching scripts'"
            cause: "Wrong script name, or the script database is stale after a manual script install."
            fix: "Check the exact filename under /usr/share/nmap/scripts/; if you added scripts manually, run `nmap --script-updatedb` first."
            check: "Confirm the .nse file actually exists in that directory."
  - flow_id: timing_stealth
    title: "Timing & stealth — control noise & speed (reference)"
    goal: "Go faster or quieter."
    command_builder_id: nmap
    slots: [PROGRAM, GLOBAL_OPTIONS, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: t1
        title: "Tune timing and discovery"
        slot_target: GLOBAL_OPTIONS
        glossary_refs: [timing_template]
        explanation:
          what: "`-T0..-T5` set the speed (0 = paranoid/slow, 5 = insane/fast); `-Pn` skips the up-check; `-n` skips DNS."
          why: "Lower numbers are quieter (harder to notice) but slower; higher numbers are faster but louder."
          where: "GLOBAL_OPTIONS, near the front of the command."
        find_it: "No new input — you're just adding tuning flags to a scan you already know how to run."
        command_anatomy:
          - {token: "nmap", does: "the program"}
          - {token: "-sS", does: "SYN scan"}
          - {token: "-T2", does: "slow, quieter timing (2 of 0-5)"}
          - {token: "-Pn", does: "skip host discovery — treat the host as up"}
          - {token: "-n", does: "skip DNS name lookups (faster)"}
          - {token: "-p 1-1000", does: "scan ports 1 through 1000"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "nmap -sS -T2 -Pn -n -p 1-1000 192.168.1.10"
        success_criteria: "Scan runs slower/quieter but returns the same kind of result table."
        expected_output: |
          Nmap scan report for 192.168.1.10
          PORT   STATE SERVICE
          22/tcp open  ssh
          80/tcp open  http
        alternatives:
          - trigger: "too slow to finish"
            cause: "`-T2` is deliberately slow."
            fix: "Raise to `-T4` for labs/CTFs."
            check: "Compare time at -T4."
          - trigger: "still blocked"
            cause: "A strict firewall, not timing."
            fix: "Timing won't beat a strict firewall; note it and move on."
            check: "Expected — record and continue."
      - step_id: t2
        title: "Fine-tune speed and reliability directly"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "-T0..5 is a PRESET bundle. For direct control: `--min-rate`/`--max-rate` set packets-per-second floor/ceiling; `--host-timeout` gives up on a slow/dead host after a time limit; `--max-retries` caps how many times a lost probe gets resent; `--scan-delay`/`--max-scan-delay` force a pause between probes."
          why: "-T4/-T5 alone can still be too slow on a huge port range, or too aggressive against a fragile/rate-limited target — these give you the exact knob instead of a preset bundle."
          where: "ACTION_OPTIONS."
        find_it: "No new input — same target, tuning an existing scan. --min-rate is the one most often reached for on large scans (e.g. --min-rate 1000 on a full -p- scan)."
        command_anatomy:
          - {token: "nmap --min-rate 1000", does: "never send slower than 1000 packets/sec"}
          - {token: "--host-timeout 5m", does: "give up on any single host after 5 minutes"}
          - {token: "--max-retries 1", does: "only resend a lost probe once (default is higher)"}
          - {token: "-p-", does: "all 65535 ports — this is where rate control matters most"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "nmap --min-rate 1000 --max-retries 1 -p- 192.168.1.10"
        success_criteria: "A full-port scan that would normally take a long time finishes noticeably faster."
        expected_output: |
          Nmap scan report for 192.168.1.10
          Not shown: 65530 closed tcp ports (reset)
          PORT      STATE SERVICE
          22/tcp    open  ssh
          80/tcp    open  http
        alternatives:
          - trigger: "results seem less reliable / some ports missing compared to a slower scan"
            cause: "Pushing --min-rate high and --max-retries low trades some accuracy for speed — lost probes on a lossy link don't get resent as many times."
            fix: "For a first fast pass this is fine; re-scan any interesting/borderline host slower (default timing, no --max-retries override) to confirm."
            check: "Cross-check important findings with a default-timing re-scan."
          - trigger: "target/network becomes unresponsive or you're asked to stop"
            cause: "--min-rate can genuinely flood a fragile target or a rate-limited link — this isn't purely passive tuning, it can have a real impact."
            fix: "Lower --min-rate immediately, or drop back to a -T based preset which is inherently more conservative."
            check: "Stop and reassess if you notice any real-world impact on the target."
  - flow_id: output
    title: "Output & reporting — capture results (reference)"
    goal: "Save results properly."
    command_builder_id: nmap
    slots: [PROGRAM, GLOBAL_OPTIONS, TARGET_PIVOT, ACTION_OPTIONS, OUTPUT_OPTIONS]
    output_manifest:
      base_dir: "./out"
      files: ["scan.nmap", "scan.xml", "scan.gnmap"]
      note: "`-oA base` writes all three formats at once."
    steps:
      - step_id: o1
        title: "Write all output formats"
        slot_target: OUTPUT_OPTIONS
        explanation:
          what: "`-oN` normal (human), `-oX` XML (for tools), `-oG` grepable; `-oA base` writes all three using one base name."
          why: "Different formats feed different needs — read the .nmap yourself, import the .xml into other tools."
          where: "OUTPUT_OPTIONS, after the scan flags."
        find_it: "Choose a base path in a writable folder (your home). `-oA ~/scans/scan` produces ~/scans/scan.nmap, .xml, .gnmap."
        command_anatomy:
          - {token: "nmap", does: "the program"}
          - {token: "-sV", does: "version detection"}
          - {token: "-p 22,80,443", does: "the ports to scan"}
          - {token: "-oA ~/scans/scan", does: "write ALL three output formats with this base name"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "mkdir -p ~/scans && nmap -sV -p 22,80,443 -oA ~/scans/scan 192.168.1.10"
        success_criteria: "scan.nmap, scan.xml and scan.gnmap appear in ~/scans/."
        expected_output: |
          Nmap scan report for 192.168.1.10
          PORT    STATE SERVICE VERSION
          22/tcp  open  ssh     OpenSSH 8.2p1
          # (and ls ~/scans shows scan.nmap  scan.xml  scan.gnmap)
        alternatives:
          - trigger: "permission denied writing file"
            cause: "Output directory is not writable."
            fix: "Pick a writable dir (your home), and create it first: `mkdir -p ~/scans`."
            check: "Confirm the dir exists and is writable."
      - step_id: o2
        title: "Cut the noise, see every packet, or resume an interrupted scan"
        slot_target: GLOBAL_OPTIONS
        explanation:
          what: "`--open` hides closed/filtered ports so only real findings show. `-d` (repeatable: -dd, -ddd) prints internal debug detail. `--packet-trace` shows literally every packet sent/received. `--resume <file>` picks a big scan back up from where a saved -oN/-oG output file left off, if it got interrupted."
          why: "--open is the single most useful output filter on a big scan — cuts a wall of 'closed' noise down to what actually matters. The debug/trace flags are for when something's behaving unexpectedly and you need to see exactly what nmap is doing at the packet level. --resume saves re-doing a multi-hour scan from scratch after an interruption."
          where: "GLOBAL_OPTIONS."
        find_it: "--open: any scan with more than a handful of ports. --resume: needs a previous -oN or -oG output file from a scan that got interrupted (Ctrl+C, connection drop, etc.)."
        command_anatomy:
          - {token: "nmap --open", does: "only print open (or possibly-open) ports"}
          - {token: "-p-", does: "all ports — where --open matters most"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "nmap --open -p- 192.168.1.10"
        success_criteria: "Only open/possibly-open ports appear — no 'Not shown: N closed ports' wall of text to scroll past."
        expected_output: |
          PORT   STATE SERVICE
          22/tcp open  ssh
          80/tcp open  http
        alternatives:
          - trigger: "output looks empty / no ports at all"
            cause: "Genuinely no open ports were found — --open is filtering correctly, there's just nothing to show."
            fix: "Re-run without --open to confirm the scan itself worked and found closed/filtered ports as expected."
            check: "Compare with/without --open to isolate 'no findings' from 'filter hid everything'."
          - trigger: "a scan got interrupted (Ctrl+C, connection dropped) partway through"
            cause: "Long scans over many hosts/ports can take a while — interruptions happen."
            fix: "If you were writing to -oN or -oG, resume it: `nmap --resume ~/scans/scan.gnmap` picks up where it left off instead of restarting."
            check: "Confirm the original run was writing -oN/-oG output — --resume needs that file to know where it stopped."
  - flow_id: full
    title: "Full / aggressive (combined, advanced)"
    goal: "Show how flags combine into one capable command."
    command_builder_id: nmap
    slots: [PROGRAM, GLOBAL_OPTIONS, TARGET_PIVOT, ACTION_OPTIONS, OUTPUT_OPTIONS]
    steps:
      - step_id: f1
        title: "One switch, many actions: -A"
        slot_target: ACTION_OPTIONS
        glossary_refs: [service_detection, os_detection, nse]
        explanation:
          what: "`-A` bundles OS detection + version detection + default scripts + traceroute into one flag."
          why: "Convenient and thorough, but loud. Now that you've learned each piece separately, you can see exactly what -A is doing."
          where: "ACTION_OPTIONS; run privileged for the full effect."
        find_it: "Target as before. -p- scans ALL 65535 ports, so expect this to take a while."
        command_anatomy:
          - {token: "sudo", does: "root privileges (for OS detection + raw scans)"}
          - {token: "nmap", does: "the program"}
          - {token: "-A", does: "aggressive: OS + version + default scripts + traceroute"}
          - {token: "-T4", does: "faster timing"}
          - {token: "-p-", does: "scan ALL 65535 ports (the dash means 'everything')"}
          - {token: "-oA ~/scans/full", does: "save all output formats"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "sudo nmap -A -T4 -p- -oA ~/scans/full 192.168.1.10"
        success_criteria: "A rich report combining versions, an OS guess, script output and a traceroute."
        expected_output: |
          PORT   STATE SERVICE VERSION
          22/tcp open  ssh     OpenSSH 8.2p1 Ubuntu
          80/tcp open  http    Apache httpd 2.4.41
          |_http-title: Home
          Running: Linux 5.X
          TRACEROUTE
          HOP RTT     ADDRESS
          1   0.30 ms 192.168.1.10
        alternatives:
          - trigger: "a sub-behavior failed (no OS guess, blank versions, no scripts)"
            cause: "One of version/OS/NSE didn't succeed inside -A."
            fix: "Run the failing piece on its own via its reference flow (service_version / os_detect / nse) to see the specific error."
            check: "Re-run that single behaviour in isolation."

  - flow_id: evasion
    title: "Firewall/IDS evasion — scan quietly (reference, advanced)"
    goal: "Change how your scan LOOKS to a firewall or IDS, without changing what it finds."
    command_builder_id: nmap
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: e1
        title: "Fragment your packets"
        slot_target: ACTION_OPTIONS
        glossary_refs: [packet_fragmentation, firewall_evasion]
        explanation:
          what: "`-f` splits each probe into several small pieces before sending, instead of one normal-sized packet."
          why: "Some older or simply-configured firewalls only inspect the FIRST fragment of a packet and wave the rest through — splitting can slip past that kind of filter. It won't help against a modern, properly-configured firewall that reassembles fragments first."
          where: "ACTION_OPTIONS; needs sudo (raw packet crafting)."
        find_it: "No new input — add -f to a scan you already know how to run, e.g. the basic port scan from the guided flow."
        command_anatomy:
          - {token: "sudo", does: "root privileges (required to craft raw packets)"}
          - {token: "nmap", does: "the program"}
          - {token: "-f", does: "fragment each probe into smaller pieces"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "sudo nmap -f scanme.nmap.org"
        success_criteria: "The scan completes and returns the same kind of port table as an unfragmented scan — fragmentation changes HOW the packets look, not what nmap reports back to you."
        expected_output: |
          PORT   STATE SERVICE
          22/tcp open  ssh
          80/tcp open  http
        alternatives:
          - trigger: "results look identical to a normal scan and nothing seems different"
            cause: "That's actually expected — you won't SEE evasion working from here. It only matters to whatever firewall/IDS is watching the traffic in between, which you have no visibility into from the scanning machine."
            fix: "If you're doing this for a real assessment, compare notes with defenders/logs on the other side (only in an authorized engagement) to see whether fragmentation actually changed detection."
            check: "No local change expected — this is normal, not a failure."
          - trigger: "requires root privileges"
            cause: "-f needs raw-socket access."
            fix: "Run with `sudo`."
            check: "Re-run with sudo."
      - step_id: e2
        title: "Hide among decoys"
        slot_target: ACTION_OPTIONS
        glossary_refs: [decoy]
        explanation:
          what: "`-D RND:5` (or a manual list like `-D 10.0.0.5,10.0.0.6,ME`) makes the scan appear to come from several addresses at once, yours mixed in among fake ones."
          why: "A target's logs will show 6 different 'attackers' instead of 1, adding noise and doubt about which was real. It is NOT true anonymity — a skilled analyst can often still work out which source was genuine from timing or response handling."
          where: "ACTION_OPTIONS; needs sudo."
        find_it: "RND:5 auto-generates 5 random decoy IPs for you — no need to invent your own for practice. Include ME in a manual list to control where your real IP sits in the sequence (default: random position)."
        command_anatomy:
          - {token: "sudo", does: "root privileges"}
          - {token: "nmap", does: "the program"}
          - {token: "-D RND:5", does: "scan alongside 5 randomly-generated decoy addresses"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "sudo nmap -D RND:5 scanme.nmap.org"
        success_criteria: "The scan runs and returns results normally — decoys change what the TARGET sees in its logs, not what you see in your terminal."
        expected_output: |
          PORT   STATE SERVICE
          22/tcp open  ssh
          80/tcp open  http
        alternatives:
          - trigger: "scan takes noticeably longer"
            cause: "Each decoy adds extra traffic nmap has to send alongside your real probes."
            fix: "Use fewer decoys (e.g. RND:2) if speed matters more than cover."
            check: "Expected trade-off — not a fault."
          - trigger: "requires root privileges"
            cause: "-D needs raw-socket access."
            fix: "Run with `sudo`."
            check: "Re-run with sudo."
      - step_id: e3
        title: "Spoof your source port"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "`-g 53` (or `--source-port 53`) makes your probes appear to originate from port 53 (DNS) instead of a random high port."
          why: "Some older firewalls are configured to automatically trust traffic FROM certain 'well-known' ports like 53 (DNS) or 80 (HTTP), assuming it's a reply to something they asked for. Faking the source port can exploit that misplaced trust."
          where: "ACTION_OPTIONS; needs sudo."
        find_it: "53 (DNS) and 88 (Kerberos) are common choices in write-ups — any port number 1-65535 works."
        command_anatomy:
          - {token: "sudo", does: "root privileges"}
          - {token: "nmap", does: "the program"}
          - {token: "-g 53", does: "make probes look like they're coming from port 53"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "sudo nmap -g 53 scanme.nmap.org"
        success_criteria: "Scan completes normally."
        expected_output: |
          PORT   STATE SERVICE
          22/tcp open  ssh
          80/tcp open  http
        alternatives:
          - trigger: "no visible difference from a normal scan"
            cause: "Expected — this only matters if a firewall in the path specifically trusts that source port. Most modern firewalls don't."
            fix: "Treat this as a targeted technique for specific known-misconfigured environments, not a general speed/stealth boost."
            check: "Not a failure — informational technique."
      - step_id: e4
        title: "Spoof your MAC address (local network only)"
        slot_target: ACTION_OPTIONS
        glossary_refs: [mac_spoofing]
        explanation:
          what: "`--spoof-mac 0` fakes the hardware (MAC) address your machine appears to use; `0` means 'pick a random one for me'. You can also give a vendor name (e.g. `Apple`) or a real MAC address."
          why: "Useful for local-network engagements where you don't want your real laptop's MAC logged. It has NO effect on remote/internet targets — routers strip and replace MAC addresses at every hop, so this only matters on the same physical/Wi-Fi network segment."
          where: "ACTION_OPTIONS; needs sudo."
        find_it: "0 is the easy option (random). Only target hosts on your OWN local network/lab for this to matter at all."
        command_anatomy:
          - {token: "sudo", does: "root privileges"}
          - {token: "nmap", does: "the program"}
          - {token: "--spoof-mac 0", does: "use a random MAC address instead of your real one"}
          - {token: "<target>", does: "the host to scan (must be on the same local network)"}
        try_this: "sudo nmap --spoof-mac 0 192.168.1.10"
        success_criteria: "nmap prints the spoofed MAC it's using near the top of its output, then scans normally."
        expected_output: |
          Spoofing MAC address 8A:1F:C2:AA:11:02 (Unknown)
          PORT   STATE SERVICE
          22/tcp open  ssh
        alternatives:
          - trigger: "target is not on your local network and nothing seems to change"
            cause: "MAC addresses never leave the local network segment — this is expected, not a bug."
            fix: "Only use this against local/lab targets if you want it to matter."
            check: "Confirm the target is on the same subnet as you (compare with `ip a`)."
      - step_id: e5
        title: "Pad, spoof and corrupt your packets further"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "`--ttl <n>` sets the IP time-to-live field (real OSes have telltale default TTLs — 64 Linux, 128 Windows — so a custom value can mislead OS-fingerprinting tools watching your traffic). `--data-string`/`--data`/`--data-length` append extra bytes to each probe (readable text, raw hex, or random padding). `--badsum` deliberately sends a WRONG checksum — a real TCP/IP stack silently drops bad-checksum packets, so any reply at all means something else (a naive firewall/IDS, not the real OS) answered instead. `--proxies` relays your connection through HTTP/SOCKS4 proxies."
          why: "Each is a narrow, situational technique: TTL/data padding mostly confuse automated traffic-fingerprinting tools, not humans reading logs; --badsum is specifically a firewall/IDS DETECTOR, not a stealth technique; --proxies genuinely changes your visible source."
          where: "ACTION_OPTIONS."
        find_it: "No new input needed for most of these — they're all optional add-ons to a scan you already know how to run."
        command_anatomy:
          - {token: "nmap --badsum", does: "send deliberately-corrupt checksums"}
          - {token: "<target>", does: "the host to test"}
        try_this: "sudo nmap --badsum -p 80 scanme.nmap.org"
        success_criteria: "Usually NO reply at all — a correctly-behaving stack silently drops bad-checksum packets."
        expected_output: |
          Note: Host seems down. If it is really up, but blocking our ping probes, try -Pn
          Nmap done: 1 IP address (0 hosts up) scanned in 3.21s
        alternatives:
          - trigger: "you actually get a normal-looking response"
            cause: "Something between you and the target isn't validating checksums properly — often a load balancer, proxy, or a security device inspecting/rewriting traffic rather than the real OS stack."
            fix: "That's a genuine finding worth noting — treat it as 'something in the path answered on the real host's behalf', not as a normal open/closed result."
            check: "Cross-reference with a normal scan to see if the behavior differs."
  - flow_id: stealth_scans
    title: "Stealth & uncommon scan types (reference, advanced)"
    goal: "Beyond -sS/-sT/-sU: the rest of nmap's scan-technique family, and when each is actually useful."
    command_builder_id: nmap
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: st1
        title: "See a target list without scanning anything (-sL)"
        slot_target: ACTION_OPTIONS
        glossary_refs: [list_scan]
        explanation:
          what: "`-sL` resolves and lists every target you specified — no packets sent to any of them at all."
          why: "A dry run: confirms your target range/CIDR expands to what you actually meant BEFORE you commit to a real scan (especially useful for big ranges)."
          where: "ACTION_OPTIONS."
        find_it: "Any target expression, especially one you're unsure about (a big CIDR range, a hostname list)."
        command_anatomy:
          - {token: "nmap", does: "the program"}
          - {token: "-sL", does: "list only — resolve names, print targets, send nothing"}
          - {token: "192.168.1.0/28", does: "the range to expand and check"}
        try_this: "nmap -sL 192.168.1.0/28"
        success_criteria: "Every address in the range prints, with a hostname if one resolves — no scan actually ran."
        expected_output: |
          Nmap scan report for 192.168.1.0
          Nmap scan report for 192.168.1.1
          Nmap scan report for 192.168.1.2
          ...
          Nmap scan report for 192.168.1.15
          Nmap done: 16 IP addresses (0 hosts up) scanned in 0.01s
        alternatives:
          - trigger: "\"0 hosts up\" — looks like a failure"
            cause: "That's correct and expected — -sL never checks if anything is up, it only lists."
            fix: "Not a failure. If the count/range looks right, you're ready to run a real scan next."
            check: "Confirm the address count matches what you expected from the CIDR."
      - step_id: st2
        title: "Null, FIN and Xmas scans — slip past simple stateless filters"
        slot_target: ACTION_OPTIONS
        glossary_refs: [stealth_scan_family]
        explanation:
          what: "`-sN`/`-sF`/`-sX` send TCP packets with unusual flag combinations (no flags / just FIN / FIN+PSH+URG) that a real connection attempt never produces. An open port stays silent; a closed port sends RST back."
          why: "Some simple, stateless firewalls only block packets that look like a normal connection START (SYN) — these odd packets can slip through unnoticed. They're also a bit cheaper/quieter than a full SYN scan on some setups."
          where: "ACTION_OPTIONS; needs sudo (raw packet crafting)."
        find_it: "No new input — try this on a target you've already SYN-scanned, to compare."
        command_anatomy:
          - {token: "sudo nmap", does: "root needed for raw packets"}
          - {token: "-sN", does: "Null scan (no flags set at all) — swap for -sF (FIN) or -sX (Xmas: FIN+PSH+URG)"}
          - {token: "<target>", does: "the host to scan"}
        try_this: "sudo nmap -sN scanme.nmap.org"
        success_criteria: "A port table prints — but read it carefully, see the alternatives below before trusting it."
        expected_output: |
          PORT   STATE         SERVICE
          22/tcp open|filtered ssh
          80/tcp open|filtered http
        alternatives:
          - trigger: "everything shows open|filtered, nothing definitively 'open'"
            cause: "This is the expected shape for these scans, not a failure — no reply from an open port is genuinely ambiguous (could be open, could be a firewall silently dropping it). Only a returned RST (closed) is unambiguous."
            fix: "Compare against a -sS/-sT scan of the same target for a more definite open/closed answer; use -sN/-sF/-sX specifically to test firewall behavior, not as your primary discovery method."
            check: "Cross-reference with the SYN/connect scan results from earlier steps."
          - trigger: "target is a Windows host and everything shows closed"
            cause: "Windows TCP stacks don't follow the RFC behavior these scans rely on — they reply RST regardless of real port state, making the technique useless against Windows targets specifically."
            fix: "Use -sS/-sT/-sV against Windows hosts instead; this is a known, documented nmap limitation, not a bug in your command."
            check: "If you know/suspect the target is Windows, skip straight to -sS."
      - step_id: st3
        title: "ACK, Window and Maimon scans — map the firewall, not the ports"
        slot_target: ACTION_OPTIONS
        glossary_refs: [ack_window_maimon]
        explanation:
          what: "`-sA` sends a TCP ACK (as if replying to a connection that doesn't exist). It can't tell you open vs closed — only whether a stateful firewall is filtering that port at all. `-sW` is the same probe but occasionally CAN distinguish open from closed via a TCP window-size quirk on certain systems. `-sM` (Maimon, FIN+ACK) trips up specific BSD-derived stacks."
          why: "Different question than a normal scan: 'where is the firewall actually filtering' rather than 'what's listening'. Useful for mapping firewall rulesets specifically."
          where: "ACTION_OPTIONS; needs sudo."
        find_it: "A target you suspect sits behind a stateful firewall/ACL."
        command_anatomy:
          - {token: "sudo nmap -sA", does: "ACK scan — maps filtered vs unfiltered, not open vs closed"}
          - {token: "<target>", does: "the host to probe"}
        try_this: "sudo nmap -sA scanme.nmap.org"
        success_criteria: "Ports print as 'unfiltered' (a stateful device let the ACK through) or 'filtered' (something dropped it) — NOT open/closed."
        expected_output: |
          PORT    STATE      SERVICE
          22/tcp  unfiltered ssh
          80/tcp  unfiltered http
          443/tcp filtered   https
        alternatives:
          - trigger: "I wanted to know if the port is OPEN, but it just says unfiltered"
            cause: "That's the whole point of -sA — it deliberately can't tell you open/closed, only filtered/unfiltered. Different question, same tool."
            fix: "Use -sS/-sT/-sW for actual open/closed status; use -sA specifically when you want firewall-mapping information."
            check: "Confirm which question you're actually trying to answer before picking the scan type."
      - step_id: st4
        title: "IP protocol scan and SCTP — below and beside TCP/UDP"
        slot_target: ACTION_OPTIONS
        glossary_refs: [ip_protocol_scan, sctp]
        explanation:
          what: "`-sO` asks a different question than every scan above: not 'which PORT is open' but 'which IP PROTOCOL NUMBERS (TCP=6, UDP=17, ICMP=1, GRE=47...) does this host respond to at all'. `-sY`/`-sZ` scan SCTP (a TCP/UDP alternative used mostly in telecom signaling) the way -sS/-sT scan TCP."
          why: "-sO is a layer below normal scanning — useful for spotting VPN/tunnel protocols (GRE, ESP) a host supports. SCTP scanning matters almost exclusively if you know the target runs telecom/VoIP signaling infrastructure."
          where: "ACTION_OPTIONS; needs sudo."
        find_it: "-sO: any host, as a broader recon step. -sY/-sZ: only worth running if you have a specific reason to suspect SCTP services."
        command_anatomy:
          - {token: "sudo nmap -sO", does: "IP protocol scan — which protocol numbers respond"}
          - {token: "<target>", does: "the host"}
        try_this: "sudo nmap -sO scanme.nmap.org"
        success_criteria: "A table of protocol numbers/names with open/closed/filtered states, instead of ports."
        expected_output: |
          PROTOCOL STATE         SERVICE
          1        open         icmp
          6        open         tcp
          17       open|filtered udp
        alternatives:
          - trigger: "this looks nothing like a normal port scan output"
            cause: "Correct — -sO reports PROTOCOLS, not ports, by design."
            fix: "Not an error; this is a genuinely different kind of scan from everything else in this app."
            check: "Compare the STATE column meaning against the explanation above, not against a port-scan table."

  - flow_id: idle_scan
    title: "Idle (zombie) scan — completely blind, completely anonymous (reference, advanced)"
    goal: "Scan a target without ANY packet ever appearing to come from you — by bouncing off a third host."
    command_builder_id: nmap
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: iz1
        title: "Find a candidate zombie host"
        slot_target: null
        glossary_refs: [idle_scan]
        explanation:
          what: "An idle scan needs a third machine (the 'zombie') that is (a) genuinely idle — not sending/receiving other traffic — and (b) uses predictable, incrementing IP ID numbers in its packets. nmap watches how the zombie's IP ID changes to infer your real target's port states, without ever sending the target a packet that has your address on it."
          why: "This is the most indirect, hardest-to-trace nmap technique that exists — the target's logs show the ZOMBIE scanning it, never you. Most modern OSes (Linux, current Windows) randomize IP IDs specifically to defeat this, so candidates are genuinely rare today."
          where: "You supply the zombie as an argument to -sI, separately from the real target."
        find_it: >
          nmap ships a helper for this: `nmap -O <candidate-host>` sometimes reports an
          "IP ID Sequence Generation" line — "Incremental" means it's a viable zombie candidate,
          "Random" means it isn't. Old, lightly-used embedded devices/printers on a LAN are the
          classic (if now rare) example.
        command_anatomy:
          - {token: "nmap -O", does: "OS detection also reports IP ID sequence behavior"}
          - {token: "192.168.1.50", does: "the candidate zombie you're checking"}
        try_this: "sudo nmap -O 192.168.1.50 | grep 'IP ID'"
        success_criteria: "A line reading 'IP ID Sequence Generation: Incremental' (viable) rather than 'Random' or 'All zeros' (not viable)."
        expected_output: |
          IP ID Sequence Generation: Incremental
        alternatives:
          - trigger: "no IP ID line printed, or it says Random/All zeros"
            cause: "This host isn't a usable zombie — most modern systems aren't."
            fix: "Try other idle hosts on the network (old printers, embedded devices are classic candidates); if none work, this technique simply isn't available on this network right now — that's normal, not a failure of your command."
            check: "Test a few candidates; expect most modern hosts to fail this check."
      - step_id: iz2
        title: "Run the idle scan"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "`-sI <zombie>[:port]` runs the scan against your real target, using the zombie you found in step 1 to relay/infer the results."
          why: "The whole point: your own address never appears in any packet sent to the real target."
          where: "ACTION_OPTIONS; -sI takes the zombie host (and optional probe port) as its argument."
        find_it: "The zombie host from step 1; the real target from your earlier reconnaissance."
        command_anatomy:
          - {token: "sudo nmap -sI", does: "idle/zombie scan mode"}
          - {token: "192.168.1.50:80", does: "the zombie host, and (optionally) which port to probe it on"}
          - {token: "<target>", does: "the REAL host you're actually interested in"}
        try_this: "sudo nmap -sI 192.168.1.50:80 scanme.nmap.org"
        success_criteria: "A normal-looking port table for the real target — obtained without ever sending it a packet carrying your address."
        expected_output: |
          Idle scan using zombie 192.168.1.50 (192.168.1.50:80); Class: Incremental
          PORT   STATE SERVICE
          22/tcp open  ssh
          80/tcp open  http
        alternatives:
          - trigger: "\"Idlescan zombie ... port ... cannot be used because it has been idle\""
            cause: "The zombie wasn't actually idle — something else was talking to it during the scan, corrupting the IP ID sequence nmap was tracking."
            fix: "Pick a quieter zombie candidate, or re-run at a time it's less likely to be in use."
            check: "Re-check the IP ID sequence test from step 1 right before scanning."
          - trigger: "results look identical to a normal scan you ran directly"
            cause: "That's success — the RESULTS should look the same as a direct scan; what's different is invisible to you: the target's logs never show your IP."
            fix: "Not a failure — this technique's value is in what the TARGET sees, not in what you see."
            check: "The point of this flow was stealth, not different data."

  - flow_id: advanced_discovery
    title: "Advanced host discovery — ping types, IPv6, DNS control (reference)"
    goal: "Choose exactly HOW nmap decides a host is 'up', beyond the default and -Pn."
    command_builder_id: nmap
    slots: [PROGRAM, GLOBAL_OPTIONS, TARGET_PIVOT, ACTION_OPTIONS]
    steps:
      - step_id: ad1
        title: "Pick a specific ping probe type"
        slot_target: ACTION_OPTIONS
        glossary_refs: [ping_type]
        explanation:
          what: "By default nmap's host-discovery uses a mix of probes. -PS<ports> (TCP SYN), -PA<ports> (TCP ACK), -PU<ports> (UDP), -PY<ports> (SCTP), -PE (ICMP echo — classic 'ping'), -PP (ICMP timestamp), -PM (ICMP netmask) each force ONE specific probe type."
          why: "Firewalls often block ICMP ping (the classic 'ping' command) but allow, say, a SYN to port 80/443 through — picking the right probe type is how you find a host that the default discovery wrongly reports as down."
          where: "ACTION_OPTIONS; combine several if you want, nmap tries them all."
        find_it: "A host you suspect is up but that -sn/plain nmap reports as down. Try a port you know is likely open (80, 443, 22)."
        command_anatomy:
          - {token: "sudo nmap -PS80,443", does: "TCP SYN ping to ports 80 and 443"}
          - {token: "-PE", does: "also try classic ICMP echo"}
          - {token: "<target>", does: "the host to check"}
        try_this: "sudo nmap -PS80,443 -PE -sn scanme.nmap.org"
        success_criteria: "The host reports as 'up' via a specific probe type, even if the default discovery missed it."
        expected_output: |
          Nmap scan report for scanme.nmap.org (45.33.32.156)
          Host is up (0.11s latency).
        alternatives:
          - trigger: "still shows down / no response to any probe type"
            cause: "The host may genuinely be firewalled against everything, or truly offline."
            fix: "Fall back to -Pn to just assume it's up and scan anyway — the port scan itself is often more informative than host discovery on a well-firewalled target."
            check: "Try -Pn directly on the actual scan, skip discovery entirely."
      - step_id: ad2
        title: "IPv6, DNS control, and traceroute"
        slot_target: GLOBAL_OPTIONS
        glossary_refs: [ip_protocol]
        explanation:
          what: "-6 scans over IPv6 instead of IPv4 (the target must be a real IPv6 address/hostname). -R always resolves DNS names for every target (default only resolves when it seems useful); --dns-servers picks specific resolvers; --system-dns uses your OS's resolver instead of nmap's own faster parallel one; --traceroute maps the network path to each host."
          why: "IPv6-only services are invisible to an IPv4 scan entirely — a genuinely different address family, not a flag tweak. The DNS/traceroute options are smaller conveniences for specific situations (corporate DNS split-horizon, network-path mapping)."
          where: "GLOBAL_OPTIONS — these apply to the whole run."
        find_it: "For -6: an IPv6 address/hostname (find one with `dig AAAA <host>`). The rest need no special input."
        command_anatomy:
          - {token: "nmap -6", does: "scan over IPv6"}
          - {token: "--traceroute", does: "also map the network path"}
          - {token: "<ipv6-target>", does: "an IPv6 address/hostname"}
        try_this: "nmap -6 --traceroute scanme.nmap.org"
        success_criteria: "A normal scan report, plus a TRACEROUTE section listing each network hop."
        expected_output: |
          Nmap scan report for scanme.nmap.org (2600:3c01::f03c:91ff:fe18:bb2f)
          PORT   STATE SERVICE
          22/tcp open  ssh
          TRACEROUTE
          HOP RTT     ADDRESS
          1   0.40 ms 2600:3c01::1
        alternatives:
          - trigger: "\"Failed to resolve ... Note that you can't use '/mask' AND '1-4,7,100-' style IP ranges\" or no IPv6 address found"
            cause: "The target genuinely has no IPv6 (AAAA) record — not every host does."
            fix: "Check first with `dig AAAA <host>`; if nothing returns, that host simply isn't reachable over IPv6."
            check: "Confirm an AAAA record exists before troubleshooting further."

  - flow_id: target_exclusion
    title: "Target lists, exclusions & random targets (reference)"
    goal: "Scan/exclude hosts from files, or generate random research targets."
    command_builder_id: nmap
    slots: [PROGRAM, TARGET_PIVOT, EXTRA_FILES]
    steps:
      - step_id: te1
        title: "Exclude specific hosts from a range"
        slot_target: null
        explanation:
          what: "`--exclude host1,host2` skips those hosts even though they'd otherwise match your target range; `--excludefile <file>` does the same from a saved list."
          why: "Common in engagements with an explicit exclusion list (production database servers, monitoring systems you're told to leave alone) that sits inside an otherwise-authorized range."
          where: "A standalone flag, not tied to any slot position."
        find_it: "Your authorized scope should specify exactly which hosts are excluded, if any — never guess."
        command_anatomy:
          - {token: "nmap 192.168.1.0/24", does: "the range to scan"}
          - {token: "--exclude 192.168.1.1,192.168.1.5", does: "skip these specific hosts"}
        try_this: "nmap --exclude 192.168.1.1,192.168.1.5 192.168.1.0/24"
        success_criteria: "The scan runs over the range but the excluded hosts never appear in results."
        expected_output: |
          (results for the range, minus .1 and .5)
        alternatives:
          - trigger: "excluded host still appears in results"
            cause: "A typo in the exclude list, or it's specified differently than it appears in your target range (hostname vs IP)."
            fix: "Match the exact form (IP vs hostname) used in your target range."
            check: "Re-check the exact spelling/format of the excluded address."
      - step_id: te2
        title: "Random targets (research use only)"
        slot_target: null
        explanation:
          what: "`-iR <num>` makes nmap pick that many random public IP addresses to scan, instead of you supplying any target at all."
          why: "Almost never something you have authorization to do — scanning random internet hosts you don't own or have permission for is exactly the unauthorized-scanning problem this app's authorization gate exists to prevent. Documented here for completeness, not as something to actually run outside specific nmap-internal research use."
          where: "Replaces the target entirely."
        find_it: "There is no legitimate 'find_it' here for normal use — this flag exists for nmap's own internet-scale research use, not for you."
        command_anatomy:
          - {token: "nmap -iR 100", does: "pick 100 random public IPs and scan them"}
          - {token: "-Pn -p 80", does: "typically paired with skip-discovery and a narrow port, in nmap's own documented examples"}
        try_this: "# Do not run this against the real internet without a specific, documented, authorized research purpose."
        success_criteria: "N/A — this step is informational, not a recommended action."
        expected_output: |
          (not applicable — see explanation)
        alternatives:
          - trigger: "considering running this for practice"
            cause: "It's tempting because it needs no target input at all."
            fix: "Don't. Use scanme.nmap.org or your own lab/VMs for practice instead — those are the addresses actually offered for that purpose."
            check: "Re-read the authorization gate at the top of this tool."

quick_build:
  builder: nmap
  title: "Quick scan"
  fields:
    - field_id: profile
      label: "Profile"
      type: choice
      default: standard
      choices: [quick, standard, thorough, quiet]
      help: "Preset scan intensity (timing + scan type). Leave as-is unless you want to set scan type/ports yourself below."
    - field_id: targets
      label: "Targets"
      type: string
      required: true
      placeholder: "scanme.nmap.org  or  192.168.1.0/24"
    - field_id: scan_type
      label: "Scan type (overrides profile)"
      type: choice
      choices: ["-sS", "-sT", "-sU", "-sn", "-sL", "-sA", "-sW", "-sM", "-sN", "-sF", "-sX", "-sO", "-sY", "-sZ"]
      help: "-sS SYN/-sT connect/-sU UDP/-sn ping-only/-sL list-only (no scanning) are the everyday ones. -sA/-sW/-sM (ACK/Window/Maimon) and -sN/-sF/-sX (Null/FIN/Xmas) are stealth/firewall-mapping techniques — see the 'Stealth & uncommon scan types' reference flow. -sO is IP protocol scan, -sY/-sZ are SCTP. Leave blank to use the profile's default."
    - field_id: ports
      label: "Ports"
      type: string
      placeholder: "22,80,443  (optional)"
    - field_id: all_ports
      label: "Scan all 65535 ports (-p-)"
      type: bool
      help: "Overrides Ports/Top ports above. Slow."
    - field_id: top_ports
      label: "Top N most common ports (--top-ports)"
      type: int
      placeholder: "e.g. 100  (optional)"
    - field_id: fast
      label: "Fast mode — top 100 ports only (-F)"
      type: bool
    - field_id: service_version
      label: "Detect service versions (-sV)"
      type: bool
    - field_id: os_detect
      label: "Detect operating system (-O, needs sudo)"
      type: bool
    - field_id: aggressive
      label: "Aggressive: OS + version + scripts + traceroute (-A)"
      type: bool
      help: "Bundles service_version + os_detect + default NSE scripts + traceroute into one flag. Thorough but loud/slow."
    - field_id: scripts
      label: "NSE script(s) or category (--script)"
      type: string
      placeholder: "default, safe, vuln, or a script name  (optional)"
    - field_id: script_args
      label: "NSE script arguments (--script-args)"
      type: string
      placeholder: "optional, only if a script needs them"
    - field_id: timing
      label: "Timing template 0-5 (-T)"
      type: int
      placeholder: "0=slowest/stealthiest, 5=fastest/loudest — profile already sets one"
    - field_id: no_dns
      label: "Skip DNS lookups (-n)"
      type: bool
      help: "Faster; use when you already have IPs."
    - field_id: skip_host_discovery
      label: "Skip the up-check, assume host is up (-Pn)"
      type: bool
      help: "Use when a target blocks ping but you know it's live."
    - field_id: verbose
      label: "Verbose output (-v)"
      type: bool
    - field_id: reason
      label: "Show WHY each port was marked that state (--reason)"
      type: bool
    - field_id: interface
      label: "Network interface (-e)"
      type: string
      placeholder: "eth0  (optional — auto-detected normally)"
    - field_id: input_list
      label: "Read targets from a file (-iL)"
      type: path
      placeholder: "~/targets.txt  (optional, overrides/adds to Targets)"
    - field_id: privileged
      label: "Run with sudo"
      type: bool
      help: "Needed for -sS/-O/-sU and every evasion option below. If left off, the app still tells you when a scan needs it."
    - field_id: fragment
      label: "Fragment packets (-f)"
      type: bool
      help: "Splits probes into smaller pieces — may slip past older/simpler firewalls. Needs sudo."
    - field_id: decoys
      label: "Decoy addresses (-D)"
      type: string
      placeholder: "RND:5  or  decoy1,decoy2,ME  (optional)"
      help: "Hides your real IP among fake ones in the target's logs. RND:5 generates 5 random decoys. Needs sudo."
    - field_id: source_port
      label: "Spoof source port (-g)"
      type: int
      placeholder: "e.g. 53  (optional)"
      help: "Some firewalls trust traffic FROM certain ports (like 53/DNS). Needs sudo."
    - field_id: spoof_mac
      label: "Spoof MAC address (--spoof-mac)"
      type: string
      placeholder: "0 = random, or a vendor name, or a real MAC  (optional)"
      help: "Only affects the local network segment (MAC addresses don't cross routers). Needs sudo."
    - field_id: spoof_source_ip
      label: "Spoof source IP (-S)"
      type: string
      placeholder: "10.0.0.99  (optional, advanced)"
      help: "Replies won't come back to you — mainly for triggering IDS alerts under a different identity, not for getting real results. Set Interface + Skip host discovery too. Needs sudo."
    - field_id: proxies
      label: "Relay through proxies (--proxies)"
      type: string
      placeholder: "http://127.0.0.1:8080,socks4://10.0.0.1:1080  (optional)"
    - field_id: data_string
      label: "Append ASCII payload (--data-string)"
      type: string
      placeholder: "optional"
    - field_id: data_length
      label: "Append random padding bytes (--data-length)"
      type: int
      placeholder: "optional"
    - field_id: ip_options
      label: "IP options (--ip-options)"
      type: string
      placeholder: "advanced/rare, optional"
    - field_id: ttl
      label: "Set IP time-to-live (--ttl)"
      type: int
      placeholder: "optional"
    - field_id: badsum
      label: "Send bogus checksums (--badsum)"
      type: bool
      help: "Real stacks drop these; a reply means something (a firewall/IDS, not the real stack) answered instead."

    - field_id: idle_zombie
      label: "Idle/zombie scan host (-sI)"
      type: string
      placeholder: "zombie-host[:port]  (advanced — see the Idle scan reference flow)"
    - field_id: scan_flags
      label: "Custom TCP flags (--scanflags)"
      type: string
      placeholder: "URGACKPSHRSTSYNFIN combination, e.g. SYNFIN  (advanced, optional)"
    - field_id: ftp_bounce
      label: "FTP bounce relay host (-b)"
      type: string
      placeholder: "legacy technique, optional"

    - field_id: ping_syn
      label: "TCP SYN ping ports (-PS)"
      type: string
      placeholder: "22,80,443  (optional — use when default host discovery is blocked)"
    - field_id: ping_ack
      label: "TCP ACK ping ports (-PA)"
      type: string
      placeholder: "80  (optional)"
    - field_id: ping_udp
      label: "UDP ping ports (-PU)"
      type: string
      placeholder: "53  (optional)"
    - field_id: ping_sctp
      label: "SCTP ping ports (-PY)"
      type: string
      placeholder: "optional"
    - field_id: ping_echo
      label: "ICMP echo ping (-PE)"
      type: bool
    - field_id: ping_timestamp
      label: "ICMP timestamp ping (-PP)"
      type: bool
    - field_id: ping_netmask
      label: "ICMP netmask ping (-PM)"
      type: bool
    - field_id: ping_protocol
      label: "IP protocol ping (-PO)"
      type: string
      placeholder: "1,6,17  (optional, advanced)"
    - field_id: resolve_all
      label: "Always resolve DNS (-R)"
      type: bool
    - field_id: dns_servers
      label: "Custom DNS servers (--dns-servers)"
      type: string
      placeholder: "1.1.1.1,8.8.8.8  (optional)"
    - field_id: system_dns
      label: "Use OS's own DNS resolver (--system-dns)"
      type: bool
    - field_id: traceroute
      label: "Traceroute to each host (--traceroute)"
      type: bool
    - field_id: ipv6
      label: "Scan over IPv6 (-6)"
      type: bool
      help: "Target must be a real IPv6 address/hostname too."

    - field_id: exclude
      label: "Exclude hosts (--exclude)"
      type: string
      placeholder: "10.0.0.5,10.0.0.6  (optional)"
    - field_id: exclude_file
      label: "Exclude hosts from file (--excludefile)"
      type: path
      placeholder: "optional"
    - field_id: random_targets
      label: "Scan N random internet hosts (-iR)"
      type: int
      placeholder: "optional — replaces Targets entirely, RESEARCH/LAB USE ONLY"
      help: "Picks random public IPs. Almost never something you're authorized to do against the real internet — included for completeness, not everyday use."
    - field_id: exclude_ports
      label: "Exclude ports (--exclude-ports)"
      type: string
      placeholder: "optional"
    - field_id: sequential_ports
      label: "Scan ports in order, don't randomize (-r)"
      type: bool

    - field_id: version_intensity
      label: "Version-detection intensity 0-9 (--version-intensity)"
      type: int
      placeholder: "0=light .. 9=try everything, optional"
    - field_id: version_light
      label: "Version-detection: light/fast only (--version-light)"
      type: bool
    - field_id: version_trace
      label: "Show version-probe debug detail (--version-trace)"
      type: bool
    - field_id: osscan_limit
      label: "Only attempt OS detection on promising hosts (--osscan-limit)"
      type: bool
    - field_id: osscan_guess
      label: "Guess OS more aggressively (--osscan-guess)"
      type: bool

    - field_id: script_default
      label: "Run default scripts (-sC)"
      type: bool
      help: "Same as --script=default; ignored if you already filled in Scripts above."
    - field_id: script_args_file
      label: "NSE script args from a file (--script-args-file)"
      type: path
      placeholder: "optional"
    - field_id: script_trace
      label: "Show all NSE script traffic (--script-trace)"
      type: bool
    - field_id: script_updatedb
      label: "Update NSE script database (--script-updatedb)"
      type: bool
      help: "Doesn't scan anything — just refreshes /usr/share/nmap/scripts.db. Target not needed."
    - field_id: script_help
      label: "Show help for script(s) (--script-help)"
      type: string
      placeholder: "http-title  (optional — doesn't scan, target not needed)"

    - field_id: min_rate
      label: "Minimum packets/sec (--min-rate)"
      type: int
      placeholder: "optional — floor the speed, useful on large scans"
    - field_id: max_rate
      label: "Maximum packets/sec (--max-rate)"
      type: int
      placeholder: "optional — cap the speed, gentler on the network"
    - field_id: host_timeout
      label: "Give up on a host after (--host-timeout)"
      type: string
      placeholder: "30m  (optional)"
    - field_id: max_retries
      label: "Max probe retransmissions (--max-retries)"
      type: int
      placeholder: "optional — lower = faster but less reliable on lossy links"
    - field_id: scan_delay
      label: "Delay between probes (--scan-delay)"
      type: string
      placeholder: "1s  (optional)"
    - field_id: max_scan_delay
      label: "Max delay between probes (--max-scan-delay)"
      type: string
      placeholder: "optional"

    - field_id: debug
      label: "Debug output (-d)"
      type: bool
    - field_id: show_open_only
      label: "Show only open ports (--open)"
      type: bool
      help: "Hides closed/filtered noise — very commonly used on big scans."
    - field_id: packet_trace
      label: "Show every packet sent/received (--packet-trace)"
      type: bool
    - field_id: iflist
      label: "Print interfaces/routes, don't scan (--iflist)"
      type: bool
      help: "A diagnostic dump, not a scan — target not needed."
    - field_id: append_output
      label: "Append to output file instead of overwriting (--append-output)"
      type: bool
    - field_id: resume
      label: "Resume an aborted scan (--resume)"
      type: path
      placeholder: "scan.gnmap  (optional — needs a previous -oN/-oG file)"
    - field_id: assume_privileged
      label: "Force-assume raw-socket privileges (--privileged)"
      type: bool
      help: "For when nmap's own auto-detection of your privilege level is wrong (e.g. Linux capabilities set on the binary instead of running as root)."
    - field_id: assume_unprivileged
      label: "Force-assume NO raw-socket privileges (--unprivileged)"
      type: bool
      help: "Makes nmap fall back to connect()-based techniques even if it could use raw sockets."
    - field_id: output_format
      label: "Save output as"
      type: choice
      choices: [normal, xml, grep, all]
      help: "Write results in this format (optional)."
    - field_id: output_path
      label: "Output base"
      type: path
      placeholder: "./out/scan  (optional)"
