terms:
  - term: mode
    definition: "gobuster's first argument, deciding what it enumerates: dir (web paths), dns (subdomains), vhost (virtual hosts), fuzz (custom keyword), tftp (files on a TFTP server), s3/gcs (cloud storage buckets)."
  - term: wordlist
    definition: "The list of candidates tried (dirb/SecLists on Kali)."
  - term: extension
    definition: "-x appends file types to each word (find files, not just dirs)."
  - term: status_code
    definition: "The HTTP response code; filter with -b (blacklist) or -s (whitelist), never both."
  - term: threads
    definition: "-t concurrent requests; higher = faster/louder."
  - term: subdomain
    definition: "A DNS subdomain enumerated in dns mode."
  - term: vhost
    definition: "A name-based virtual host served via the Host header on a shared IP."
  - term: redirect
    definition: "-r follows 3xx responses instead of just reporting them."
  - term: seclists
    definition: "The big wordlist collection (sudo apt install seclists)."
  - term: bucket
    definition: "A cloud storage container (AWS S3 or Google Cloud Storage). Bucket NAMES are often guessable (company-backup, company-dev) and misconfigured ones can be publicly readable — a common real-world data leak."
  - term: tftp
    definition: "Trivial File Transfer Protocol — an old, simple, UNAUTHENTICATED file-transfer protocol (UDP port 69) still found on routers, switches, and VoIP phones for config/firmware transfer."
