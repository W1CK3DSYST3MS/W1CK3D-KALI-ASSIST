tool_id: gobuster
display_name: "gobuster"
binary_candidates: [gobuster]
categories: [web_app, reconnaissance]
os_profile: kali
one_liner: "Brute-forces hidden web paths/files, subdomains, or virtual hosts from a wordlist."
authorization_gate: true
authorization_text: >
  Brute-forcing web content/subdomains on targets you don't own or aren't authorized
  to test is illegal and noisy (floods logs, can stress the server). Continue only for
  authorized targets. Practice on your own apps, DVWA/Juice Shop, HTB/THM. Pace with a
  sensible -t. Continue?
flows:
  - flow_id: guided
    title: "Guided first scan (START HERE)"
    goal: "From a web URL to a saved list of hidden paths — every input explained."
    command_builder_id: gobuster
    slots: [PROGRAM, GLOBAL_OPTIONS, TARGET_PIVOT, ACTION_OPTIONS, EXTRA_FILES]
    steps:
      - step_id: g1
        title: "Confirm you have a web target"
        slot_target: null
        glossary_refs: [mode, url, http_https]
        explanation:
          what: "gobuster's 'dir' mode guesses hidden paths on a WEB server, so you first need a URL like http://10.0.0.20 or https://site.com that actually serves web pages."
          why: "If the target isn't a web server (or you have the wrong port), every guess fails — confirm it responds first."
          where: "This URL goes after -u."
        find_it: >
          Not sure a host runs a website? Scan it with the nmap tool first — web servers usually
          sit on ports 80 (http) or 443 (https), sometimes 8080/8443. Then the URL is
          http://HOST (port 80) or https://HOST (port 443). Only test hosts you own or are
          authorized to.
        command_anatomy:
          - {token: "curl", does: "fetch a URL from the command line"}
          - {token: "-s", does: "silent (hide the progress meter)"}
          - {token: "-I", does: "headers only — just checking it responds"}
          - {token: "http://TARGET", does: "your web target"}
        try_this: "curl -sI http://TARGET"
        success_criteria: "You get an HTTP response line (200, 301, 403, etc.) — it's a web server."
        expected_output: |
          HTTP/1.1 200 OK
          Server: Apache/2.4.41 (Ubuntu)
          Content-Type: text/html; charset=UTF-8
        alternatives:
          - trigger: "connection refused / no response"
            cause: "Nothing is serving web on that port."
            fix: "Find the real web port with nmap (`nmap -p- TARGET`), then use http://TARGET:PORT."
            check: "curl gets an HTTP response."
          - trigger: "SSL/certificate error on https"
            cause: "The site uses a self-signed certificate."
            fix: "That's fine for testing — gobuster's -k flag (later steps) skips certificate checks."
            check: "You know to add -k for https targets."
      - step_id: g2
        title: "Choose a wordlist"
        slot_target: null
        glossary_refs: [wordlist, seclists]
        explanation:
          what: "gobuster tries every line of a wordlist as a path (/admin, /login, /backup...). Kali ships good lists under /usr/share/wordlists and /usr/share/seclists."
          why: "The wordlist IS the scan — a good, right-sized list finds more with less noise."
          where: "The file path goes after -w."
        find_it: >
          A solid starter list: /usr/share/wordlists/dirb/common.txt (about 4600 entries). For
          more, install SecLists (`sudo apt install seclists`) and use
          /usr/share/seclists/Discovery/Web-Content/common.txt. Check a list's size with wc -l.
        command_anatomy:
          - {token: "wc -l", does: "count the lines = number of paths it will try"}
          - {token: "/usr/share/wordlists/dirb/common.txt", does: "the wordlist file to inspect"}
        try_this: "wc -l /usr/share/wordlists/dirb/common.txt"
        success_criteria: "You see the list exists and how many paths it holds."
        expected_output: |
          4614 /usr/share/wordlists/dirb/common.txt
        alternatives:
          - trigger: "No such file or directory"
            cause: "The wordlists package isn't installed."
            fix: "Install it: `sudo apt install wordlists seclists`."
            check: "wc -l prints a count."
      - step_id: g3
        title: "Run your first directory scan"
        slot_target: TARGET_PIVOT
        glossary_refs: [status_code]
        explanation:
          what: "`dir` mode brute-forces paths. It prints each hit with its HTTP status code — 200 (OK), 301/302 (redirect), 403 (forbidden but exists!)."
          why: "This is gobuster's core job: revealing pages and folders that aren't linked anywhere."
          where: "dir is the mode; -u is the URL; -w is the wordlist."
        find_it: "Use the URL from step 1 and the wordlist from step 2. Add -k only if it's an https site with a self-signed cert."
        command_anatomy:
          - {token: "gobuster", does: "the program"}
          - {token: "dir", does: "mode: brute-force directories/files"}
          - {token: "-u http://TARGET", does: "the target URL"}
          - {token: "-w /usr/share/wordlists/dirb/common.txt", does: "the wordlist of paths to try"}
        try_this: "gobuster dir -u http://TARGET -w /usr/share/wordlists/dirb/common.txt"
        success_criteria: "Found paths print with status codes, e.g. /admin (Status: 301)."
        expected_output: |
          ===============================================================
          Gobuster v3.6
          ===============================================================
          /images               (Status: 301) [Size: 313]
          /admin                (Status: 301) [Size: 312]
          /login.php            (Status: 200) [Size: 1543]
          ===============================================================
        alternatives:
          - trigger: "everything returns 403 Forbidden"
            cause: "The server is blocking gobuster's default User-Agent."
            fix: "Pretend to be a browser: add `-a \"Mozilla/5.0\"`."
            check: "You start seeing 200/301 results."
          - trigger: "a flood of 200s that are all the same size"
            cause: "The app returns a 'soft 404' page (200 status for missing pages)."
            fix: "Note the repeated Size value and hide it: `--exclude-length <that-size>`."
            check: "Only real pages remain."
      - step_id: g4
        title: "Also hunt for files, not just folders"
        slot_target: ACTION_OPTIONS
        glossary_refs: [extension]
        explanation:
          what: "`-x php,txt,bak` makes gobuster try each word WITH those extensions too (admin.php, admin.txt, admin.bak)."
          why: "Interesting things are often files: config.php, backup.bak, notes.txt — not just directories."
          where: "ACTION_OPTIONS; -x lists the extensions."
        find_it: "Pick extensions that match the app: php for PHP sites, html/txt generally, bak/old/zip for backups."
        command_anatomy:
          - {token: "gobuster dir -u ... -w ...", does: "same directory scan as before"}
          - {token: "-x php,txt,bak", does: "also try each word with these file extensions"}
        try_this: "gobuster dir -u http://TARGET -w /usr/share/wordlists/dirb/common.txt -x php,txt,bak"
        success_criteria: "Discovered files with those extensions appear (e.g. /config.php)."
        expected_output: |
          /index.php            (Status: 200) [Size: 1543]
          /config.php           (Status: 200) [Size: 0]
          /backup.bak           (Status: 200) [Size: 20481]
        alternatives:
          - trigger: "scan got much slower"
            cause: "Each extension multiplies the number of requests."
            fix: "That's expected; keep the extension list short and relevant."
            check: "It finishes; results are worth the wait."
      - step_id: g5
        title: "Save the results for later"
        slot_target: OUTPUT_OPTIONS
        explanation:
          what: "`-o found.txt` writes every hit to a file you can keep and feed into the next tool (like nikto)."
          why: "You'll want a record of discovered paths, and other tools can read the list."
          where: "OUTPUT_OPTIONS; -o names the file."
        find_it: "Choose a filename in a folder you can write to (your home). `mkdir -p ~/scans` to keep them together."
        command_anatomy:
          - {token: "gobuster dir -u ... -w ...", does: "the scan"}
          - {token: "-o ~/scans/gobuster.txt", does: "save all found paths to this file"}
        try_this: "mkdir -p ~/scans && gobuster dir -u http://TARGET -w /usr/share/wordlists/dirb/common.txt -o ~/scans/gobuster.txt"
        success_criteria: "The scan runs and ~/scans/gobuster.txt lists the found paths (check with `cat`)."
        expected_output: |
          (terminal shows the hits, and:)
          $ cat ~/scans/gobuster.txt
          /admin                (Status: 301) [Size: 312]
          /login.php            (Status: 200) [Size: 1543]
        alternatives:
          - trigger: "Permission denied writing the file"
            cause: "You tried to write to a folder you don't own."
            fix: "Write under your home: `-o ~/scans/gobuster.txt` (make the folder with mkdir -p first)."
            check: "The file is created."
  - flow_id: first_dir
    title: "Directory scan (reference)"
    goal: "Find hidden paths on a web target."
    command_builder_id: gobuster
    slots: [PROGRAM, GLOBAL_OPTIONS, TARGET_PIVOT, ACTION_OPTIONS, EXTRA_FILES]
    steps:
      - step_id: gd1
        title: "Run a dir scan with a wordlist"
        slot_target: TARGET_PIVOT
        glossary_refs: [mode, wordlist, status_code]
        explanation:
          what: "`dir -u <url> -w <wordlist>` brute-forces paths; `-k` skips TLS verify for self-signed HTTPS."
          why: "Reveals hidden directories/files by status code."
          where: "mode is the subcommand; -u in TARGET_PIVOT; -w in EXTRA_FILES."
        find_it: "A web URL (from nmap) and a wordlist (/usr/share/wordlists/dirb/common.txt)."
        command_anatomy:
          - {token: "dir", does: "directory brute-force mode"}
          - {token: "-u https://10.0.0.20", does: "the target URL"}
          - {token: "-w .../common.txt", does: "the wordlist"}
          - {token: "-k", does: "skip TLS certificate checks (self-signed https)"}
        try_this: "gobuster dir -u https://10.0.0.20 -w /usr/share/wordlists/dirb/common.txt -k"
        success_criteria: "Found paths print with status codes (e.g. /admin (Status: 301))."
        expected_output: |
          /admin                (Status: 301) [Size: 312]
          /index.html           (Status: 200) [Size: 10701]
        alternatives:
          - trigger: "connection refused / no web server"
            cause: "Target port isn't a web service, or wrong scheme/port."
            fix: "Confirm the web port with nmap first; set -u https://host:8443."
            check: "Re-run with the correct scheme/port."
          - trigger: "everything 403/Forbidden"
            cause: "Server blocks the scanner User-Agent."
            fix: "Set a normal UA with -a \"<user-agent>\"."
            check: "Compare results with a browser UA."
  - flow_id: wordlists_ext
    title: "Wordlists + extensions (reference)"
    goal: "Find files (not just dirs) using extensions."
    command_builder_id: gobuster
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS, EXTRA_FILES]
    steps:
      - step_id: gw1
        title: "Add file extensions with -x"
        slot_target: ACTION_OPTIONS
        glossary_refs: [extension, seclists]
        explanation:
          what: "`-x php,txt,bak` appends extensions to each word; SecLists/dirb ship on Kali."
          why: "Catches pages and backups, not just folders."
          where: "ACTION_OPTIONS (-x); -w in EXTRA_FILES."
        find_it: "Choose extensions matching the tech (php/asp), plus bak/old/zip for backups."
        command_anatomy:
          - {token: "-x php,txt", does: "also try each word with these extensions"}
          - {token: "-w .../Web-Content/common.txt", does: "a SecLists web-content wordlist"}
        try_this: "gobuster dir -u https://site -w /usr/share/seclists/Discovery/Web-Content/common.txt -x php,txt"
        success_criteria: "Discovered files with those extensions appear."
        expected_output: |
          /index.php            (Status: 200) [Size: 1543]
          /robots.txt           (Status: 200) [Size: 122]
        alternatives:
          - trigger: "SecLists missing"
            cause: "SecLists not installed."
            fix: "Install it: sudo apt install seclists."
            check: "Re-run after install."
      - step_id: gw2
        title: "Shape dir-mode output: full URLs, slashes, backups, and prechecks"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "`-e` (--expanded) prints the full URL instead of just the path. `--add-slash` appends / to every request (useful for frameworks that only serve a directory listing with the trailing slash). `--discover-backup` automatically also tries common backup-file suffixes (~, .bak, .swp, .old...) on every FOUND file. `--no-status` hides the status-code column. `--hide-length` hides the body-size column. `-X <file>` reads extensions from a file instead of typing them with -x. `--force` skips gobuster's own precheck (it normally refuses to run if the wordlist looks unreadable, the URL looks wrong, etc.) — only use this once you've confirmed the precheck's complaint is a false alarm."
          why: "These don't change WHAT gets found — they change how much of that is spelled out for you, and --discover-backup automates a manual step (trying admin.php~ after finding admin.php) most people forget to do by hand."
          where: "ACTION_OPTIONS; dir-mode-only flags."
        find_it: "No new input for most of these — add them to a scan you already know how to run. -X needs a text file with one extension per line (no leading dot)."
        command_anatomy:
          - {token: "gobuster dir -u ... -w ...", does: "same directory scan as before"}
          - {token: "-e", does: "print full URLs (http://site/admin) instead of bare paths (/admin)"}
          - {token: "--discover-backup", does: "on every hit, also try common backup-file suffixes"}
        try_this: "gobuster dir -u http://TARGET -w /usr/share/wordlists/dirb/common.txt -e --discover-backup"
        success_criteria: "Results show full URLs, and any found file also gets checked for backup copies (e.g. config.php.bak)."
        expected_output: |
          http://TARGET/admin              (Status: 301) [Size: 312]
          http://TARGET/config.php         (Status: 200) [Size: 1543]
          http://TARGET/config.php.bak     (Status: 200) [Size: 1601]
        alternatives:
          - trigger: "'the tool refuses to start / precheck failed' but you're confident the target/wordlist is fine"
            cause: "gobuster's built-in sanity check (reachability, wordlist readability) flagged something it thinks is wrong."
            fix: "Only after actually confirming it's a false alarm, add --force to continue anyway. Don't reach for this as a first response to an error — read the precheck message first."
            check: "Re-read the exact precheck error before deciding to override it."
  - flow_id: status_filter
    title: "Status-code filtering (reference)"
    goal: "Get signal, not noise — pick whitelist OR blacklist."
    command_builder_id: gobuster
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS, EXTRA_FILES]
    steps:
      - step_id: gs1
        title: "Filter status codes"
        slot_target: ACTION_OPTIONS
        glossary_refs: [status_code]
        explanation:
          what: "`-b 404,403` blacklists; `-s 200,301,302` whitelists; `--exclude-length` hides soft-404 sizes."
          why: "gobuster's default changed between versions — check `gobuster version`. You CANNOT set both -b and -s."
          where: "ACTION_OPTIONS."
        find_it: "Decide which codes are noise (usually 404/403) OR which you want (200/301) — not both."
        command_anatomy:
          - {token: "-b 404,403", does: "hide these status codes (blacklist)"}
          - {token: "-s 200,301,302", does: "show ONLY these (whitelist) — don't combine with -b"}
          - {token: "--exclude-length N", does: "hide responses of size N (soft-404s)"}
        try_this: "gobuster dir -u https://site -w common.txt -b 404,403"
        success_criteria: "Only meaningful responses are shown."
        expected_output: |
          /admin                (Status: 301) [Size: 312]
          /uploads              (Status: 200) [Size: 894]
        alternatives:
          - trigger: "status-codes and status-codes-blacklist are both set"
            cause: "Both whitelist and blacklist supplied."
            fix: "Clear one — pick whitelist OR blacklist."
            check: "Re-run with only -b or only -s."
          - trigger: "flood of false 200s"
            cause: "Soft-404 pages return 200 with a fixed body."
            fix: "Use --exclude-length on the soft-404 size."
            check: "Note the common body length and exclude it."
  - flow_id: perf_tls
    title: "Threads, TLS & reliability (reference)"
    goal: "Tune speed vs load."
    command_builder_id: gobuster
    slots: [PROGRAM, GLOBAL_OPTIONS, TARGET_PIVOT, EXTRA_FILES]
    steps:
      - step_id: gp1
        title: "Set threads and TLS handling"
        slot_target: GLOBAL_OPTIONS
        glossary_refs: [threads]
        explanation:
          what: "`-t <n>` threads (default 10); `-k` skip TLS verify; `--timeout`, `--retry` for reliability."
          why: "High threads are faster but hammer the target — be a good neighbor."
          where: "GLOBAL_OPTIONS."
        find_it: "No new input — tune numbers on a scan you can already run."
        command_anatomy:
          - {token: "-t 50", does: "use 50 concurrent threads (default is 10)"}
          - {token: "-k", does: "skip TLS certificate verification"}
        try_this: "gobuster dir -u https://site -w common.txt -t 50 -k"
        success_criteria: "Scan completes without flooding errors."
        expected_output: |
          Progress: 4614 / 4615 (99.98%)
          (completes faster, no timeout errors)
        alternatives:
          - trigger: "errors/timeouts under load"
            cause: "Too many threads or server rate-limiting."
            fix: "Lower -t and raise --timeout."
            check: "Re-run at -t 20."
      - step_id: gp2
        title: "Retries, HTTP timeout, and quieting the noise"
        slot_target: GLOBAL_OPTIONS
        glossary_refs: [throttle]
        explanation:
          what: "`--timeout <dur>` caps how long gobuster waits per HTTP request before giving up (default 10s). `--retry` re-tries a request that timed out, up to `--retry-attempts` times. `-d <dur>` (--delay) pauses that long between every request per thread — the real throttle knob for a fragile target. `--no-progress` and `--no-error` quiet the live progress bar / error lines. `--no-color` strips ANSI colour codes (useful when piping to a file or another tool). `--debug` prints extra internal detail."
          why: "A flaky network or slow server causes false 'not found' results if gobuster gives up too fast — --retry/--timeout make results more trustworthy. --delay is the real pacing control if -t (threads) alone is still too aggressive. The noise-reduction flags matter once you start piping gobuster's output into a file or another tool."
          where: "GLOBAL_OPTIONS; shared by every mode."
        find_it: "No new input — add these to a scan you already know how to run. --delay takes a duration like 500ms or 1s."
        command_anatomy:
          - {token: "gobuster dir -u ... -w ...", does: "same directory scan as before"}
          - {token: "--timeout 15s", does: "wait up to 15 seconds per request before giving up"}
          - {token: "--retry --retry-attempts 2", does: "retry a timed-out request up to 2 times"}
          - {token: "-d 500ms", does: "pause 500ms between each thread's requests — the real speed brake"}
        try_this: "gobuster dir -u http://TARGET -w /usr/share/wordlists/dirb/common.txt --timeout 15s --retry --retry-attempts 2 -d 500ms"
        success_criteria: "Fewer spurious errors/timeouts on a slow or rate-limited target, at the cost of a slower overall scan."
        expected_output: |
          Progress: 4614 / 4615 (99.98%)
          (no timeout errors, noticeably slower than the default)
        alternatives:
          - trigger: "still timing out constantly"
            cause: "The server is genuinely overloaded or actively rate-limiting you."
            fix: "Lower -t (threads) first — retries/timeout tuning can't fix a target that's actively throttling or blocking you."
            check: "Try -t 5 with the same timeout/retry settings."
  - flow_id: auth_headers
    title: "Auth, headers, cookies, redirects (reference)"
    goal: "Scan authenticated areas."
    command_builder_id: gobuster
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS, EXTRA_FILES]
    steps:
      - step_id: ga1
        title: "Send cookies/headers and follow redirects"
        slot_target: ACTION_OPTIONS
        glossary_refs: [redirect]
        explanation:
          what: "`-c \"session=…\"` cookies; `-H \"Authorization: …\"` headers; `-r` follow 3xx."
          why: "Without -r a 301 is reported, not followed; auth lets you reach protected paths."
          where: "ACTION_OPTIONS."
        find_it: "Log into the app in a browser, open dev tools -> Application/Storage -> Cookies, copy the session cookie value."
        command_anatomy:
          - {token: "-c \"PHPSESSID=abc\"", does: "send this session cookie (keeps you logged in)"}
          - {token: "-H \"Authorization: Bearer ...\"", does: "send a custom header (e.g. API token)"}
          - {token: "-r", does: "follow redirects instead of just reporting them"}
        try_this: "gobuster dir -u https://site -w common.txt -c \"PHPSESSID=abc\" -r"
        success_criteria: "Authenticated paths resolve and redirects are followed."
        expected_output: |
          /dashboard            (Status: 200) [Size: 4210]
          /account              (Status: 200) [Size: 1877]
        alternatives:
          - trigger: "still unauthorized"
            cause: "Cookie/header invalid or expired."
            fix: "Refresh the session value; verify the header format."
            check: "Test the cookie in a browser."
      - step_id: ga2
        title: "Or use HTTP Basic Auth directly"
        slot_target: ACTION_OPTIONS
        glossary_refs: [basic_auth]
        explanation:
          what: "`-U username -P password` sends credentials via HTTP Basic Auth — the browser popup-style login, not a cookie/session."
          why: "Some areas are protected by Basic Auth instead of a login page/cookie. dir, vhost and fuzz modes support it; dns/tftp/s3/gcs don't (Basic Auth is an HTTP-only concept)."
          where: "ACTION_OPTIONS; only valid in dir/vhost/fuzz mode."
        find_it: "You need real, working credentials — either given to you for a lab/engagement, or ones you already found (e.g. via a login-form brute-force with hydra)."
        command_anatomy:
          - {token: "gobuster dir -u ... -w ...", does: "same directory scan as before"}
          - {token: "-U admin", does: "the Basic Auth username"}
          - {token: "-P hunter2", does: "the Basic Auth password"}
        try_this: "gobuster dir -u https://site -w common.txt -U admin -P hunter2"
        success_criteria: "Results appear instead of a wall of 401 Unauthorized."
        expected_output: |
          /admin-panel           (Status: 200) [Size: 3021]
        alternatives:
          - trigger: "everything is still 401 Unauthorized"
            cause: "Wrong credentials, or the area actually uses a login form/cookie instead of Basic Auth."
            fix: "Confirm the auth type: visit the URL in a browser — Basic Auth shows a native browser popup, a login form does not (use -c cookie instead, previous step)."
            check: "Verify credentials work in a browser first."
  - flow_id: cloud_and_tftp
    title: "Cloud buckets & TFTP (reference)"
    goal: "Find open S3/GCS storage buckets and TFTP files by name-guessing."
    command_builder_id: gobuster
    slots: [PROGRAM, TARGET_PIVOT, EXTRA_FILES]
    steps:
      - step_id: gc1
        title: "Guess S3 bucket names"
        slot_target: null
        glossary_refs: [bucket]
        explanation:
          what: "`s3 -w <list>` tries each wordlist entry as an AWS S3 bucket NAME (not a URL) and reports which ones exist and whether they're publicly readable."
          why: "Misconfigured buckets are a common real-world leak — company names, product names, and common suffixes (-backup, -dev, -assets) are worth trying."
          where: "s3 is the mode; there's no target/-u flag at all — the wordlist IS the input."
        find_it: "Build a small wordlist of likely names: the company/product name plus common suffixes (-backup, -dev, -prod, -assets, -logs). One name per line in a text file."
        command_anatomy:
          - {token: "gobuster", does: "the program"}
          - {token: "s3", does: "mode: AWS S3 bucket enumeration"}
          - {token: "-w names.txt", does: "the list of bucket names to try — this IS the target, there's no URL"}
        try_this: "gobuster s3 -w names.txt"
        success_criteria: "Buckets that exist are reported, with a note on whether they're publicly listable."
        expected_output: |
          Bucket: my-company-backup [Status: 200, Listable: true]
          Bucket: my-company-assets [Status: 403, Listable: false]
        alternatives:
          - trigger: "everything shows as not found"
            cause: "Bucket names are globally unique across all of AWS — your guesses just don't happen to exist."
            fix: "Try more realistic names based on real research (company name variations, known product names)."
            check: "This is normal — most guesses won't hit; it only takes one real find."
          - trigger: "you typed a URL and it didn't work"
            cause: "s3 mode has no target/-u flag — only -w matters."
            fix: "Put bucket name guesses in the wordlist file itself, not in the Target field."
            check: "Re-run with just -w."
      - step_id: gc2
        title: "Same idea for Google Cloud Storage"
        slot_target: null
        explanation:
          what: "`gcs -w <list>` is the same idea as s3 mode, but for Google Cloud Storage buckets."
          why: "Companies using GCP make the same bucket-naming mistakes as AWS users."
          where: "gcs is the mode; no target flag, same as s3."
        find_it: "Same wordlist approach as S3 — company/product name plus common suffixes."
        command_anatomy:
          - {token: "gobuster gcs -w names.txt", does: "try each name as a GCS bucket"}
        try_this: "gobuster gcs -w names.txt"
        success_criteria: "Existing buckets are reported."
        expected_output: |
          Bucket: my-company-data [Status: 200, Listable: true]
        alternatives:
          - trigger: "nothing found"
            cause: "Normal — same as S3, most guesses won't hit."
            fix: "Broaden the wordlist with realistic company/product name variations."
            check: "Not a failure."
      - step_id: gc3
        title: "Enumerate files on a TFTP server"
        slot_target: TARGET_PIVOT
        glossary_refs: [tftp]
        explanation:
          what: "`tftp -s <server> -w <list>` guesses FILENAMES that exist on a TFTP server (an old, simple, unauthenticated file-transfer protocol still found on network gear like routers/switches/VoIP phones)."
          why: "TFTP servers often hold device configs (sometimes with passwords) and firmware — worth checking if you find one open (UDP port 69) during a network scan."
          where: "tftp is the mode; -s (not -u) sets the server, since TFTP isn't HTTP-based."
        find_it: "Find a TFTP server first with an nmap UDP scan (`sudo nmap -sU -p 69 <target>`). Use a small filename-guessing list (config, startup-config, boot.img)."
        command_anatomy:
          - {token: "gobuster", does: "the program"}
          - {token: "tftp", does: "mode: TFTP file enumeration"}
          - {token: "-s 192.168.1.1", does: "the TFTP server address"}
          - {token: "-w filenames.txt", does: "filenames to try"}
        try_this: "gobuster tftp -s 192.168.1.1 -w filenames.txt"
        success_criteria: "Existing filenames are reported."
        expected_output: |
          Found: startup-config
        alternatives:
          - trigger: "connection refused / timeout"
            cause: "No TFTP service on that host, or it's UDP-filtered."
            fix: "Confirm with `sudo nmap -sU -p 69 <target>` first — UDP scans are slow, be patient."
            check: "Confirm port 69/udp is open before troubleshooting further."
      - step_id: gc4
        title: "Control how many files gobuster lists per found bucket"
        slot_target: ACTION_OPTIONS
        glossary_refs: [bucket]
        explanation:
          what: "`-m <n>` (--max-files) caps how many file names gobuster lists from inside each publicly-readable bucket it finds (default 5). `--show-files` (on by default, no CLI switch to turn it off) makes it list those files at all rather than just reporting the bucket exists."
          why: "A big, publicly-listable bucket can have thousands of objects — raising --max-files gives you more of the picture in one run; lowering it keeps output short when you just want to know WHICH buckets exist."
          where: "ACTION_OPTIONS; s3/gcs-mode-only."
        find_it: "No new input — add -m to the s3/gcs scan from the previous steps."
        command_anatomy:
          - {token: "gobuster s3 -w names.txt", does: "same bucket-name scan as before"}
          - {token: "-m 20", does: "list up to 20 files from each bucket found (default is 5)"}
        try_this: "gobuster s3 -w names.txt -m 20"
        success_criteria: "Found buckets list up to 20 files each instead of the default 5."
        expected_output: |
          Bucket: my-company-backup [Status: 200, Listable: true]
          my-company-backup/db-2024-01.sql.gz
          my-company-backup/db-2024-02.sql.gz
          ... (up to 20 entries)
        alternatives:
          - trigger: "still only see 5 files even after setting -m higher"
            cause: "The bucket itself only has 5 (or fewer) objects — -m is a ceiling, not a guarantee."
            fix: "Not a bug — that bucket is just small. Compare against a bucket you know has more objects."
            check: "N/A — this is expected when the bucket is genuinely small."
  - flow_id: dns_mode
    title: "DNS mode — subdomains (reference)"
    goal: "Enumerate subdomains of a domain."
    command_builder_id: gobuster
    slots: [PROGRAM, GLOBAL_OPTIONS, TARGET_PIVOT, ACTION_OPTIONS, EXTRA_FILES]
    steps:
      - step_id: gn1
        title: "Brute-force subdomains"
        slot_target: TARGET_PIVOT
        glossary_refs: [subdomain]
        explanation:
          what: "`dns --domain <domain> -w <list>` tries every wordlist entry as a subdomain and reports which ones resolve. gobuster prints the resolved IP alongside every hit automatically — there's no separate 'show IPs' flag to turn on."
          why: "Maps the attack surface beyond the main site."
          where: "dns subcommand; --domain in TARGET_PIVOT."
        find_it: >
          Use a registered domain you're authorized to test — replace <target-domain> below
          with it (example.com in the explanation above is just an illustration, not a real
          target) — and a DNS subdomain list from SecLists.
        command_anatomy:
          - {token: "dns", does: "subdomain brute-force mode"}
          - {token: "--domain <target-domain>", does: "the base domain — you type this in (no short flag on this gobuster version)"}
          - {token: "-w .../subdomains-top1million-5000.txt", does: "list of subdomain names to try"}
        try_this: "gobuster dns --domain <target-domain> -w /usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt"
        success_criteria: "Discovered subdomains print, each with its resolved IP address."
        expected_output: |
          Found: www.example.com [93.184.216.34]
          Found: mail.example.com [93.184.216.35]
        alternatives:
          - trigger: "nothing found / rate-limited"
            cause: "Resolver limits, small list, or wildcard DNS."
            fix: "Try a different resolver (--resolver 1.1.1.1), a bigger list; check for wildcard DNS (next step)."
            check: "If EVERY random guess resolves, suspect a wildcard — see the next step."
      - step_id: gn2
        title: "Wildcard DNS, CNAMEs, and a custom resolver"
        slot_target: ACTION_OPTIONS
        glossary_refs: [dns_wildcard]
        explanation:
          what: "`--wildcard` forces gobuster to keep going even when it detects wildcard DNS (a misconfigured zone that resolves EVERY subdomain, real or not — gobuster normally stops and warns you instead of wasting time on fake hits). `-c` (--check-cname) also records each hit's CNAME record. `--no-fqdn` stops gobuster auto-adding a trailing dot to the domain, letting your resolver's own DNS search-domain settings apply. `--resolver <server[:port]>` and `--protocol udp|tcp` point queries at a specific DNS server instead of your system default."
          why: "Wildcard DNS makes every single guess look like a 'find' — without noticing this you'd report hundreds of fake subdomains. A custom resolver also helps when your default DNS is slow, filtered, or you specifically want to query the target's own authoritative nameserver."
          where: "ACTION_OPTIONS; all dns-mode-only flags."
        find_it: "No new input — try --wildcard on a domain from step 1. For --resolver, any public resolver works for testing (1.1.1.1, 8.8.8.8)."
        command_anatomy:
          - {token: "gobuster dns --domain <target-domain> -w ...", does: "same subdomain scan as before"}
          - {token: "--wildcard", does: "continue even if wildcard DNS is detected (default: gobuster stops and warns)"}
          - {token: "--resolver 1.1.1.1", does: "use this DNS server instead of your system default"}
        try_this: "gobuster dns --domain <target-domain> -w /usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt --wildcard --resolver 1.1.1.1"
        success_criteria: "The scan runs to completion instead of stopping at a wildcard warning; results come from the resolver you chose."
        expected_output: |
          [-] Wildcard DNS found. IP address(es): 93.184.216.34
          [-] To force processing of Wildcard DNS, specify the '--wildcard' switch.
          (with --wildcard set, the scan continues instead of aborting here)
        alternatives:
          - trigger: "'Wildcard DNS found ... exiting' and the scan stops"
            cause: "gobuster detected the domain resolves random/nonexistent names too, and refuses to waste your time by default."
            fix: "Confirm it really is a wildcard (try a deliberately-random name with `dig randomjunk123.<domain>`); if so, either skip this domain or re-run with --wildcard knowing results will be noisy."
            check: "Every result after enabling --wildcard should be treated with more suspicion, not less."
    title: "VHost mode (reference)"
    goal: "Find name-based virtual hosts sharing an IP."
    command_builder_id: gobuster
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS, EXTRA_FILES]
    steps:
      - step_id: gv1
        title: "Brute-force Host headers"
        slot_target: ACTION_OPTIONS
        glossary_refs: [vhost]
        explanation:
          what: "`vhost -u <url> -w <list> --append-domain` brute-forces hostnames via the Host header."
          why: "Modern gobuster requires --append-domain to add the base domain to each word."
          where: "vhost subcommand; --append-domain in ACTION_OPTIONS."
        find_it: >
          Use the site's own URL (replace <target-url> below with it — https://example.com is
          just an illustration, not a real target) and a subdomain wordlist; --append-domain
          joins each word to the base domain.
        command_anatomy:
          - {token: "vhost", does: "virtual-host brute-force mode"}
          - {token: "-u <target-url>", does: "the target — you type this in, e.g. https://yoursite.com"}
          - {token: "--append-domain", does: "append the base domain to each word (required on modern gobuster)"}
        try_this: "gobuster vhost -u <target-url> -w /usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt --append-domain"
        success_criteria: "Hidden virtual hosts are reported."
        expected_output: |
          Found: dev.example.com (Status: 200) [Size: 5122]
          Found: staging.example.com (Status: 200) [Size: 4980]
        alternatives:
          - trigger: "all show same length (false positives)"
            cause: "The server returns a default page for unknown vhosts."
            fix: "Filter with --exclude-length on that size."
            check: "Note the default body length and exclude it."
      - step_id: gv2
        title: "Fine-tune vhost filtering"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "`--domain <domain>` sets the base domain to append when your URL is an IP address (if you leave it out and pass a domain-based URL, gobuster extracts the hostname from the URL itself). `--exclude-status <codes>` drops specific status codes from the results (separate from --exclude-length). `--exclude-hostname-length` automatically adjusts the length filter for each guess, since a longer/shorter hostname naturally shifts the response size a little even on an identical default page."
          why: "--exclude-hostname-length solves a subtler version of the false-positive problem in the previous step: even a 'same default page' response varies slightly in size because the hostname you guessed is embedded in it somewhere — a fixed --exclude-length can miss those near-misses."
          where: "ACTION_OPTIONS; vhost-mode-only flags."
        find_it: "Use an IP-based target URL from step 1. --domain is required in that case since there's no hostname in the URL to extract a base domain from."
        command_anatomy:
          - {token: "gobuster vhost -u http://10.0.0.20 -w ...", does: "vhost scan against an IP (no hostname to extract a domain from)"}
          - {token: "--domain example.com", does: "the base domain to append to each guessed word"}
          - {token: "--exclude-hostname-length", does: "auto-adjust the size filter per-guess instead of one fixed number"}
        try_this: "gobuster vhost -u http://10.0.0.20 -w /usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt --domain example.com --exclude-hostname-length"
        success_criteria: "Fewer false-positive 'found' vhosts than a plain --exclude-length filter would catch."
        expected_output: |
          Found: dev.example.com (Status: 200) [Size: 5122]
          (near-identical default-page sizes for non-existent vhosts are now filtered out)
        alternatives:
          - trigger: "still lots of false positives"
            cause: "The server's default vhost response varies for reasons beyond hostname length (timestamps, random IDs in the page)."
            fix: "Combine with --exclude-length on the common baseline size, or check a few by hand in a browser."
            check: "Compare 2-3 'found' results by hand to confirm they're real."
  - flow_id: output
    title: "Output & integration (reference)"
    goal: "Save results to feed the next tool."
    command_builder_id: gobuster
    slots: [PROGRAM, TARGET_PIVOT, OUTPUT_OPTIONS, EXTRA_FILES]
    steps:
      - step_id: go1
        title: "Write findings to a file"
        slot_target: OUTPUT_OPTIONS
        explanation:
          what: "`-o results.txt` saves findings; `-q` gives clean output to pipe."
          why: "Feed discovered paths/subdomains into nikto or other tools."
          where: "OUTPUT_OPTIONS."
        find_it: "Choose a writable path (your home)."
        command_anatomy:
          - {token: "-o dirs.txt", does: "save the found paths to this file"}
          - {token: "-q", does: "quiet — clean output, easy to pipe"}
        try_this: "gobuster dir -u https://site -w common.txt -o dirs.txt"
        success_criteria: "dirs.txt contains the discovered paths."
        expected_output: |
          $ cat dirs.txt
          /admin                (Status: 301) [Size: 312]
        alternatives:
          - trigger: "permission denied writing file"
            cause: "Output directory not writable."
            fix: "Pick a writable path (e.g. your home dir)."
            check: "Confirm the directory is writable."

  - flow_id: fuzz_mode
    title: "Fuzz mode — the FUZZ keyword, anywhere in the request (reference)"
    goal: "Understand gobuster's most flexible mode: replacing the literal word FUZZ in the URL, a header, or the request body."
    command_builder_id: gobuster
    slots: [PROGRAM, GLOBAL_OPTIONS, TARGET_PIVOT, ACTION_OPTIONS, EXTRA_FILES]
    steps:
      - step_id: fz1
        title: "What makes fuzz mode different"
        slot_target: null
        glossary_refs: [fuzz_keyword]
        explanation:
          what: "Every other mode (dir/dns/vhost) has ONE fixed place it substitutes wordlist entries — a URL path, a subdomain, a Host header. Fuzz mode has NO fixed place: you write the literal word FUZZ anywhere in the URL, in a header value, or in the request body, and gobuster substitutes each wordlist entry there instead."
          why: "This is what lets you brute-force things dir/dns/vhost mode simply can't reach: a query-string parameter value (?id=FUZZ), a specific header like an API key (X-API-Key: FUZZ), or a POST body field (username=admin&password=FUZZ)."
          where: "The FUZZ keyword goes wherever YOU put it — in the Target URL, in a Header, or in the Body field — not in a fixed slot."
        find_it: "Pick exactly one thing you want to brute-force: a URL parameter value, a header value, or a POST field. Put the word FUZZ (all caps, exactly that) in that one spot."
        command_anatomy:
          - {token: "gobuster fuzz", does: "the program, in fuzz mode"}
          - {token: "-u http://TARGET/page.php?id=FUZZ", does: "FUZZ sits in the query-string value — each wordlist entry gets tried as ?id=<entry>"}
          - {token: "-w wordlist.txt", does: "the values to substitute in place of FUZZ"}
        try_this: "gobuster fuzz -u \"http://TARGET/page.php?id=FUZZ\" -w /usr/share/wordlists/dirb/common.txt"
        success_criteria: "gobuster reports which substituted values produced a 'kept' response (see the status-filtering step next — fuzz mode's filtering works a little differently from dir mode)."
        expected_output: |
          ===============================================================
          Gobuster v3.8.2
          ===============================================================
          [+] FUZZ: 42          (Status: 200) [Size: 512]
          ===============================================================
        alternatives:
          - trigger: "'the URL/header/body must contain the keyword FUZZ' error"
            cause: "You ran fuzz mode without putting FUZZ anywhere — gobuster refuses to run because it wouldn't know what to substitute."
            fix: "Add the literal word FUZZ (all caps) somewhere in the URL, a header, or the body."
            check: "Re-check the exact spelling — it must be FUZZ, not fuzz or {FUZZ}."
          - trigger: "you actually just wanted to brute-force directories"
            cause: "dir mode already does that more simply — fuzz mode is for when the thing you want to brute-force ISN'T a URL path."
            fix: "Use dir mode instead (first_dir / wordlists_ext reference flows) unless you specifically need FUZZ in a parameter, header, or body."
            check: "Confirm dir mode can't already do what you need before reaching for fuzz mode."
      - step_id: fz2
        title: "FUZZ in a header — brute-force an API key or a custom header value"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "The same FUZZ keyword works inside a `-H` header value instead of the URL. gobuster still needs a real (non-FUZZ) URL via -u — only the header's VALUE contains FUZZ."
          why: "Some APIs authenticate via a header (X-API-Key, Authorization) rather than a URL parameter — this is the only gobuster mode that can brute-force that."
          where: "ACTION_OPTIONS (-H); -u still required and fixed."
        find_it: "A real, reachable URL, plus the exact header name the API expects (check API docs or a captured request in Burp)."
        command_anatomy:
          - {token: "gobuster fuzz -u http://TARGET/api/data", does: "a fixed, real URL — no FUZZ here this time"}
          - {token: "-H \"X-API-Key: FUZZ\"", does: "FUZZ sits inside the header VALUE — each wordlist entry gets tried as the key"}
          - {token: "-w apikeys.txt", does: "candidate API key values"}
        try_this: "gobuster fuzz -u http://TARGET/api/data -H \"X-API-Key: FUZZ\" -w apikeys.txt"
        success_criteria: "One or more candidate values return a different status/size than the rest (e.g. 200 instead of 401/403)."
        expected_output: |
          [+] FUZZ: sk-live-abc123     (Status: 200) [Size: 88]
        alternatives:
          - trigger: "everything returns the same 401/403"
            cause: "None of the candidates are valid, or the header name is wrong."
            fix: "Double-check the exact header name the API expects; confirm at least one known-good key returns 200 as a sanity check."
            check: "Test one confirmed-valid value manually with curl first."
      - step_id: fz3
        title: "FUZZ in the request body — brute-force a POST field"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "`-B`/`--body` sets the raw POST body, and FUZZ can go inside it too — e.g. a login form's password field. Pair with `-m POST` (method) since a body only makes sense on a request that actually sends one."
          why: "Login forms, search boxes, and other POST-based inputs aren't reachable by putting FUZZ in the URL — the body is where their data actually lives."
          where: "ACTION_OPTIONS (-B, -m); -u is still the fixed endpoint the POST goes to."
        find_it: "Capture a real login/form POST request (browser dev tools or Burp) to see the exact field names and body format expected."
        command_anatomy:
          - {token: "gobuster fuzz -u http://TARGET/login -m POST", does: "POST to a fixed login endpoint"}
          - {token: "-B \"username=admin&password=FUZZ\"", does: "the POST body; FUZZ sits in the password field"}
          - {token: "-w passwords.txt", does: "candidate passwords"}
        try_this: "gobuster fuzz -u http://TARGET/login -m POST -B \"username=admin&password=FUZZ\" -w passwords.txt"
        success_criteria: "One candidate produces a distinctly different response (redirect to a dashboard, different size/status) from all the failed attempts."
        expected_output: |
          [+] FUZZ: hunter2          (Status: 302) [Size: 0]
        alternatives:
          - trigger: "this looks like a login brute-force attack"
            cause: "It is — password-guessing against a live login form is exactly what this technique does."
            fix: "Only ever run this against systems you own or have explicit written authorization to test; consider hydra for large-scale credential attacks instead (purpose-built for this)."
            check: "Confirm authorization before running against any real login form."
      - step_id: fz4
        title: "Filtering fuzz-mode results"
        slot_target: ACTION_OPTIONS
        explanation:
          what: "Fuzz mode's status filter is `-b`/`--exclude-statuscodes` — an EXCLUDE list only, there's no whitelist (`-s`) counterpart like dir mode has. `--exclude-length` works the same as in dir mode."
          why: "Without filtering, a fuzz run against a parameter that always returns 200 (just with different content) buries the real finding in noise."
          where: "ACTION_OPTIONS; fuzz-mode-only status semantics."
        find_it: "Run once without filtering first to see what the 'normal/failed' response looks like, then exclude that pattern."
        command_anatomy:
          - {token: "gobuster fuzz -u ... -w ...", does: "the fuzz scan"}
          - {token: "-b 404", does: "exclude responses with this status code"}
          - {token: "--exclude-length 1234", does: "exclude responses of this exact body size (the common 'failed attempt' page)"}
        try_this: "gobuster fuzz -u \"http://TARGET/page.php?id=FUZZ\" -w common.txt --exclude-length 1234"
        success_criteria: "Only the genuinely different responses remain — not every single attempt."
        expected_output: |
          [+] FUZZ: 42          (Status: 200) [Size: 512]
        alternatives:
          - trigger: "everything still looks the same"
            cause: "The app doesn't vary status/size in a way that reveals success — it may need content comparison instead."
            fix: "Try -e (not available in fuzz mode) — instead manually diff a couple of full responses with curl to spot what actually differs."
            check: "curl a known-bad and a suspected-good value and diff the bodies by eye."

  - flow_id: pattern_resume
    title: "Replacement patterns & resuming large scans (reference)"
    goal: "Combine multiple wordlist substitutions per guess, and pick a big scan back up without starting over."
    command_builder_id: gobuster
    slots: [PROGRAM, TARGET_PIVOT, EXTRA_FILES]
    steps:
      - step_id: pr1
        title: "Replacement patterns — combine a word with extra context"
        slot_target: null
        glossary_refs: [replacement_pattern]
        explanation:
          what: "`-p <file>` (--pattern) reads a file of PATTERNS — each line can contain the placeholder {GOBUSTER} which gets replaced by every wordlist word, letting you test variations like {GOBUSTER}.bak, admin-{GOBUSTER}, or {GOBUSTER}/config on top of the plain wordlist itself. `--discover-pattern <file>` (--pd) applies a second pattern file only to words that ALREADY succeeded, to explore around a real find."
          why: "A wordlist alone gives you one shape per line. Patterns let you multiply a small wordlist into many realistic variations without hand-writing every combination."
          where: "A standalone flag alongside -w, not tied to any slot position."
        find_it: "Write a small text file, one pattern per line, using {GOBUSTER} where the wordlist word should go — e.g. `{GOBUSTER}.bak` and `.{GOBUSTER}.swp`."
        command_anatomy:
          - {token: "gobuster dir -u ... -w common.txt", does: "the normal directory scan"}
          - {token: "-p patterns.txt", does: "also try each pattern in this file, substituting {GOBUSTER} with the current word"}
        try_this: "printf '{GOBUSTER}.bak\\n{GOBUSTER}.old\\n' > patterns.txt && gobuster dir -u http://TARGET -w /usr/share/wordlists/dirb/common.txt -p patterns.txt"
        success_criteria: "Results include both the plain words AND the pattern variations (admin.bak, admin.old, ...)."
        expected_output: |
          /admin                (Status: 301) [Size: 312]
          /admin.bak            (Status: 200) [Size: 88]
        alternatives:
          - trigger: "'no {GOBUSTER} placeholder found' or patterns are ignored"
            cause: "A line in the pattern file doesn't contain the literal {GOBUSTER} placeholder."
            fix: "Every line in the pattern file needs {GOBUSTER} somewhere in it — plain text lines without it are invalid patterns."
            check: "Re-check each line of the pattern file for the exact placeholder spelling."
      - step_id: pr2
        title: "Resume a big scan from where it stopped"
        slot_target: null
        glossary_refs: [wordlist]
        explanation:
          what: "`--wordlist-offset <n>` skips the first N lines of the wordlist and starts from line N+1 — effectively resuming a scan that got interrupted partway through a large list."
          why: "Re-running a multi-hour scan against a huge wordlist from line 1 after a Ctrl+C or dropped connection wastes real time — the offset picks up close to where it stopped."
          where: "A standalone flag alongside -w."
        find_it: "Check the progress output/log from the interrupted run for how many entries it had already tried (gobuster's progress line shows a count like '128000 / 500000')."
        command_anatomy:
          - {token: "gobuster dir -u ... -w bigwordlist.txt", does: "the original scan"}
          - {token: "--wordlist-offset 128000", does: "skip the first 128000 lines, resume from there"}
        try_this: "gobuster dir -u http://TARGET -w bigwordlist.txt --wordlist-offset 128000"
        success_criteria: "The progress counter starts near 128000 instead of 0 — no re-scanning of already-tried entries."
        expected_output: |
          Progress: 128034 / 500000 (25.61%)
        alternatives:
          - trigger: "unsure of the exact offset / lost the progress count"
            cause: "The interrupted run's progress output wasn't saved."
            fix: "Estimate conservatively (round DOWN) — re-trying a few hundred already-tried entries costs seconds; skipping real ones costs findings."
            check: "When in doubt, use a smaller offset than you think you need."

  - flow_id: tls_client_certs
    title: "Client certificates, custom methods & network presentation (reference, advanced)"
    goal: "Authenticate at the TLS layer, change the HTTP method, and control which local interface/IP gobuster uses."
    command_builder_id: gobuster
    slots: [PROGRAM, TARGET_PIVOT, ACTION_OPTIONS, ENV_INTERFACE]
    steps:
      - step_id: tc1
        title: "Authenticate with a TLS client certificate"
        slot_target: ACTION_OPTIONS
        glossary_refs: [client_cert]
        explanation:
          what: "Some sites require a CLIENT certificate (not a server cert — YOUR machine proves its identity to the server) before they'll respond at all — common on internal/corporate apps. `--client-cert-pem`/`--client-cert-pem-key` supply a PEM cert+key pair; `--client-cert-p12`/`--client-cert-p12-password` supply a bundled .p12 file instead. `--tls-renegotiation` allows an older TLS handshake style some legacy servers still require."
          why: "Without the right client certificate, these servers refuse the TLS handshake before gobuster ever gets to send a single request — every attempt fails identically, which is a strong hint you need this."
          where: "ACTION_OPTIONS; HTTP-speaking modes only (dir/vhost/fuzz/s3/gcs)."
        find_it: "You'll be issued (or need to export) a client certificate for the specific engagement — this isn't something you generate yourself for a normal test. PEM files are plain text starting with -----BEGIN CERTIFICATE-----; .p12 is a binary bundle."
        command_anatomy:
          - {token: "gobuster dir -u https://internal.site -w ...", does: "the normal directory scan, but against a cert-gated site"}
          - {token: "--client-cert-pem client.pem", does: "the client's public certificate"}
          - {token: "--client-cert-pem-key client.key", does: "the matching private key (must have no password)"}
        try_this: "gobuster dir -u https://internal.site -w common.txt --client-cert-pem client.pem --client-cert-pem-key client.key"
        success_criteria: "Requests succeed where they previously all failed identically at the TLS handshake stage."
        expected_output: |
          /dashboard             (Status: 200) [Size: 4210]
        alternatives:
          - trigger: "'tls: certificate required' or every single request fails the same way"
            cause: "The server needs a client certificate and none was supplied (or the key has a password, which --client-cert-pem-key doesn't support)."
            fix: "Confirm you have the right cert+key pair for this specific target; strip any password from the key file first if needed."
            check: "Test the cert+key pair with curl --cert/--key first to isolate the problem from gobuster itself."
      - step_id: tc2
        title: "Override the HTTP method, and pick your network presentation"
        slot_target: ACTION_OPTIONS
        glossary_refs: [http_method]
        explanation:
          what: "`-m <METHOD>` (--method) sends every request with a different HTTP verb (POST, PUT, DELETE...) instead of the default GET — useful for APIs that only respond to specific methods, or fuzz mode's POST-body fuzzing (fz3 in the fuzz mode flow). `--no-canonicalize-headers` sends header NAMES exactly as you typed them instead of gobuster normalizing casing (X-custom-HEADER stays as-is instead of becoming X-Custom-Header) — some picky servers care about this. `--interface <name>` / `--local-ip <ip>` pick which network interface or local IP address gobuster sends from (mutually exclusive with each other)."
          why: "REST APIs often expose completely different (and more interesting) endpoints under PUT/DELETE than under GET. --interface/--local-ip matter on a multi-homed machine (VPN + regular network) where the wrong interface means your requests never reach the target at all."
          where: "ACTION_OPTIONS (-m, --no-canonicalize-headers); ENV_INTERFACE (--interface/--local-ip)."
        find_it: "For -m, check API documentation or a captured request for the method it actually expects. For --interface, list yours with `ip a`."
        command_anatomy:
          - {token: "gobuster dir -u http://TARGET/api -w ...", does: "the normal directory scan"}
          - {token: "-m PUT", does: "send every request as PUT instead of GET"}
          - {token: "--interface eth0", does: "send from this network interface specifically"}
        try_this: "gobuster dir -u http://TARGET/api -w common.txt -m PUT"
        success_criteria: "Different (often more revealing) results than the same scan run with the default GET."
        expected_output: |
          /users/1               (Status: 200) [Size: 340]
        alternatives:
          - trigger: "--interface and --local-ip together give an error"
            cause: "gobuster only accepts one way of specifying your outbound network identity, not both."
            fix: "Pick ONE — usually --interface is simpler unless you specifically need a non-default IP on that interface."
            check: "Re-run with only one of the two set."

quick_build:
  builder: gobuster
  title: "Quick brute"
  fields:
    - field_id: mode
      label: "Mode"
      type: choice
      required: true
      default: dir
      choices: [dir, dns, vhost, fuzz, tftp, s3, gcs]
      help: "dir=web paths, dns=subdomains, vhost=virtual hosts, fuzz=custom FUZZ keyword, tftp=TFTP server files, s3/gcs=cloud storage buckets (bucket names come from the wordlist alone, no target needed)."
    - field_id: target
      label: "Target (URL, domain, or TFTP server)"
      type: string
      placeholder: "http://host  or  example.com  (not used for s3/gcs)"
    - field_id: wordlist
      label: "Wordlist"
      type: path
      placeholder: "/usr/share/wordlists/dirb/common.txt"
    - field_id: extensions
      label: "Extensions (dir mode)"
      type: string
      placeholder: "php,html,txt"
    - field_id: threads
      label: "Threads"
      type: int
      placeholder: "40"
    - field_id: skip_tls
      label: "Skip TLS certificate check (-k)"
      type: bool
      help: "For self-signed HTTPS."
    - field_id: quiet
      label: "Quiet — no banner/noise (-q)"
      type: bool
    - field_id: status_whitelist
      label: "Show ONLY these status codes (-s)"
      type: string
      placeholder: "200,301,302  (don't combine with blacklist below)"
    - field_id: status_blacklist
      label: "Hide these status codes (-b)"
      type: string
      placeholder: "404,403"
    - field_id: exclude_length
      label: "Hide responses of this size (--exclude-length)"
      type: string
      placeholder: "1234  (for filtering soft-404 pages)"
    - field_id: follow_redirects
      label: "Follow redirects (-r)"
      type: bool
      help: "dir/vhost/fuzz only — in dns mode -r is a different flag (resolver), handled separately below."
    - field_id: append_domain
      label: "Append base domain to each word (--append-domain)"
      type: bool
      help: "vhost mode only — required on modern gobuster or the wordlist must already contain full hostnames."
    - field_id: cookie
      label: "Cookie (-c)"
      type: string
      placeholder: "PHPSESSID=abc123  (optional, for authenticated scans)"
    - field_id: header
      label: "Custom header (-H)"
      type: string
      placeholder: "Authorization: Bearer xyz  (optional)"
    - field_id: user_agent
      label: "User-Agent (-a)"
      type: string
      placeholder: "Mozilla/5.0 ...  (optional, if the server blocks the default)"
    - field_id: username
      label: "Basic Auth username (-U)"
      type: string
      placeholder: "optional — dir/vhost/fuzz modes only"
    - field_id: password
      label: "Basic Auth password (-P)"
      type: string
      placeholder: "optional — dir/vhost/fuzz modes only"
    - field_id: show_ips
      label: "Show resolved IPs (-i)"
      type: bool
      help: "dns mode only."
    - field_id: resolver
      label: "Custom DNS resolver (-r)"
      type: string
      placeholder: "1.1.1.1  (dns mode only, optional)"
    - field_id: output
      label: "Save results to file (-o)"
      type: path
      placeholder: "~/scans/gobuster.txt  (optional)"
    - field_id: proxy
      label: "Proxy (--proxy)"
      type: string
      placeholder: "http://127.0.0.1:8080  (optional, e.g. to route through Burp)"
